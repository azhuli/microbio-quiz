<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">

<title>微生物考題練習系統 (2021–2025)</title>

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');

  :root {
    --bg: #F5F0E8;
    --surface: #FDFAF5;
    --surface-2: #EDE5D8;
    --primary: #8B6848;
    --primary-light: #A67D5A;
    --accent: #5A7A3A;
    --danger: #9B3A2A;
    --warn: #B07030;
    --text: #2C1F0E;
    --text-2: #7A6050;
    --border: #D4C4A8;
    --radius: 12px;
    --shadow: 0 2px 12px rgba(107,76,42,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── TOP BAR ── */
  .topbar {
    background: var(--primary);
    color: white;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  }
  .topbar-title {
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .topbar-title .badge {
    background: rgba(255,255,255,0.18);
    font-size: 0.72rem;
    padding: 2px 8px;
    border-radius: 20px;
    font-weight: 500;
    letter-spacing: 0.05em;
  }
  .topbar-stats {
    display: flex;
    gap: 18px;
    font-size: 0.82rem;
    opacity: 0.9;
  }
  .stat-item { text-align: center; }
  .stat-val { font-family: 'JetBrains Mono', monospace; font-size: 1.1rem; font-weight: 600; line-height: 1.1; }
  .stat-label { font-size: 0.68rem; opacity: 0.75; }

  /* ── SCREENS ── */
  .screen { display: none; }
  .screen.active { display: block; }

  /* ── HOME ── */
  .home-wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 32px 20px;
  }
  .home-hero {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 32px 28px 24px;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
    border-left: 5px solid var(--primary);
  }
  .home-hero h1 { font-size: 1.5rem; color: var(--primary); margin-bottom: 6px; }
  .home-hero p { color: var(--text-2); font-size: 0.9rem; line-height: 1.6; }

  .cards-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
    text-align: center;
  }
  .stat-card .big { font-family: 'JetBrains Mono', monospace; font-size: 2.4rem; font-weight: 700; color: var(--primary); line-height: 1; }
  .stat-card .lbl { font-size: 0.8rem; color: var(--text-2); margin-top: 4px; }

  .mode-list { display: flex; flex-direction: column; gap: 12px; }
  .mode-btn {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 16px;
    transition: border-color 0.18s, transform 0.12s, box-shadow 0.18s;
    text-align: left;
    width: 100%;
    color: var(--text);
  }
  .mode-btn:hover { border-color: var(--primary); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(26,95,122,0.14); }
  .mode-btn.primary-btn { background: var(--primary); border-color: var(--primary); color: white; }
  .mode-btn.primary-btn:hover { background: var(--primary-light); border-color: var(--primary-light); }
  .mode-btn.warn-btn { border-color: var(--warn); }
  .mode-btn.warn-btn:hover { border-color: var(--warn); background: #EDE5D8; }
  .mode-icon { font-size: 1.8rem; flex-shrink: 0; }
  .mode-text strong { display: block; font-size: 1rem; margin-bottom: 2px; }
  .mode-text span { font-size: 0.8rem; color: var(--text-2); }
  .mode-btn.primary-btn .mode-text span { color: rgba(255,255,255,0.75); }
  .mode-btn.warn-btn { color: var(--text); }
  .mode-btn.warn-btn .mode-text span { color: var(--text-2); }
  .mode-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

  /* ── QUIZ ── */
  .quiz-wrap {
    max-width: 740px;
    margin: 0 auto;
    padding: 24px 16px 40px;
  }

  .quiz-progress-bar {
    background: var(--border);
    border-radius: 99px;
    height: 6px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .quiz-progress-fill {
    background: linear-gradient(90deg, var(--primary), #A67D5A);
    height: 100%;
    border-radius: 99px;
    transition: width 0.4s ease;
  }
  .quiz-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-size: 0.8rem;
    color: var(--text-2);
  }
  .quiz-meta .q-counter { font-family: 'JetBrains Mono', monospace; font-weight: 600; color: var(--primary); }
  .wrong-badge {
    background: #FDECEA;
    color: var(--danger);
    border-radius: 20px;
    padding: 2px 10px;
    font-size: 0.75rem;
    font-weight: 600;
  }

  .question-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 28px 24px 20px;
    box-shadow: var(--shadow);
    margin-bottom: 14px;
  }
  .question-year {
    font-size: 0.72rem;
    font-family: 'JetBrains Mono', monospace;
    color: var(--primary);
    background: var(--surface-2);
    padding: 2px 8px;
    border-radius: 6px;
    display: inline-block;
    margin-bottom: 10px;
    font-weight: 600;
  }
  .question-text {
    font-size: 0.97rem;
    line-height: 1.75;
    color: var(--text);
    margin-bottom: 20px;
    font-weight: 500;
  }

  .options-list { display: flex; flex-direction: column; gap: 10px; }
  .option-btn {
    background: var(--bg);
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 13px 16px;
    cursor: pointer;
    text-align: left;
    font-size: 0.9rem;
    line-height: 1.55;
    font-family: 'Noto Sans TC', sans-serif;
    color: var(--text);
    transition: border-color 0.15s, background 0.15s, transform 0.1s;
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }
  .option-btn:not(:disabled):hover { border-color: var(--primary); background: #EDE5D8; transform: translateX(2px); }
  .option-key {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 0.85rem;
    color: var(--primary);
    flex-shrink: 0;
    width: 22px;
  }
  .option-btn.correct { border-color: var(--accent); background: #EAF0E0; }
  .option-btn.correct .option-key { color: var(--accent); }
  .option-btn.wrong { border-color: var(--danger); background: #F5E8E4; }
  .option-btn.wrong .option-key { color: var(--danger); }
  .option-btn:disabled { cursor: default; }

  .feedback-box {
    background: var(--surface-2);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 0.85rem;
    color: var(--text-2);
    line-height: 1.5;
    display: none;
    margin-top: 14px;
  }
  .feedback-box.show { display: block; }
  .feedback-box.correct-fb { background: #EAF0E0; color: #3D5C20; border-left: 4px solid var(--accent); }
  .feedback-box.wrong-fb { background: #F5E8E4; color: #7A2A1A; border-left: 4px solid var(--danger); }

  .quiz-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 16px;
  }
  .back-home-btn {
    background: none;
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 0.88rem;
    font-family: 'Noto Sans TC', sans-serif;
    color: var(--text-2);
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .back-home-btn:hover { border-color: var(--primary); color: var(--primary); }
  .next-btn {
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 12px 28px;
    font-size: 0.95rem;
    font-family: 'Noto Sans TC', sans-serif;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    display: none;
  }
  .next-btn:hover { background: var(--primary-light); transform: translateY(-1px); }
  .next-btn.show { display: inline-block; }

  /* ── RESULT ── */
  .result-wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 32px 20px;
  }
  .result-hero {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 32px 24px;
    text-align: center;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
  }
  .result-emoji { font-size: 3rem; margin-bottom: 12px; }
  .result-score { font-family: 'JetBrains Mono', monospace; font-size: 3.5rem; font-weight: 700; color: var(--primary); line-height: 1; }
  .result-score-label { font-size: 0.85rem; color: var(--text-2); margin-top: 4px; margin-bottom: 16px; }
  .result-stats-row { display: flex; gap: 14px; justify-content: center; margin-top: 18px; }
  .r-stat { background: var(--bg); border-radius: 10px; padding: 12px 20px; min-width: 90px; }
  .r-stat .rv { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; font-weight: 700; }
  .r-stat .rl { font-size: 0.72rem; color: var(--text-2); margin-top: 2px; }
  .r-stat.green .rv { color: var(--accent); }
  .r-stat.red .rv { color: var(--danger); }

  .wrong-review {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 20px;
    overflow: hidden;
  }
  .wrong-review-header {
    padding: 16px 20px;
    background: #F5E8E4;
    color: var(--danger);
    font-weight: 700;
    font-size: 0.9rem;
    border-bottom: 1px solid #D4B0A4;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .wrong-item {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    font-size: 0.84rem;
    line-height: 1.5;
  }
  .wrong-item:last-child { border-bottom: none; }
  .wrong-item .wi-q { color: var(--text); margin-bottom: 5px; }
  .wrong-item .wi-ans { display: flex; gap: 14px; margin-top: 4px; font-size: 0.8rem; }
  .wi-yours { color: var(--danger); }
  .wi-correct { color: var(--accent); font-weight: 600; }

  .result-actions { display: flex; flex-direction: column; gap: 10px; }
  .btn {
    padding: 14px 20px;
    border-radius: var(--radius);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    border: none;
    transition: transform 0.1s, box-shadow 0.15s;
    text-align: center;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,0.14); }
  .btn-primary { background: var(--primary); color: white; }
  .btn-warn { background: var(--warn); color: white; }
  .btn-ghost { background: var(--surface); color: var(--text); border: 2px solid var(--border); }

  /* ── WRONG BANK ── */
  .bank-wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px; }
  .bank-header { margin-bottom: 16px; }
  .bank-header h2 { font-size: 1.15rem; color: var(--primary); }
  .bank-header p { font-size: 0.82rem; color: var(--text-2); margin-top: 2px; }
  .bank-item {
    background: var(--surface);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.07);
    font-size: 0.84rem;
    line-height: 1.55;
    border-left: 4px solid var(--danger);
  }
  .bank-item { cursor: pointer; }
  .bank-item .bi-q { color: var(--text); margin-bottom: 4px; font-weight: 500; }
  .bank-item .bi-meta { display: flex; gap: 14px; font-size: 0.78rem; color: var(--text-2); margin-top: 4px; }
  .bi-count { color: var(--danger); font-weight: 600; font-family: 'JetBrains Mono', monospace; }
  .bank-item .bi-expand { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
  .bank-item.open .bi-expand { display: block; }
  .bank-item .bi-toggle { float: right; font-size: 0.75rem; color: var(--text-2); }
  .bank-item.open .bi-toggle::after { content: '▲ 收合'; }
  .bank-item:not(.open) .bi-toggle::after { content: '▼ 展開'; }
  .bi-opts { list-style: none; padding: 0; margin: 6px 0 8px; font-size: 0.82rem; line-height: 1.7; }
  .bi-opts li { padding: 2px 0; }
  .bi-opts li.bi-correct-opt { color: var(--accent); font-weight: 700; }
  .bi-opts li.bi-wrong-opt { color: var(--danger); text-decoration: line-through; }
  .bank-clear-btn {
    background: #F5E8E4;
    color: var(--danger);
    border: 2px solid #D4B0A4;
    border-radius: 10px;
    padding: 10px 18px;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 16px;
  }
  .bank-clear-btn:hover { background: #D4B0A4; }
  .empty-state { text-align: center; padding: 48px 20px; color: var(--text-2); }
  .empty-state .es-icon { font-size: 3rem; margin-bottom: 12px; }
  .empty-state p { font-size: 0.9rem; }

  .transfer-row {
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }
  .transfer-btn {
    flex: 1;
    background: none;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    font-size: 0.82rem;
    font-family: 'Noto Sans TC', sans-serif;
    color: var(--text-2);
    cursor: pointer;
  }
  .transfer-btn:hover { border-color: var(--primary); color: var(--primary); }

  /* responsive */
  @media (max-width: 500px) {
    .topbar-stats { gap: 12px; }
    .cards-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    .question-card { padding: 20px 14px 14px; }
    .r-stat { padding: 10px 14px; min-width: 70px; }
  }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-title" id="topbar-title-debug">
    🧫 微生物考題練習
    <span class="badge">TTQAS 2021–2025</span>
  </div>
  <div class="topbar-stats">
    <div class="stat-item">
      <div class="stat-val" id="tb-total">0</div>
      <div class="stat-label">已作答</div>
    </div>
    <div class="stat-item">
      <div class="stat-val" id="tb-acc">—</div>
      <div class="stat-label">正確率</div>
    </div>
    <div class="stat-item">
      <div class="stat-val" id="tb-wrong-cnt">0</div>
      <div class="stat-label">錯誤庫</div>
    </div>
  </div>
</div>

<!-- HOME SCREEN -->
<div id="screen-home" class="screen active">
  <div class="home-wrap">
    <div class="home-hero">
      <h1>每日微生物練習</h1>
      <p>涵蓋 2021–2025 年題目（含第十三屆2025年100題），從題庫隨機抽取 50 題作答，系統自動記錄錯題，讓你重複練習直到完全掌握。</p>
    </div>
    <div class="cards-grid">
      <div class="stat-card">
        <div class="big" id="home-total">0</div>
        <div class="lbl">累計作答</div>
      </div>
      <div class="stat-card">
        <div class="big" id="home-acc">—</div>
        <div class="lbl">總正確率</div>
      </div>
      <div class="stat-card">
        <div class="big" id="home-sessions">0</div>
        <div class="lbl">練習次數</div>
      </div>
      <div class="stat-card">
        <div class="big" id="home-wrong">0</div>
        <div class="lbl">錯誤庫題數</div>
      </div>
    </div>
    <div class="mode-list">
      <button class="mode-btn primary-btn" onclick="startQuiz('random')">
        <span class="mode-icon">🎲</span>
        <span class="mode-text">
          <strong>隨機 50 題</strong>
          <span>從所有題目隨機抽取，每次不同組合</span>
        </span>
      </button>
      <button class="mode-btn warn-btn" onclick="startQuiz('wrong')" id="wrong-mode-btn">
        <span class="mode-icon">🔁</span>
        <span class="mode-text">
          <strong>錯題複習</strong>
          <span id="wrong-mode-desc">從錯誤庫中抽取練習（尚無錯題）</span>
        </span>
      </button>
      <button class="mode-btn" onclick="showScreen('screen-bank')">
        <span class="mode-icon">📋</span>
        <span class="mode-text">
          <strong>查看錯題庫</strong>
          <span>瀏覽所有記錄的錯誤題目</span>
        </span>
      </button>
    </div>
    <div class="transfer-row">
      <button class="transfer-btn" onclick="exportData()">📤 匯出資料</button>
      <button class="transfer-btn" onclick="importData()">📥 匯入資料</button>
    </div>
  </div>
</div>

<!-- QUIZ SCREEN -->
<div id="screen-quiz" class="screen">
  <div class="quiz-wrap">
    <div class="quiz-meta">
      <span class="q-counter" id="q-counter">1 / 50</span>
      <span class="wrong-badge" id="q-wrong-badge">✗ 0 題錯誤</span>
    </div>
    <div class="quiz-progress-bar">
      <div class="quiz-progress-fill" id="q-progress" style="width:0%"></div>
    </div>
    <div class="question-card">
      <div class="question-year" id="q-year">2014</div>
      <div class="question-text" id="q-text">題目載入中…</div>
      <div class="options-list" id="q-options"></div>
      <div class="feedback-box" id="q-feedback"></div>
    </div>
    <div class="quiz-nav">
      <button class="back-home-btn" onclick="confirmBack()">← 返回</button>

  { id:'2021-077', year:2021, q:'如腸桿菌科檢驗陰性，是否不用再進行沙門氏菌或其他腸內菌(如耶氏菌)之檢驗？(請選擇最適當之原因)', opts:['是，因為沙門氏菌為腸桿菌科微生物，為節省檢驗時程，可合併檢驗','是，因腸桿菌科為定量項目，沙門氏菌為定性項目，進行腸桿菌科等定量之檢驗結果若為未檢出，則不可能透過沙門氏菌增菌步驟，使其變為陽性','否，為確認食品是否有符合衛生標準之規定，故標準所訂項目均仍應加以檢驗','否，因為沙門氏菌非腸桿菌科','否，因為沙門氏菌屬於大腸桿菌群成員之一'], ans:'C' },

  { id:'2021-085', year:2021, q:'以下有關生化鑑定套組及鑑定軟體操作的敘述，何者是錯誤的？', opts:['實驗室於不同時間分離到的二株大腸桿菌，在RapID onE鑑定套組中的每一個生化反應呈色結果一定都相同','實驗室分離的二株菌株都是革蘭氏陰性桿菌，經氧化酶快速試驗確認為陰性，需使用同一RapID onE鑑定套組操作，但套組判讀後的鑑定密碼7碼中有1碼不同，輸入鑑定軟體判讀後，可能判讀為同一株菌','API鑑定軟體的菌名鑑定百分比(%)越高，該菌株的鑑定結果越可信','RapID鑑定軟體得到的可信度若低於95%，需依照鑑定軟體的建議，操作其他生化試驗(追加試驗)或是檢查操作與判讀過程中是否有問題','鑑定套組軟體的設計是利用統計學得到鑑定菌株的結果'], ans:'A' },

  { id:'2023-71', year:2023, q:'若以Real-time PCR進行沙門氏菌檢測，下列敘述何者錯誤？', opts:['可直接以食品樣本進行檢測','標準品可使用菌株或核酸','陰性對照組可使用大腸桿菌','死菌亦可被偵測','血清型仍需以抗血清進行測試'], ans:'A' },
  { id:'2023-72', year:2023, q:'以下有關生化鑑定套組及鑑定軟體操作的敘述，何者是錯誤的？(a)實驗室於不同時間分離到的二株大腸桿菌，在RapID onE鑑定套組中的每一個生化反應呈色結果一定都相同；(b)二株菌株都是革蘭氏陰性桿菌，氧化酶陰性後使用RapID onE，套組判讀後的鑑定密碼7碼中有1碼不同，不可能判讀為同一株菌；(c)API鑑定軟體的菌名鑑定百分比(%)越高，該菌株的鑑定結果越可信；(d)RapID鑑定軟體得到的可信度若低於95%，需依照鑑定軟體的建議操作追加試驗；(e)鑑定套組軟體的設計是利用統計學得到鑑定菌株的結果', opts:['a、b','b、c','c、d','d、e','a、e'], ans:'A' },
  { id:'2023-73', year:2023, q:'如下有關ICMSF的敘述，何者錯誤？', opts:['為國際食品微生物標準檢驗體系之一','不是官方的公告方法','屬於非標準方法，但為企業的標準','為International Commission on Microbiological Specification for Food的簡稱','屬於國際非政府組織提出的方法'], ans:'C' },
  { id:'2023-74', year:2023, q:'於腸道菌相相關領域乳酸菌屬於？', opts:['Probiotics','Prebiotics','Synbiotics','Postbiotics','Parabiotics'], ans:'A' },
  { id:'2023-75', year:2023, q:'課程中示範API與RapID鑑定套組，以下有關鑑定套組之敘述，何者是正確的？(a)API鑑定套組所需之新鮮純化菌落最多，接種菌液濃度需調整為McFarland 2；(b)二種鑑定套組需使用快速試驗，以區分出不同菌屬接下來要使用的鑑定套組；(c)RapID鑑定套組接種方式簡單，只需要將菌液倒入反應槽即可完成接種；(d)只有RapID鑑定套組提供網路版鑑定軟體，可雲端儲存所有鑑定紀錄；(e)二種鑑定套組都有套組選擇流程表，可鑑定常見食品病原菌', opts:['a、b、c','b、c、e','c、d、e','a、b、d','a、c、e'], ans:'B' },
  { id:'2023-76', year:2023, q:'依據國內食藥署公告的檢測方法或是採用經國際認證的市售試劑，以下何者關於李斯特菌定量檢測方法的描述為真？', opts:['需要使用BLEB前增殖24小時','可使用核酸定量技術','可使用顯色培養基搭配免疫鑑別方法進行單核李斯定量','市售快速檢驗片已獲得AOAC OMA李斯單核球定量法的認證','增菌液移種OX, MOX或PALCAM平板'], ans:'C' },
  { id:'2023-77', year:2023, q:'針對於食品中沙門氏菌的檢驗，以下何種檢測方法的敘述是正確的，才能符合當前國內政府規範或是國際標準(ex.AFNOR, AOAC)？', opts:['可以"不經過"前增殖(pre-enrichment)而直接操作核酸擴增法(NAT)','可以"不經過"前增殖，而直接操作側流式免疫層析法(lateral flow immunochromatography)','可以"不經過"前增殖而直接接種顯色培養基(chromogenic medium)','可以"不經過"前增殖而直接進行MALDI TOF質譜儀鑑定','任何食品微生物檢驗方法經過增菌才能進行進一步的檢驗操作流程'], ans:'E' },
  { id:'2023-78', year:2023, q:'以濾膜法測定樣品時，使用之濾杯刻度合格應在多少誤差範圍內？', opts:['± 1%','±2.5%','±5%','±10%','±50%'], ans:'B' },

  { id:'2023-87', year:2023, q:'針對細菌培養基的品管控管，下列何者的敘述是錯誤的？', opts:['品保部門需要定期進行內部稽核，以確認品質系統的維持性','可以在GMP/QMS的文件內容中，找到針對含血培養基的品管標準','倉儲部門需要將儲存區域做好劃分及標示，避免取貨出現異常','品質控管是一系列降低風險及執行確效的手段，目的是為了維持產品品質','以上皆正確'], ans:'B' },

  { id:'2024-01', year:2024, q:'培養基配製後進行高壓蒸氣滅菌常用的生物指示劑(Biological indicator)及含菌量為何？', opts:['5.0x10⁵~5.0x10⁶ CFU/片的 Geobacillus stearothermophilus','5.0x10⁶~5.0x10⁷ CFU/片的 Geobacillus stearothermophilus','5.0x10⁵~5.0x10⁶ CFU/片的 Bacillus subtilis','5.0x10⁶~5.0x10⁷ CFU/片的 Bacillus subtilis','5.0x10⁶~5.0x10⁷ CFU/片的 Bacillus sphaericus'], ans:'A' },
  { id:'2024-02', year:2024, q:'高壓蒸氣滅菌時物品的裝載原則如下，但何種組合中包含有錯誤的操作？①儘量將同類物品放在一起滅菌。②物品裝放時上下左右相互間均應間隔一定距離。③大包放在上層，較易滅菌的小包放在下層。④金屬物品放下層，織物包放上層。⑤物品裝放最好貼靠門和四壁以增加滅菌效能。⑥金屬包應平放，盤、碟、碗等應處於豎立的位置。⑦纖維織物應使折疊的方向與水平面成垂直狀態。⑧玻璃瓶等應開口向下或側放以利蒸氣進入和空氣排出。', opts:['1, 2, 3','4, 5, 6','2, 3, 4','6, 7, 8','3, 7, 8'], ans:'B' },
  { id:'2024-03', year:2024, q:'唐菖蒲伯克氏菌（Burkholderia gladioli）最佳的產毒素溫度為多少°C？', opts:['37°C','37°C','26°C','20°C','18°C'], ans:'C' },
  { id:'2024-04', year:2024, q:'公告的腸桿菌科菌種檢驗所使用的培養基包括哪2種？', opts:['VRBGA 及 O/F glucose','VRBG Agar 及 glucose agar w/BCP','VRBA 及 O/F glucose','VRBLA 及乳糖瓊脂','VRBGA 及 O/F sucrose'], ans:'A' },
  { id:'2024-05', year:2024, q:'如腸桿菌科檢驗陰性，是否不用再進行沙門氏菌或其他腸內菌之檢驗？（請選擇最適當之原因）', opts:['是，因為沙門氏菌為腸桿菌科微生物，為節省檢驗時程，可合併檢驗','是，因腸桿菌科為定量項目，沙門氏菌為定性項目，進行腸桿菌科等定量之檢驗結果若為未檢出，則不可能透過沙門氏菌增菌步驟，使其變為陽性','否，為確認食品是否有符合衛生標準之規定，故標準所訂可能的病原菌項目均仍應加以檢驗','否，因為沙門氏菌非腸桿菌科','否，因為沙門氏菌屬於大腸桿菌群成員之一'], ans:'C' },

  { id:'2024-08', year:2024, q:'全蛋檢測方案（乾燥及冷凍全蛋，三級法，大腸菌群，n=5, c=2, m=10, M=10³），何種檢驗結果為合格？(1) 5個檢體菌數分別為0、1、2、68及123；(2)其中1個檢體菌數大於2.2x10³；(3) 5檢體菌數為5、7、9、117及249；(4) 5檢體菌數為0、0、10、17、36。', opts:['1 及 3','2 及 3','3 及 4','1 及 4','2 及 4'], ans:'A' },

  { id:'2024-11', year:2024, q:'有關食品微生物的定量試驗，如下的敘述何者正確？', opts:['需要先進行滋養性增菌才能進行測試','需要先進行選擇性增菌才能進行測試','需要先進行區分性增菌才能進行測試','食品媒介金黃色葡萄球菌的檢測不必進行定量試驗','食品的生菌數與黴菌酵母菌計數需要進行定量試驗'], ans:'E' },
  { id:'2024-12', year:2024, q:'食品安全的維護及促進的共有三波演進，包括？(1)良好農業規劃(GAP)；(2)良好製造規範(GMP)；(3)良好衛生規範(GHP)；(4)風險分析(risk analysis)；(5)良好實驗室規範(GLP)；(6)危害分析及重要管制點(HACCP)；(7)良好溝通規範(GCP)', opts:['1、3、5','2、4、6','3、4、6','1、4、7','3、4、7'], ans:'C' },

  { id:'2024-16', year:2024, q:'如下真菌菌屬中的一些菌種除了Aspergillus及Penicillium外，可產生黴菌毒素的菌屬，最可能包括如下：(1)Trichoderma；(2)Cephalosporium；(3)Alternaria；(4)Monascus；(5)Fusarium', opts:['1,3,5','2,4,5','2,3,5','1,2,3,4,5','1,2,5'], ans:'D' },
  { id:'2024-17', year:2024, q:'進行產氣莢膜桿菌之檢驗時若接種tryptose-sulfite-cycloserine agar w/egg Yolk（EY），生長的菌落將呈現何種菌落特徵？', opts:['帶有白色環帶的黑色菌落','帶有彩虹螢光的黃色菌落','帶有黑色環帶的白色菌落','帶有彩虹樣環帶的黑色菌落','帶有黑色環帶的黑色菌落'], ans:'A' },
  { id:'2024-18', year:2024, q:'進行食品生菌數檢驗時，若遇到「擴散落」當形成鏈狀如下敘述何者為非？', opts:['若僅一條則應視為個菌落','若有兩條以上存在時應視其鍊源處之不同，分別計數','擴散菌落所覆蓋面超過整個平板面積1/2時，應不予計數','被擴散菌落造成之抑制生長範圍超過1/4時，應予計數','若鍊狀菌擴散菌落彼此分開而形成大時，應予計數'], ans:'D' },
  { id:'2024-19', year:2024, q:'酸土脂環酸芽孢桿菌（Alicyclobacillus acidoterrestris）污染的飲料會產生異味（藥味、火腿味）或臭味係因為此菌增殖時可產生何種物質？', opts:['甲醛','酚物質','酒精及醋酸','CO₂及蟻酸','胺基酸分解酵素'], ans:'B' },
  { id:'2024-20', year:2024, q:'操作金黃色葡萄球菌乳膠凝集試驗Staph Latex時，以下操作與反應何者正確？', opts:['試劑滴到待測菌落後，立即產生大量氣泡為陽性反應','棉棒沾待測菌落再滴上試劑後，1分鐘內可觀察到藍紫色為陽性反應','將待測菌落加入試劑混勻後，旋轉卡片1分鐘內見到大塊凝集為陽性反應','將待測菌株加入試劑，立刻在顯微鏡下觀察到菌體內的孢子為陽性反應','利用濾紙接種少數菌落，加上試劑後10秒內觀察，若有大塊凝集，則為陽性反應'], ans:'C' },
  { id:'2024-21', year:2024, q:'衛福部公告的食品微生物檢驗之抽樣類型均採檢5個檢體(n=5)，但根據ICMSF對可能含極嚴重危害(severe hazard)病原的食品中如未加熱就進食或至吃前仍存放一段時間，建議的類型(cases) 15所採檢的檢體數高達多少件才具有代表性？', opts:['90件','120件','15件','30件','60件'], ans:'E' },
  { id:'2024-22', year:2024, q:'食品中毒病原菌之檢驗需使用選擇性增菌培養基，但要注意如下，其中何者為非？', opts:['增菌液加入抗生素通常比加入其他抑制劑更容易達到效果','增菌時間不能太短，因為還沒有讓標的菌生長','增菌時間不能太長，因為非標的菌會適應環境而生長過多','需配合其它條件如42℃或厭氧環境更能達到標的菌的增菌效果','需注意增菌液pH值的維持，如增加，則抑制劑的抑菌效果減弱'], ans:'A' },
  { id:'2024-23', year:2024, q:'衛福部TFDA所公告之「實驗室品質管理規範－微生物領域測試結果之品質管制(107.06.03)」中，下列何者「非」該文對於培養基驗證試驗的描述？', opts:['確認培養基上菌落大小與數量','新配製培養基應符合精密度管制範圍為3.27x對數平均差異值','不得使用具感染性的RG 2級病原菌作為對照菌株','需使用陽性菌株','培養基驗證試驗需比較前後兩批培養基的生長效能'], ans:'C' },
  { id:'2024-24', year:2024, q:'衛福部公告的食品沙門氏菌之檢驗為何需要使用兩種選擇性增菌液（RV及TT broth）以及兩種平板培養基的原因，如下何者最可能為非？', opts:['不同增菌液或平板的抑制劑對不同沙門氏菌影響各異','一種增菌或平板的選擇劑不能抑制某種競爭優勢菌，但另一種也許能夠抑制','常用的平板培養基如HE或XLD以及Bismuth sulfite(BS)具有不同的抑制性，前兩者為中等選擇性，而BS為高選擇性','使用單一增菌液或平板會出現漏檢現象','主要原因為兩種肉湯或平板較容易讓受傷細胞復甦'], ans:'E' },
  { id:'2024-25', year:2024, q:'食品沙門氏菌之檢驗進行多價本體（O）血清學試驗，如下之敘述何者最為正確？', opts:['從尿素酶陽性的菌株挑取菌落操作','挑取XLD生長菌落操作','挑取斜面紅色、但基底黃色(或黑色)的TSIA斜面上菌落操作','挑取顯色培養基上疑似菌落操作','需要將疑似菌落移種BHI培養液或TSB培養液，生長後才能操作'], ans:'C' },
  { id:'2024-26', year:2024, q:'去除食品中唐菖蒲伯克氏菌（Burkholderia gladioli）邦克列酸毒素的實用方法中何者正確？', opts:['水洗，煮沸去湯，再水洗，加蒜涼拌','乾銀耳日曬5-7天','將食品煮沸100℃，30分鐘','以5%次氯酸鈉(sodium hypochlorite)處理食品','以紫外線燈照射60分鐘'], ans:'A' },
  { id:'2024-27', year:2024, q:'將食品存放在冰箱(2-8℃)，如下何種食品媒介中毒菌最可能會生長導致食品中毒？(1)阪崎腸桿菌；(2)金黃色葡萄球菌；(3)單核球增多性李斯特菌；(4)氣單胞菌；(5)小腸結腸炎耶氏菌；(6)沙門氏菌', opts:['1+2','3+4','5+6','3+5','2+6'], ans:'D' },
  { id:'2024-28', year:2024, q:'在10⁻¹~10⁻⁵五個連續稀釋度中確定最適的三個連續稀釋度：假設接種樣品量0.1 g的陽性管數為2，0.01 g為2，0.001 g為1，0.0001 g為1，0.00001 g為0，則MPN計算陽性結果，應該選擇何種接種樣品量查閱MPN表？', opts:['2-2-1','2-2-2','2-1-1','1-1-0','2-3-1'], ans:'B' },
  { id:'2024-29', year:2024, q:'鑑定單核球增多性李斯特菌的CAMP試驗，下列敘述何者是正確的？(1)使用的測試品管菌為Rhodococcus equi及S. aureus；(2)使用的測試品管菌為馬紅酵母菌及S. aureus；(3)少數菌株的陽性結果在R. equi以及所有菌株在S. aureus接種處的附近均有加強溶血現象；(4)通常在R. equi附近無溶血，而在S. aureus附近有加強溶血現象；(5)在R. equi附近有加強溶血，而在S. aureus附近無溶血現象', opts:['1+2+3','2+3+4','1+3+4','3+4+5','1+3+5'], ans:'C' },
  { id:'2024-30', year:2024, q:'化妝品中不可檢出白色念珠菌，當鑑定時，需要將疑似酵母菌接種至含1%聚山梨醇酯80之玉米粉瓊脂培養基培養試驗，其目的為觀察酵母菌的那些構造？(a)發芽管的產生；(b)大分生孢子的產生；(c)菌絲及假菌絲的產生；(d)厚膜孢子的產生；(e)孢子囊的孢子的產生', opts:['a、b','b、c','c、d','c、e','d、e'], ans:'C' },
  { id:'2024-31', year:2024, q:'仙人掌桿菌及金黃色葡萄球菌檢驗之平板計數法，公告方法建議分別選取生長菌落數的範圍多少進行計數最為理想？(1)25-250；(2)30-300；(3)8-80；(4)15-150；(5)20-200；(6)10-150', opts:['1，5','2，3','3，4','4，5','5，6'], ans:'D' },
  { id:'2024-32', year:2024, q:'一旦從食品檢出某菌，生化反應疑似霍亂弧菌則進行血清學試驗，一般使用何種細菌本體抗原抗血清型進行試驗？', opts:['O3型及O138型','O1型及O9型','O9型及O3型','O2型及O138型','O1型及O139型'], ans:'E' },
  { id:'2024-33', year:2024, q:'臺灣從未報導曲狀桿菌（彎曲菌）引起的食品中毒最大的原因，與如下有關，但何者最可能除外？', opts:['食品藥物管理署不常發現此菌所引起的中毒事件而沒有特別要求衛生局檢驗室偵測','檢驗室常沒有微氧培養環境的設備','檢驗人員沒有培訓的經驗','食品中毒案件調查時沒有考慮到彎曲菌是病原','公告方法建議的增菌培養基配方錯誤而分離不出此菌'], ans:'E' },
  { id:'2024-34', year:2024, q:'計算大腸桿菌衛生指標菌總和時需操作分離的類似菌鑑定試驗，其與病原性大腸桿菌檢驗之確定試驗不同之處，如下以何者最正確？', opts:['前者需要操作I, M, Vi, C生化試驗，而後者需要操作初步生化試驗和第二步生化試驗及血清學試驗','前者要操作PCR分生試驗，後者需要操作體抗原血清學試驗','前者僅需操作氧化酶試驗，而後者要操作動物試驗','前者要操作RPLA反被動乳膠凝集試驗，後者要操作O157:H7血清學試驗','前者不需操作病原性試驗，後者要操作病原性試驗'], ans:'A' },
  { id:'2024-35', year:2024, q:'如下有關氣單胞菌的敘述何者錯誤？', opts:['氧化酶陰性菌','革蘭氏陰性桿菌','TSI顯現葡萄糖發酵性及/或蔗糖發酵性','分離的培養基稱為澱粉酚紅安匹西林培養基(SPA)','可利用O/129敏感性試驗的10及150 μg與弧菌區分'], ans:'A' },
  { id:'2024-36', year:2024, q:'假設某稀釋倍數的MRS培養基長出248個CFU菌落，TOS-MUP長出48個菌落，Enterococcus agar長出138個菌落，請問乳桿菌(lactobacilli)的總數為多少乘以倍數？', opts:['434','296','386','248','62'], ans:'E' },
  { id:'2024-37', year:2024, q:'ICMSF指出風險程度中對一般人群具有極嚴重危害的病原菌包括哪些菌的檢驗：(1)金黃色葡萄球菌；(2)大腸桿菌O157:H7；(3)仙人掌桿菌；(4)肉毒桿菌神經毒素；(5)腸炎弧菌', opts:['1+2','2+3','2+4','1+5','2+5'], ans:'C' },
  { id:'2024-38', year:2024, q:'衛福部公告食品檢驗方法中提到可使用顯色培養基協助分離食品媒介中毒病原菌的類別，何者除外？(1)大腸桿菌O157；(2)金黃色葡萄球菌；(3)阪崎腸桿菌；(4)志賀氏菌；(5)單核球增生李斯特氏', opts:['(1)+(2)','(2)+(3)','(3)+(4)','(1)+(3)','(2)+(4)'], ans:'E' },
  { id:'2024-39', year:2024, q:'黴菌會產生黴菌毒素(Mycotoxin)的種類包括如下，何者除外？', opts:['Aspergillus flavus for Aflatoxins','Penicillium claviforme for Patulin','Aspergillus ochraceus for Ochratoxins','Fusarium spp. for Fumonisins','Actinomyces for Actinomycin'], ans:'D' },
  { id:'2024-40', year:2024, q:'常引起罐頭製品腐敗的平酸菌主要有哪兩種？(1)B. acidocaldarius；(2)B. brevis；(3)B. coagulans；(4)B. megaterium；(5)B. stearothermophilus；(6)B. thuringiensis', opts:['(1)、(2)','(2)、(3)','(3)、(4)','(4)、(6)','(3)、(5)'], ans:'E' },
  { id:'2024-41', year:2024, q:'生菌數(Aerobic plate count)的計數範圍為25-250 CFU，因為黴菌及酵母菌菌落大，因此，進行總數檢驗時，請問其計數範圍應該選擇多少？', opts:['25-250','20-80','15-150','15-300','10-150'], ans:'E' },
  { id:'2024-42', year:2024, q:'請問如下食品微生物標準檢驗體系所提出的方法何者為非標準方法？', opts:['國際食品法典委員會(CAC)','科學書籍和期刊公佈的方法','歐盟的國際標準委員會(ISO)所公告的方法','日本國家標準(JIS)','食品藥物管理署(TFDA)公告的食品微生物檢驗方法'], ans:'B' },
  { id:'2024-43', year:2024, q:'蒸汽滅菌時，如下物品裝載原則的敘述，何者錯誤？', opts:['儘量將同類物品放在一起滅菌','物品裝放時上下左右相互間均應間隔一定距離','將大包放在下層，而將較易滅菌的小包放在上層','金屬物品放下層，織物包放上層','纖維織物應使折疊的方向與水平面成垂直狀態'], ans:'C' },
  { id:'2024-44', year:2024, q:'區分A. acidocaldarius(酸熱脂環酸芽孢桿菌)與A. acidoterrestris(酸土脂環酸芽孢桿菌)的實驗室方法可包括如下，但何者除外？', opts:['接種於含有erythritol及bromphenol blue的BAM (pH 4.0), 然後在60℃培養3天，前者呈黃綠色，後者呈藍色','以氣相色層質譜儀分析脂肪酸ω-Cyclohexyl fatty acids C17及C19','核醣分型(ribotyping)','製作革蘭氏抹片觀察菌體特徵','培養在PCA(Plate Count Agar, pH 7.0)後觀察菌落特徵'], ans:'E' },
  { id:'2024-45', year:2024, q:'如果某學校的學童發生食品中毒是在午餐後2~4小時，症狀為：噁心、劇烈的反復嘔吐、腹痛、腹瀉，多為水樣糞便，伴有輕微發燒、頭痛、虛弱無力等。請問最可能的病原菌為何？', opts:['產生志賀毒素的大腸桿菌','金黃色葡萄球菌','李斯特氏菌','產氣莢膜梭菌','空腸彎曲菌'], ans:'B' },
  { id:'2024-46', year:2024, q:'如下病原菌在台灣衛福部公告的網站從未見到食品中毒或水媒介感染的案例？(1)仙人掌桿菌；(2)氣單胞菌；(3)金黃色葡萄球菌；(4)曲狀桿菌；(5)志賀氏菌；(6)致病性大腸桿菌', opts:['1及2','2及3','2及4','4及5','5及6'], ans:'C' },
  { id:'2024-47', year:2024, q:'如下病原菌所產生的食品中毒何兩者最常會導致患者死亡，因此廠房的環境監控必須將其列為目標菌？(1)諾羅病毒；(2)李斯特菌；(3)志賀氏菌；(4)沙門氏菌；(5)溶血性鏈球菌；(6)腸炎弧菌', opts:['1及2','2及3','2及4','4及5','5及6'], ans:'C' },
  { id:'2024-48', year:2024, q:'直接分離培養食品中產氣莢膜桿菌的檢測需要將稀釋檢體接種在何種培養基？', opts:['egg yolk agar(EYA)','Lactose-gelatin medium(LGM)','Iron milk medium','Cooked meat medium','含或不含egg yolk emulsion的Tryptose-sulfite-cycloserine agar (TSC)'], ans:'E' },
  { id:'2024-49', year:2024, q:'何種情況下需要操作金黃色葡萄球菌的最確數(MPN)計數方法？', opts:['預期含有少量金黃色葡萄球菌','預期含有大量金黃色葡萄球菌','預期大量產生腸毒素','預期含有少量腸毒素','預期含有嘔吐毒素'], ans:'A' },
  { id:'2024-50', year:2024, q:'3M Petrifilm Aerobic Count Plate (AC)方法用於食品生菌計數時的最大缺點為造成偽陰性的判讀結果，原因如下，但何者除外？', opts:['草綠色鏈球菌及藤黃微球菌當測試菌量低於10³ CFU/mL時均無法還原TTC','當兩菌的菌量提高到10⁸ CFU後，草綠色鏈球菌仍然無法還原TTC，而藤黃微球菌則呈現TNTC','白色念珠菌相較於其它念珠菌，顯示對TTC的能力還原不佳','對菌量大於100 CFU的大腸桿菌的計數效果不佳','Enterococcus faecalis會液化Petrifilm AC而淡化TTC的呈色反應，而不易判讀'], ans:'D' },
  { id:'2024-51', year:2024, q:'包裝飲用水檢測綠膿桿菌的公告方法建議過濾檢體量及培養基為何？', opts:['100 mL/m-Endo agar','25 mL/Pseumonas F agar','200 mL/milk agar','100 mL/M-PA-C agar','50 mL/KF agar'], ans:'D' },
  { id:'2024-52', year:2024, q:'大腸桿菌的檢驗公告方法建議操作IMViC四種試驗，其中何種試驗需要在35℃培養96小時才能提出最後報告？', opts:['胰化蛋白腖培養液(Tryptone or Tryptophane Broth)','運動性試驗培養基(Motility test medium)','歐普氏培養液(VP Broth)','科塞爾氏檸檬酸鹽培養液(Koser\'s Citrate Broth)','甲基紅培養液(MR Broth)'], ans:'D' },
  { id:'2024-53', year:2024, q:'衛福部新公告的阪崎腸桿菌(Cronobacter sakazakii)檢驗方法主要特點的敘述，何者是正確的？(a)包括定性及MPN定量方法；(b)與其他菌的重要區分試驗包括TSA產黃色素試驗和sorbitol發酵試驗；(c)檢體量為100 g(mL)；(d)需要取2管各50 mL的增菌液進行離心；(e)增菌液接種的培養基為MacConkey與ESA顯色培養基二種平板', opts:['a、b、c','b、c、d','c、d、e','a、b、d','b、c、e'], ans:'B' },
  { id:'2024-54', year:2024, q:'如下有關於食品沙門氏菌或其他病原菌的塗抹物(Swab)檢體的敘述，何者錯誤？', opts:['以棉棒採檢時，需先將棉棒稍微以採檢液如蛋白腖緩衝液等浸溼，再塗抹採檢對象食品的表面','以無菌操作折斷塗抹物木柄或以無菌剪刀將塗抹棒之頭部置於無菌含蓋試管內，加蛋白腖緩衝液5 mL','將試管蓋旋緊，於10秒內來回叩擊手心使其劇烈振盪至少50次，或以旋渦混合器充分振盪至塗抹物頭部之棉絮鬆開','取溶出液1 mL，置於含無菌蛋白腖緩衝液9 mL之試管內，於35℃培養24±2小時後，供作檢液','直接以乾燥的無菌棉棒塗抹食品檢體的表面，然後折斷塗抹物木柄將塗抹物之頭部置於含有無菌蛋白腖緩衝液10 mL之涵蓋試管內，於35℃培養24±2小時後，供作檢液'], ans:'E' },
  { id:'2024-55', year:2024, q:'檢驗食品中大腸桿菌O157：H7與單核球增多性李斯特菌時，需先將檢體分別接種mBPWp增菌培養液以及BLEB增菌培養液，然後再加入三種抑菌劑/抗微生物劑，其可能原因包括如下，何者除外？', opts:['保存之食品原料中的病原菌常為受傷菌，在含有抑菌劑的環境不易復甦','分別經過5和4小時才加入抑菌劑的原因為抑制雜菌的生長','兩種菌的選擇性增菌培養基抑菌劑均含有吖啶黃素溶液','如果在接種檢體後培養隔夜後才加入抑菌劑，則檢體中的雜菌會過度生長，不易分離出標的菌','加入三種抑菌劑前的增菌培養基屬於區分性培養基，有利於區分病原菌與雜菌，而加入後則屬於滋養選擇性培養基，有利於滋養及選擇出病原菌'], ans:'E' },
  { id:'2024-56', year:2024, q:'罐頭食品的商業殺菌(無菌)方法之定義包括如下，何者除外？', opts:['殺菌程度足以使食品中有害人體健康之活性微生物或孢子存在','可抑制腐敗性微生物的活性','可使該產品在有效保存期限內之常溫儲運過程中，該等微生物不得生長','有效保存期限內之常溫儲運過程中，該等微生物不會產生毒素','相當於高溫高壓殺菌方法，完全去除芽孢菌，保存期限較為長久'], ans:'E' },
  { id:'2024-57', year:2024, q:'如下有關食品的微生物檢驗侷限性敘述中，何者錯誤？', opts:['當正確使用並與經過確效的加工程序控制相結合，檢驗可提供有效的產品安全和穩定性資訊','檢驗並不能保證產品的安全性','當食品中可導致危害的致病菌以低濃度存在，並且盛行率(prevalence)較低、且易變時，檢驗仍然可提供正確的安全資訊','食品中致病性微生物的分佈是不均勻的，因此，當樣品採檢自一批產品的可接受部分時，則檢驗可能無法檢測出該批次產品中的微生物','食品安全通常是多種因素作用的結果，它主要透過食品供應鏈中適當的預防性、預先反應的措施來確證，而不是僅透過微生物檢驗來達到'], ans:'C' },
  { id:'2024-58', year:2024, q:'美國藥典對營養及膳食補充品的微生物檢驗建議檢驗如下四種病原菌，但何者除外？', opts:['梭菌(Clostridium species)','大腸桿菌(Escherichia coli)','Staphylococcus aureus','Salmonella spp.','Listeria monocytogenes'], ans:'E' },
  { id:'2024-59', year:2024, q:'美國藥典對營養及膳食補充品的梭菌(Clostridium species)檢驗的如下相關敘述，何者錯誤？', opts:['檢體以TSB稀釋10倍後，需要用80°C水浴處理10分鐘','水浴處理後取10 mL加至90 mL Reinforced clostridial medium','增菌液厭氧培養後接種的平板培養基為Columbia agar w/gentamicin','接種的平板培養基需培養在35°C的厭氧環境，36~48 h，再觀察平板','鑑定疑似菌之Catalase試驗的試劑濃度為15% H₂O₂'], ans:'A' },
  { id:'2024-60', year:2024, q:'單核球增多性李斯特菌的分離培養基OXA，PALCAM及MOX平板培養基均含有何種化學物，因此培養後典型的生長菌落周邊呈黑色？', opts:['CAMP因子','鼠李糖(Rhamnose)','硫化鐵','傘狀運動因子(Umbrella motility factor)','七葉苷(Esculin)'], ans:'E' },
  { id:'2024-61', year:2024, q:'仙人掌桿菌檢驗使用的增菌培養基為TSPB，其係由TSB加上何種化學品？', opts:['phenolic compound','phosphate','purine','pyrimidine','polymyxin'], ans:'E' },
  { id:'2024-62', year:2024, q:'如下有關公告之空腸彎曲菌偵測與鑑定的生理及生化試驗敘述，何者最可能錯誤？', opts:['可將增菌培養基放在42°C的溫度培養','馬尿酸鹽(Hippurate)水解試驗有助於空腸彎曲菌的鑑定','分離的培養基為mCCDA平板培養基','常用於鑑定此菌的抗生素抑制試驗包括萘啶酮酸(Nalidixic acid)頭孢噻吩(Cephalothin)','將分離平板倒置培養於37°C的微氧環境培養箱'], ans:'E' },
  { id:'2024-63', year:2024, q:'適合彎曲菌與產氣莢膜梭菌生長之微氧與厭氧環境的氧氣濃度分別為多少？', opts:['2%,0%','10%,0%','5%,0%','3%,0.5%','8%,0.3%'], ans:'C' },
  { id:'2024-64', year:2024, q:'如下有關腸炎弧菌檢驗的介紹中，何者正確？', opts:['分離及增菌培養基需要加入4%以上的鹽','可利用蔗糖，因此在TCBS平板的生長菌落呈綠色','增菌培養基需要將pH值調至9.3','可先利用生化八管進行初步鑑定後，若為疑似菌，再操作公告方法的傳統試驗確認','需要操作黏絲試驗(String Test)及El Tor(艾托)溶血試驗'], ans:'D' },
  { id:'2024-65', year:2024, q:'下列何者非避免分子生物實驗室汙染的方法？', opts:['使用具有濾膜(filter)的無菌吸管尖(tip)','操作過程適時更換手套','為求實驗方便可將DNA萃取液反覆冷凍解凍使用','實驗結束以1%漂白水擦拭桌面','每日工作結束以UV照射檯面30 mins以上'], ans:'C' },
  { id:'2024-66', year:2024, q:'如下有關衛福部公告包裝飲用水綠膿桿菌的檢驗的敘述，何者正確？(a)過濾的檢體量為250 mL；(b)建議分離的培養基為牛乳培養基；(c)分離的培養基為m-PA-C洋菜培養基；(d)建議分離的培養基為cetrimide agar；(e)將分離平板倒置培養於42°C', opts:['a、b','c、d','a、c','b、e','c、e'], ans:'E' },
  { id:'2024-67', year:2024, q:'操作API生化鑑定套組時，常常會將何菌鑑定為霍亂弧菌？', opts:['Burkholderia cepacia','Plesiomonas shigellosis','Aeromonas hydrophila','Enterobacter cloacae','Vibrio alginolyticus'], ans:'C' },
  { id:'2024-68', year:2024, q:'如下有關衛福部公告的致病性腸炎弧菌(V. parahemolyticus)檢驗方法的敘述何者錯誤？', opts:['是一種嗜鹽性細菌','含有耐熱直接溶血毒素(TDH)以及耐熱相關溶血素(TRH)','在夏秋季節，於日本及台灣此菌食品中毒占首位','當每克食品污染菌量達到10²~10⁴ CFU時就可發生中毒','腸炎弧菌在TCBS agar的菌落形態呈圓形之綠色或藍色菌落'], ans:'D' },
  { id:'2024-69', year:2024, q:'仙人掌桿菌(Bacillus cereus)與其它相近的芽孢桿菌菌種的最主要區分特性為何？', opts:['在MYP平板上生長菌落呈白色，菌落周圍有濃厚的半透明沉澱環帶','在BAP培養基菌落具有β溶血性','根狀生長試驗(Rhizoid growth test)呈陽性','蛋白質毒素晶體試驗(Protein toxin crystal test)呈陰性','運動性試驗呈陽性'], ans:'D' },
  { id:'2024-70', year:2024, q:'衛福部新公告的大腸桿菌O157之檢驗方法使用的增菌培養基為mBPWp，其中小寫的"p"代表此培養基含有何種化學品？', opts:['peptone','polypeptone','poxymyxin','penicillin','pyruvate'], ans:'E' },
  { id:'2024-71', year:2024, q:'衛福部新公告的大腸桿菌O157之檢驗方法建議須將檢體加至增菌培養基mBPWp，培養5小時候分別加入過濾除菌的3種適當濃度的哪些抗微生物劑？(a)acriflavin solution；(b)cefsulodin solution；(c)nalidixic acid solution；(d)cycloheximide solution；(e)vancomycin solution', opts:['a、b、c','a、c、d','b、c、e','a、b、e','c、d、e'], ans:'D' },
  { id:'2024-72', year:2024, q:'衛福部公告志賀氏菌檢驗增菌時要在何種環境培養？', opts:['因為是嗜氧菌，需在37℃的嗜氧環境','因為是嗜高溫菌，需在44℃的嗜氧環境','因為厭氧環境比嗜氧環境生長佳，需在42℃以上的厭氧環境','因為是厭氧菌，需在42℃以上的厭氧環境','因為是嗜高溫厭菌，需在44℃以上的厭氧環境'], ans:'C' },
  { id:'2024-73', year:2024, q:'下列有關小腸結腸炎耶氏菌的敘述中，何者不正確？', opts:['主要來源為動物，人類感染以口糞傳染為主，而非叮咬','此菌的致病機轉包括侵入以及產生腸毒素','可在冷凍食品存活非常長的時間','此菌與產毒性大腸桿菌同樣地可產生熱不穩定腸毒素(heat-labile enterotoxin)','此屬的另一腹瀉病原菌為Y. pseudotuberculosis'], ans:'D' },
  { id:'2024-74', year:2024, q:'食品或化妝品檢驗時使用的標準菌株不可超過多少代？', opts:['15代','10代','8代','7代','5代'], ans:'E' },
  { id:'2024-75', year:2024, q:'進行細菌培養時，每日應記錄溫度兩次，紀錄的間隔為多少小時以上？', opts:['2小時','3小時','4小時','5小時','8小時'], ans:'C' },
  { id:'2024-76', year:2024, q:'下列何者為real time PCR技術應用於食品檢驗的優點？', opts:['適合於分析活菌與死菌比例','檢驗標的僅限於微生物','可設計內部控制組(IPC/IAC)避免偽陰性','可分析毒素蛋白的結構與種類','對於食品中抗生素殘留有良好的靈敏度'], ans:'C' },
  { id:'2024-77', year:2024, q:'以濾膜法測定樣品時，使用之濾杯刻度合格在何種誤差範圍內？', opts:['±1%','±2.5%','±5%','±3%','±3.5%'], ans:'B' },
  { id:'2024-78', year:2024, q:'衛福部TFDA所公告之「實驗室品質管理規範－微生物領域測試結果之品質管制(107.06.03)」中，下列何者「非」該文對於培養基驗證試驗的描述？', opts:['確認培養基上菌落大小與數量','新配製培養基應符合精密度管制範圍：3.27x對數平均差異值','不得使用具感染性的RG 2級病原菌作為對照菌株','需使用陽性菌株','培養基驗證試驗需比較前後兩批培養基'], ans:'C' },
  { id:'2024-79', year:2024, q:'關於前增殖步驟用於檢驗食品病原菌的描述，何者為非？', opts:['無法針對特定目標微生物增殖','藉由前增殖可以稀釋抑制微生物生長的物質','可以協助恢復受損細胞的活性','只能增殖活細胞','可增加檢驗方法的靈敏度'], ans:'A' },
  { id:'2024-80', year:2024, q:'下列何者非為國際上快速微生物檢驗方法的第三方方法驗證單位？', opts:['AFNOR','MicroVal','FAPAS','AOAC RI (PTM)','AOAC RI (OMA)'], ans:'C' },
  { id:'2024-81', year:2024, q:'下列描述何者為非？', opts:['美國FDA設有食品計畫微生物方法驗證指南之備忘錄以作為轄下實驗室採用快速方法時的參考','TAF不接受實驗室採用快速微生物方法作為認證項目','國內食藥署網頁所登載之公開食品篩檢資訊包含快速微生物檢驗方法','即使實驗室已經採用經認證之的快速方法，發生爭議時，仍應以政府公告方法為準','國內食藥署已將分子生物學檢驗方法納入其公告方法之一'], ans:'B' },
  { id:'2024-82', year:2024, q:'以下何種中毒微生物的分子生物檢測技術方法，在國內TFDA公告檢驗方法中已有最廣泛之應用？', opts:['Real-time PCR','數位PCR','高通量微流陣列PCR','Multiplex PCR','LAMP'], ans:'A' },
  { id:'2024-83', year:2024, q:'以下微生物分生檢驗技術何者並非使用核酸為鑑定標的？', opts:['短片段重複序列多型性分析(STR，Chimerism Test)','MALDI-TOF','Real-time PCR','16S rRNA定序','LAMP'], ans:'B' },
  { id:'2024-84', year:2024, q:'下列何者革蘭氏陽性桿菌自2017年5月衛福部公告修正檢驗方法後，可以使用分子生物學方法與仙人掌桿菌(Bacillus cereus)進行區分？', opts:['B. anthracis','B. subtilis','B. weihenstephanensis','B. thuringiensis','Geobacillus sterothermophilus'], ans:'D' },
  { id:'2024-85', year:2024, q:'下列何者並非金黃色葡萄球菌食物中毒判明標準成立條件之一？', opts:['自可疑食物中檢出腸毒素之存在','自兩名以上病患之臨床檢體中分離出相同之菌株','自可疑食物中檢出之菌數大於10⁵ CFU','自可疑菌株中檢出毒素基因之存在','需要同時操作傳統的定性與定量方法'], ans:'E' },
  { id:'2024-86', year:2024, q:'台灣的二軌健康食品審查時，衛生主管單位只審查何項內容？', opts:['功效性','安全性','安定性','有效成分含量','衛生安全'], ans:'D' },
  { id:'2024-87', year:2024, q:'現行可用核酸進行分子生物檢測之項目，不包含下列何者？', opts:['志賀氏菌','A肝病毒','腸毒素','毒性基因','動物來源素食'], ans:'C' },
  { id:'2024-88', year:2024, q:'於腸道菌相相關領域滅菌過乳酸菌培養液屬於如下何者？', opts:['Probiotics','Prebiotics','Synbiotics','Postbiotics','Probiogenics'], ans:'D' },
  { id:'2024-89', year:2024, q:'下列何者使用為台灣保健食品素材百分比最大？', opts:['動物','植物','微生物','礦物質','深層海水'], ans:'C' },
  { id:'2024-90', year:2024, q:'關於粧品特定微生物檢驗流程中，何者為非？', opts:['臺灣夏天常發生化妝品媒介致病菌的臨床案例發生','汙染粧品之微生物會導致容器膨脹而容易發現','MLB為粧品培養液，其中含有中和劑可中和部分防腐劑功效，讓檢驗過程中更有機會篩選出不合宜菌','白色念珠菌為橢圓形酵母菌，常棲息於人類之口腔、喉部、大腸、皮膚及陰道等，為婦科感染之致病菌之一','化妝品廠對產品的最終品管除了操作衛福部公告的衛生標準外，各廠家仍有需要監測可能影響自身產品的重要汙染菌'], ans:'B' },
  { id:'2024-91', year:2024, q:'消化器官中何者之細菌數目最少？', opts:['胃','小腸','大腸','口腔','直腸'], ans:'A' },
  { id:'2024-92', year:2024, q:'台灣衛福部公告的化粧品微生物容許基準中，以下何者為非？', opts:['不得檢出大腸桿菌、綠膿桿菌、金黃色葡萄球菌','一般粧品生菌數需在1,000 CFU/g(mL)以下','接觸黏膜處部位之化粧品生菌數需在100 CFU/g(mL)以下','不得檢出酵母菌-白色念珠菌','不得檢出洋蔥伯克氏菌複合群(Burkholderia cepacia complex)'], ans:'E' },
  { id:'2024-93', year:2024, q:'有關良好的微生物品質控管的敘述，下列何者非？', opts:['人員只要嚴格遵守SOP執行試驗即可，實驗偏差主要是人員操作問題','人、機、料、法、環及測試，5M1E缺一不可','操作動線應注意由單一動線乾淨區到髒污區','環境汙染菌監控非常重要，尤其是針對空氣、水與包材','平整的工作檯面之微生物監控可利用接觸平板操作'], ans:'A' },
  { id:'2024-94', year:2024, q:'化妝品中不可檢出綠膿桿菌，當鑑定產色素的疑似菌時，最好接種如下兩種試驗項目，才能獲得與其他產色素菌最大的區分能力？(a)Arginine decarboxylase broth，培養在37℃；(b)YE瓊脂斜面培養在42℃，24小時；(c)Malonate broth，培養在37℃；(d)Gelatin liquefaction培養在25℃；(e)鞭毛染色', opts:['a、b','b、c','c、d','b、d','d、e'], ans:'D' },
  { id:'2024-95', year:2024, q:'檢驗化妝品中的白色念珠菌時，通常需對疑似菌接種0.5~1.0 mL胎牛或馬血清，培養1.5~2小時候，以顯微鏡觀察，其主要的目的是觀察何種構造？', opts:['梳子狀的菌絲構造','發芽管的產生','菌絲及假菌絲(pseudohyphae)的產生','厚膜孢子的產生','孢子囊的孢子的產生'], ans:'B' },
  { id:'2024-96', year:2024, q:'唐菖蒲伯克氏菌（Burkholderia gladioli）產毒素菌株的主要特性敘述，何者是正確的？(a)大多菌株為氧化酶陰性；(b)可在一般細菌生長的TSA、BAP、EMB上生長良好；(c)在EYA agar可產生卵磷脂酶；(d)可還原利用麥芽糖及乳糖；(e)可氧化利用O/Inositol、O/Sorbitol、O/Adonitol', opts:['a、b、c','b、c、d','c、d、e','a、c、e','a、d、e'], ans:'D' },
  { id:'2024-97', year:2024, q:'在台灣志賀氏菌常引起食品媒介桿菌性痢疾，最常見的兩種病原菌(血清群)為？', opts:['Shigella flexneri與S. boydii','S. flexneri與S. dysenteriae','Shigella sonnei與S. boydii','S. flexneri與S. sonnei','Shigella enterocolitis與S. sonnei'], ans:'D' },
  { id:'2024-98', year:2024, q:'唐菖蒲伯克氏菌（Burkholderia gladioli）產邦克烈酸的各種影響因素，依影響大小的排列為何？', opts:['溫度＞菌株＞培養基＞pH值＞時間','菌株＞培養基＞溫度＞pH值＞時間','溫度＞培養基＞菌株＞pH值＞時間','時間＞菌株＞溫度＞培養基＞pH值','菌株＞溫度＞培養基＞pH值＞時間'], ans:'E' },
  { id:'2024-99', year:2024, q:'與阪崎腸桿菌(Cronobacter sakazakii)最相近的腸桿菌科菌種為何菌？', opts:['Burkholderia cepacia','Enterobacter aerogenes','Klebsiella pneumoniae','Enterobacter cloacae','Serratia marcescens'], ans:'D' },
  { id:'2024-100', year:2024, q:'以CNS方法與Petrifilm偵測食品中大腸桿菌群(Coliform)及大腸桿菌時，使用Petrifilm的最大缺點為造成偽陰性結果，也就是？', opts:['獲得大腸桿菌群的菌數較高','僅能部份偵測出大於1,000 cfu Coliform','僅能部份偵測100~1,000 cfu Coliform','完全不能偵測少於100 cfu的大腸桿菌群生長','無法提供小於100 cfu的大腸桿菌生長'], ans:'E' },
  // 2025 第十三屆
  { id:'2025-001', year:2025, q:'高壓蒸氣滅菌時物品的裝載原則如下，但何種組合中包含有錯誤的操作？①儘量將同類物品放在一起滅菌。②物品裝放時上下左右相互間均應間隔一定距離。③大包放在上層，較易滅菌的小包放在下層。④金屬物品放下層，織物包放上層。⑤物品裝放最好貼靠門和四壁以增加滅菌效能。⑥金屬包應平放，盤、碟、碗等應處於豎立的位置。⑦纖維織物應使折疊的方向與水平面成垂直狀態。⑧玻璃瓶等應開口向下或側放以利蒸氣進入和空氣排出。', opts:['1，2，3','4，5，6','2，3，4','6，7，8','3，7，8'], ans:'B' },
  { id:'2025-002', year:2025, q:'全蛋檢測方案，何種檢驗結果為合格？（乾燥及冷凍全蛋，三級法，大腸菌群，n=5，c=2，m=10，M=10³）①5個檢體得到的菌數分別為0、1、2、68及123；②其中1個檢體的菌數大於2.2×10³；③5檢體的菌數為5、7、9、117及249；④5檢體的菌數為0、0、10、17、36。', opts:['1及3','2及3','3及4','1及4','2及4'], ans:'A' },
  { id:'2025-003', year:2025, q:'進行產氣莢膜桿菌之檢驗時若接種tryptose-sulfite-cycloserine agar w/egg Yolk（EY），生長的菌落將呈現何種菌落特徵？', opts:['帶有白色環帶的黑色菌落','帶有彩虹螢光的黃色菌落','帶有黑色環帶的白色菌落','帶有彩虹樣環帶的黑色菌落','帶有黑色環帶的黑色菌落'], ans:'A' },
  { id:'2025-004', year:2025, q:'化妝品中不可檢出白色念珠菌，當鑑定時，需要將疑似酵母菌接種至含1%聚山梨醇酯80之玉米粉瓊脂培養基，其目的為觀察酵母菌的那些構造？(a)發芽管的產生；(b)大分生孢子的產生；(c)菌絲及假菌絲(pseudohyphae)的產生；(d)厚膜孢子的產生；(e)孢子囊的孢子的產生。', opts:['a、b','b、c','c、d','c、e','d、e'], ans:'C' },
  { id:'2025-005', year:2025, q:'如下的特性與霍亂弧菌(V. cholerae)有關，但何者「除外」？', opts:['氧化酶陽性','對O/129敏感性試驗10及150μg紙錠均呈敏感性（不生長）','不能在含0%及3%氯化鈉的培養基生長','不能在含6%及8%氯化鈉的培養基生長','在TCBS的生長菌落呈黃色'], ans:'C' },
  { id:'2025-006', year:2025, q:'曲狀桿菌具有如下特性，但何者「除外」？', opts:['氧化酶陽性','在42°C可生長','分離的培養基為未含血液之曲狀桿菌改良培養基(mCCDA)','鑑定試驗包括在1% glycine、3.5% NaCl的生長試驗','在無菌環境可以生長良好'], ans:'E' },
  { id:'2025-007', year:2025, q:'直接分離培養食品中產氣莢膜桿菌的檢測需要將稀釋檢體接種在何種培養基？', opts:['egg yolk agar(EYA)','Lactose-gelatin medium(LGM)','Iron milk medium','Cooked meat medium','含或不含egg yolk emulsion的Tryptose-sulfite-cycloserine agar(TSC)'], ans:'E' },
  { id:'2025-008', year:2025, q:'衛福部新公告的阪崎腸桿菌(Cronobacter sakazakii)檢驗方法主要特點的敘述，哪一選項正確？(a)包括定性及MPN定量方法；(b)與其他菌的重要區分試驗包括TSA產黃色素試驗和sorbitol發酵試驗；(c)檢體量為100g(mL)；(d)需要取2管各50mL的增菌液進行離心；(e)增菌液接種的培養基為MacConkey與ESA顯色培養基二種平板。', opts:['a、b、c','b、c、d','c、d、e','a、b、d','b、c、e'], ans:'B' },
  { id:'2025-009', year:2025, q:'與阪崎腸桿菌(Cronobacter sakazakii)最相近的腸桿菌科菌種為何菌？', opts:['Burkholderia cepacia','Enterobacter aerogenes','Klebsiella pneumoniae','Enterobacter cloacae','Serratia marcescens'], ans:'D' },
  { id:'2025-010', year:2025, q:'乳酸菌所分泌之外泌體(exosomes)主要被視為下列何者？', opts:['新世代微生物','益生質','益源質(Biogenics)','傳遞保健食品功效成分之信使(messenger)','合生元(Synbiotics)'], ans:'D' },
  { id:'2025-011', year:2025, q:'豬的萊克多巴胺危害風險評估與豬的沙門氏菌媒介的危害評估主要不同處在於前者的特性包括如下，但何者除外？', opts:['在豬肉內濃度的分布通常較為均勻','濃度會隨著時間發生改變','危害通常由累積效應（cumulative effects）所造成','其可被控制至人類最少的暴露殘留量','傳播方式包括直接攝取，但通常不包括二次傳播而散佈'], ans:'B' },
  { id:'2025-012', year:2025, q:'下列乳酸菌相關成分何者之耐熱性最佳？', opts:['Probiotics','Prebiotics','Synbiotics','Postbiotics','Probiogenics'], ans:'D' },
  { id:'2025-013', year:2025, q:'健康食品功效評估規定依定要使用人體試驗之項目有幾項？', opts:['4項','5項','6項','8項','10項'], ans:'C' },
  { id:'2025-014', year:2025, q:'一軌與二軌健康食品審查時，何項內容是二軌審查項目？', opts:['功效性','安全性','安定性','有效成分含量','基因毒理學'], ans:'D' },
  { id:'2025-015', year:2025, q:'下列關於快速試驗（如革蘭氏染色、觸酶或氧化酶試驗）搭配生化鑑定套組流程之敘述，何者錯誤？', opts:['氧化酶試驗可快速判斷細菌是否為葡萄糖非發酵菌','觸酶試驗常用於初步區分葡萄球菌屬與鏈球菌屬','快速試驗結果可輔助判斷使用何種生化鑑定套組','API套組的優點為在操作前，並不須進行任何快速試驗','快速試驗通常於幾分鐘內操作完成，供後續選擇適用套組'], ans:'D' },
  { id:'2025-016', year:2025, q:'下列有關於API或RapID鑑定套組使用後之「結果判讀」與「軟體輸入」的敘述，何者正確？', opts:['API套組需將所有反應結果轉換成條碼後再上傳系統','RapID套組反應結果僅供參考，無法產出可信度分數','所有鑑定軟體皆不需使用網路連線，可以離線操作','判讀顏色以一般標準光源觀察，避免誤判呈色','若套組反應結果呈多項陽性，代表鑑定可信度一定高'], ans:'D' },
  { id:'2025-017', year:2025, q:'下列有關API與RapID兩種生化鑑定套組的差異，敘述何者正確？', opts:['API反應時間較短，一般可於4小時內判讀','RapID需滴加礦物油防止菌液揮發，API則不需要','API需根據各反應槽特性決定是否將菌液加滿反應槽，而RapID則不需要','RapID無需任何軟體輸入，只須人工比對顏色反應','RapID套組無須調整菌液濃度，可直接接種使用'], ans:'C' },
  { id:'2025-018', year:2025, q:'在操作血清試驗或生化鑑定套組前，若發現原始選擇性平板培養基上出現2種不同形態菌落，應如何處理以確保鑑定結果正確？', opts:['任選其中一種菌落進行操作即可，不影響結果','將兩種菌落混合後調整菌液濃度，以提高檢出率','應先以滋養平板培養基分離及純化菌落，再挑選單一菌落進行血清試驗或生化鑑定套組','立即進行氧化酶與觸酶試驗，以節省操作時間','視菌落顏色選擇是否為目標菌，再直接進行血清試驗或生化鑑定套組'], ans:'C' },
  { id:'2025-019', year:2025, q:'以生長菌落進行氧化酶試驗(Oxidase test)，當菌落接觸到氧化酶試劑後陽性反應結果為？', opts:['將菌落塗在濾紙上，然後加入試劑後變藍色','將加入菌落與試劑混合，然後在紙片上順時針旋轉後由藍色顆粒凝集','試劑接觸到載玻片上的菌體產生大量氣泡','將菌落塗在載玻片上，然後加入試劑後呈現藍綠色','將細菌懸浮在試管中的生理食鹽水，然後加入試劑呈現黃色'], ans:'A' },
  { id:'2025-020', year:2025, q:'公告的食品中氣單胞菌檢驗方法，建議分離此菌所用的分離培養基為？', opts:['澱粉酚紅安匹西林培養基(starch phenol red ampicillin agar)','膽粟糖苷培養基(bile esculin agar)','苯丙胺酸脫胺基酶培養基(phenylalanine deaminase agar)','CIN培養基(cefsulodin-ingasan novobiocin agar)','厭氧蛋黃培養基(anaerobic egg yolk agar)'], ans:'A' },
  { id:'2025-021', year:2025, q:'在進行微生物檢測時，使用之吸管及量筒等，其體積誤差不得超過多少？', opts:['1%','2.5%','5%','10%','0.5%'], ans:'B' },
  { id:'2025-022', year:2025, q:'當顧客有抱怨檢測結果的正確性時，應如何進行重新檢測確認？', opts:['原檢測人員','換另一位同仁進行檢測','原審查人員','換另一位審查人員','由外部具資格之第三方檢測單位執行'], ans:'B' },
  { id:'2025-023', year:2025, q:'Real-time PCR的優點不包括下列哪一項？', opts:['專一性佳','可為核酸分析','偵測靈敏度高','檢測時間短','不容易遭到汙染'], ans:'E' },
  { id:'2025-024', year:2025, q:'關於蛋白質體鑑定中MALDI-TOF MS的描述，何者正確？', opts:['偵測的是細胞RNA','分析的是DNA片段長度','利用質譜分析產生ribosomal protein譜圖','適用於植物品種鑑定','可用於細菌種別鑑定'], ans:'C' },
  { id:'2025-025', year:2025, q:'化粧品中不得檢出的白色念珠菌（Candida albicans）常用何種方法輔助鑑定？', opts:['TSIA三糖鐵斜面試驗','發芽管試驗','咖啡酸產生試驗','觸酶及凝固酶試驗','禾本科植物提取物試驗'], ans:'B' },
  { id:'2025-026', year:2025, q:'以下哪一種微生物菌株並非所有國際標準皆共同使用於化妝品防腐效能試驗中？', opts:['Staphylococcus aureus','Pseudomonas aeruginosa','Zygosaccharomyces rouxii','Candida albicans','Bacillus cereus'], ans:'B' },
  { id:'2025-027', year:2025, q:'食品中曲狀桿菌(Campylobacter spp.)的檢驗，如下敘述中，何者錯誤？', opts:['此菌是微好氧菌，需培養在5% O₂、10% CO₂及85% N₂的環境中','增菌培養基稱為曲狀桿菌增菌培養液，含有cefoperazone、trimethoprim lactate、vancomycin及cycloheximide','分離培養基為Abeyta-Hunt-Bark agar及Modified Campylobacter blood-free agar(mCCDA)','欲分離C.fetus時，將分離培養基培養的環境為42°C微好氧培養24-48小時','欲分離C.jejuni時，將分離培養基培養的環境為42°C微好氧培養24-48小時'], ans:'D' },
  { id:'2025-028', year:2025, q:'食品中霍亂弧菌(Vibrio cholerae)的檢驗，如下敘述中，何者錯誤？', opts:['此菌非為嗜鹽菌，不需使用含有2~3%氯化鈉的營養培養就能生長','增菌培養基稱為鹼性蛋白腖水(APW)，pH值調至8.5±0.2','分離培養基為TCBS培養基','霍亂弧菌(Vibrio cholerae)在TCBS培養基生長菌落通常較小，呈綠色','細菌本體抗血清凝集試驗操作包括使用O1型及O139型抗血清'], ans:'D' },
  { id:'2025-029', year:2025, q:'根據TFDA化粧品規定，下列哪類產品微生物限量應低於100 CFU/g(mL)，且不得檢出特定致病菌？', opts:['嬰兒用防曬乳','指甲油','普通洗髮精','定型液','眼部卸妝液'], ans:'A' },
  { id:'2025-030', year:2025, q:'危害等級分群(risk-based Grouping group)時，將食品中毒細菌歸類為第二類RG-2，通常這類菌為何？', opts:['不太可能引起人類疾病','可引起疾病但很少引致嚴重疾病，對工作者可能具有危險性，不可能散播到社區，通常有預防方法和治療方法','可引起致人類嚴重或致死疾病，可能散播到社區，通常無預防及治療方法','可引起嚴重或致死疾病，對工作者非常危險，可能散播到社區，通常有預防及治療方法'], ans:'B' },
  { id:'2025-031', year:2025, q:'檢體中微生物定量檢驗方法的確效，有關耐用性(Ruggedness)的如下敍述，何者錯誤？', opts:['耐用性是指相同的樣品在正常的實驗條件發生變化時，所得檢驗結果的精密度','耐用性可視為微生物檢驗方法在檢驗結果上抵抗操作和環境變化的能力','方法使用者應優先測定此確效參數，同時確效過程中，應注意樣品的一致性','在樣品中接種一定數量的試驗菌，採用藥典/食品公告方法和替代方法，分別由相同人員，在相同時間，使用相同的試劑進行檢驗','對檢驗結果進行統計分析，以相對標準差(RSD)來評估兩種方法的耐用性差異，可接受的變異係數範圍為10~15%'], ans:'D' },
  { id:'2025-032', year:2025, q:'使用MALDI-TOF MS進行微生物鑑定的主要優勢是？', opts:['可同時進行抗生素敏感性試驗','可觀察菌落的色素產生','可快速比對微生物質譜特徵','可直接觀察菌體結構','可進行遺傳變異分析'], ans:'C' },
  { id:'2025-033', year:2025, q:'依據USP<51>，對於第二類製劑，在第14天時細菌數應與初始菌數相比應？', opts:['減少至少1 Log₁₀','減少至少2 Log₁₀','減少至少3 Log₁₀','不得超過初始菌數','減少至少0.5 Log₁₀'], ans:'B' },
  { id:'2025-034', year:2025, q:'食品衛生標準第4.5項所列種類以外之其他即時調製、未經殺菌處理，且貨架期少於24小時之飲料應檢測菌？微生物限量為何？', opts:['沙門氏菌-陰性、腸桿菌科-100 CFU/mL','沙門氏菌-陰性、腸桿菌科-10 CFU/mL','志賀氏菌-100 CFU/mL','腸桿菌科及大腸桿菌群-陰性','李斯特菌-陰性、腸桿菌科-100 CFU/mL'], ans:'B' },

  { id:'2025-039', year:2025, q:'公告的食品中耶辛尼氏腸炎桿菌(Yersinia enterocolitica)檢驗方法，建議如下操作技術，請問何者「除外」？', opts:['檢液調製時將檢體25g加入PSBB培養液225mL，另可取檢體25g加入ITC培養液225mL，均質後做為檢液','PSBB需要於10°C增菌培養2天而使用ITC培養液者，於室溫增菌培養10天','可在增菌培養前取檢液1mL加入0.5%氫氧化鉀溶液9mL，混合數秒後再次移種平板培養基','可在增菌培養適當天數及溫度後取檢液1mL加入0.5%氫氧化鉀溶液9mL，混合數秒後再次移種平板培養基','接種的分離培養基需培養在30°C的環境'], ans:'B' },

  { id:'2025-051', year:2025, q:'產氣莢膜桿菌在台灣食品中毒中較少分離，因此懷疑此菌引起食品中毒時，需要使用如下裝置或培養基，但何者「除外」？', opts:['胰化蛋白腖-亞硫酸鹽-環絲胺酸培養基(TSC)','UVM培養基','液態硫乙醇酸鹽培養基(Fluid thioglycollate medium)','厭氧瓶及氣體包','改良式肉質培養基(Cooked meat medium，modified)'], ans:'B' },

  { id:'2025-055', year:2025, q:'公告的食品中志賀氏桿菌檢驗方法，首先進行檢液調製，以增菌培養液稀釋10倍，混合均勻後置入厭氧瓶中，再放入新鮮的催化劑及氣體包，於42°C（欲檢測S. sonnei時，培養溫度為44°C）培養20小時，請問增菌培養液為何？', opts:['Selenite cystine broth(SC)','含有綠黴素(chloramphenicol solution)的志賀氏桿菌培養液(TT)','Rappaport-Vassiliadis broth(RV)','含有諾伯黴素(novobiocin solution)的志賀氏桿菌培養液','含有四環黴素(tetracycline solution)的志賀氏桿菌培養液'], ans:'D' },

  { id:'2025-059', year:2025, q:'3M Petrifilm Aerobic Count Plate(AC)方法用於食品生菌計數時的最大缺點為造成偽陰性的判讀結果，原因如下，但何者除外？', opts:['草綠色鏈球菌及藤黃微球菌當測試菌量低於10³ CFU/mL時均無法還原TTC','當兩菌的菌量提高到10⁸ CFU後，草綠色鏈球菌仍然無法還原TTC，而藤黃微球菌則呈現菌數太多而無法計數(TNTC)','測試的酵母菌中，白色念珠菌相較於其它念珠菌，顯示對TTC的能力還原不佳','對大腸桿菌的計數效果不佳','Enterococcus faecalis會液化Petrifilm AC而淡化TTC的呈色反應，而不易判讀'], ans:'D' },

try { localStorage.setItem('__test__','1'); localStorage.removeItem('__test__'); _storageOk = true; } catch(e){}
function saveState() {
  if (!_storageOk) return;
  try { localStorage.setItem(SK, JSON.stringify(state)); } catch(e){}
}
function loadState() {
  if (!_storageOk) return;
  try {
    const s = localStorage.getItem(SK);
    if (s) state = { ...state, ...JSON.parse(s) };
  } catch(e){}
}

    ? Math.round(state.totalCorrect / state.totalAnswered * 100) + '%'
    : '—';
  document.getElementById('tb-total').textContent = state.totalAnswered;
  document.getElementById('tb-acc').textContent = pct;
  document.getElementById('tb-wrong-cnt').textContent = Object.keys(state.wrongBank).length;
}

function updateHome() {
  const pct = state.totalAnswered > 0
    ? Math.round(state.totalCorrect / state.totalAnswered * 100) + '%'
    : '—';
  document.getElementById('home-total').textContent = state.totalAnswered;
  document.getElementById('home-acc').textContent = pct;
  document.getElementById('home-sessions').textContent = state.sessions;
  const wc = Object.keys(state.wrongBank).length;
  document.getElementById('home-wrong').textContent = wc;
  const desc = wc > 0
    ? `從 ${wc} 題錯誤庫中抽取練習`
    : '尚無錯題，先做隨機練習';
  document.getElementById('wrong-mode-desc').textContent = desc;
  document.getElementById('wrong-mode-btn').disabled = wc === 0;
}

// ═══════════════════════════════════════════════════════════
// QUIZ LOGIC
// ═══════════════════════════════════════════════════════════
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function confirmBack() {
  if (confirm('確定要離開作答？目前進度將不會儲存。')) {
    showScreen('screen-home');
  }
}

function startQuiz(mode) {
  let pool;
  if (mode === 'wrong') {
    const ids = Object.keys(state.wrongBank);
    if (ids.length === 0) { alert('目前沒有錯題！請先做隨機練習。'); return; }
    const wrongQs = ids.map(id => QUESTIONS.find(q => q.id === id)).filter(Boolean);
    if (wrongQs.length === 0) { alert('錯題資料無法比對，請清除錯題庫後重新練習。'); return; }
    const weighted = [];
    wrongQs.forEach(q => {
      const entry = state.wrongBank[q.id];
      if (!entry || !entry.mastered) { weighted.push(q); }
      else if (Math.random() < 0.2) { weighted.push(q); }
    });
    const finalPool = weighted.length > 0 ? weighted : wrongQs;
    pool = shuffle(finalPool).slice(0, 50);
  } else {
    const weighted = [];
    QUESTIONS.forEach(q => {
      const inWrongBank = !!state.wrongBank[q.id];
      if (!inWrongBank) {
        const cc = (state.correctTrack[q.id] || 0);
        if (cc >= 3 && Math.random() >= 0.2) return; // 連續答對3次→20%機率
      }
      weighted.push(q);
    });
    pool = shuffle(weighted.length >= 50 ? weighted : QUESTIONS).slice(0, 50);
  }

  quiz.questions = pool;
  quiz.current = 0;
  quiz.answers = [];
  quiz.wrongInSession = 0;

  showScreen('screen-quiz');
  renderQuestion();
}

function renderQuestion() {
  const q = quiz.questions[quiz.current];
  const total = quiz.questions.length;
  const idx = quiz.current;

  document.getElementById('q-counter').textContent = `${idx+1} / ${total}`;
  document.getElementById('q-wrong-badge').textContent = `✗ ${quiz.wrongInSession} 題錯誤`;
  document.getElementById('q-progress').style.width = `${(idx/total)*100}%`;
  document.getElementById('q-year').textContent = q.year + ' 年';
  document.getElementById('q-text').textContent = q.q;

  const optEl = document.getElementById('q-options');
  optEl.innerHTML = '';
  q.opts.forEach((opt, i) => {
    const key = OPTS[i];
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="option-key">${key}</span><span>${opt}</span>`;
    btn.onclick = () => handleAnswer(key, btn);
    optEl.appendChild(btn);
  });

  const fb = document.getElementById('q-feedback');
  fb.className = 'feedback-box';
  fb.textContent = '';
  document.getElementById('next-btn').classList.remove('show');
}

function handleAnswer(chosen, btn) {
  const q = quiz.questions[quiz.current];
  const correct = q.ans;
  const isCorrect = chosen === correct;

  // Disable all buttons
  document.querySelectorAll('.option-btn').forEach((b, i) => {
    b.disabled = true;
    if (OPTS[i] === correct) b.classList.add('correct');
  });
  if (!isCorrect) btn.classList.add('wrong');

  // Feedback
  const fb = document.getElementById('q-feedback');
  if (isCorrect) {
    if (state.wrongBank[q.id]) {
      state.wrongBank[q.id].consecutiveCorrect = (state.wrongBank[q.id].consecutiveCorrect || 0) + 1;
      const cc = state.wrongBank[q.id].consecutiveCorrect;
      if (cc >= 5) {
        state.wrongBank[q.id].mastered = true;
        fb.className = 'feedback-box correct-fb show';
        fb.textContent = '✓ 正確！🎓 已連續答對5次，此題出現機率降低！';
      } else {
        fb.className = 'feedback-box correct-fb show';
        fb.textContent = `✓ 正確！（連續答對 ${cc}/5）`;
      }
    } else {
      // 從未答錯的題目：追蹤連續答對
      if (!state.correctTrack) state.correctTrack = {};
      state.correctTrack[q.id] = (state.correctTrack[q.id] || 0) + 1;
      const cc = state.correctTrack[q.id];
      if (cc >= 3) {
        fb.className = 'feedback-box correct-fb show';
        fb.textContent = '✓ 正確！⬇️ 已連續答對3次，此題出現機率降低！';
      } else {
        fb.className = 'feedback-box correct-fb show';
        fb.textContent = cc >= 2 ? `✓ 正確！（連續答對 ${cc}/3，再1次降低出現頻率）` : '✓ 正確！';
      }
    }
  } else {
    fb.className = 'feedback-box wrong-fb show';
    fb.textContent = `✗ 錯誤。正確答案是 ${correct}`;
    quiz.wrongInSession++;
    if (!state.wrongBank[q.id]) {
      state.wrongBank[q.id] = { count: 0, q: q.q, ans: q.ans, consecutiveCorrect: 0 };
    }
    state.wrongBank[q.id].count++;
    state.wrongBank[q.id].lastWrong = new Date().toLocaleDateString('zh-TW');
    state.wrongBank[q.id].lastChosen = chosen;
    state.wrongBank[q.id].consecutiveCorrect = 0;
    state.wrongBank[q.id].mastered = false;
    if (state.correctTrack) delete state.correctTrack[q.id]; // 答錯就重置
  }

  quiz.answers.push({ qid: q.id, correct: isCorrect, chosen, correct_ans: correct, q: q.q, opts: q.opts });

  // Update totals
  state.totalAnswered++;
  if (isCorrect) state.totalCorrect++;
  updateTopbar();
  saveState();

  // Next btn
  const nextBtn = document.getElementById('next-btn');
  nextBtn.classList.add('show');
  const isLast = quiz.current >= quiz.questions.length - 1;
  nextBtn.textContent = isLast ? '查看結果' : '下一題 →';
  nextBtn.onclick = isLast ? showResult : nextQuestion;
}

function nextQuestion() {
  try {
    if (quiz.current < quiz.questions.length - 1) {
      quiz.current++;
      renderQuestion();
    } else {
      showResult();
    }
  } catch(e) {
    console.error('nextQuestion error:', e);
    try { showScreen('screen-result'); } catch(e2) {}
  }
}

// ═══════════════════════════════════════════════════════════
// RESULT
// ═══════════════════════════════════════════════════════════
function showResult() {
  state.sessions++;
  saveState();

  const total = quiz.answers.length;
  const correct = quiz.answers.filter(a => a.correct).length;
  const pct = Math.round(correct / total * 100);
  const wrongs = quiz.answers.filter(a => !a.correct);

  document.getElementById('res-score').textContent = `${correct} / ${total}`;
  document.getElementById('res-correct').textContent = correct;
  document.getElementById('res-wrong').textContent = total - correct;
  document.getElementById('res-pct').textContent = pct + '%';

  let emoji = '🎉';
  if (pct < 60) emoji = '😓';
  else if (pct < 80) emoji = '💪';
  else if (pct >= 95) emoji = '🏆';
  document.getElementById('res-emoji').textContent = emoji;

  // Wrong list
  const wl = document.getElementById('res-wrong-list');
  if (wrongs.length === 0) {
    wl.innerHTML = '';
  } else {
    const keys = ['A','B','C','D','E','F','G','H','I','J'];
    try {
      wl.innerHTML = `
        <div class="wrong-review-header">✗ 本次答錯 ${wrongs.length} 題</div>
        ${wrongs.map(a => {
          const optIdx = keys.indexOf(a.correct_ans);
          const correctText = (a.opts && optIdx >= 0 && a.opts[optIdx]) ? a.opts[optIdx] : (a.correct_ans || '');
          const chosenIdx = keys.indexOf(a.chosen);
          const chosenText = (a.opts && chosenIdx >= 0 && a.opts[chosenIdx]) ? a.opts[chosenIdx] : (a.chosen || '');
          const qText = (a.q || '').length > 60 ? (a.q || '').slice(0,60)+'…' : (a.q || '');
          const ct = correctText.length > 20 ? correctText.slice(0,20)+'…' : correctText;
          const cht = chosenText.length > 20 ? chosenText.slice(0,20)+'…' : chosenText;
          return `<div class="wrong-item">
            <div class="wi-q">${qText}</div>
            <div class="wi-ans">
              <span class="wi-yours">你的答案: ${a.chosen || '?'} ${cht}</span>
              <span class="wi-correct">✓ 正確: ${a.correct_ans || '?'} ${ct}</span>
            </div>
          </div>`;
        }).join('')}
      `;
    } catch(e) {
      wl.innerHTML = `<div class="wrong-review-header">✗ 本次答錯 ${wrongs.length} 題（詳細顯示發生錯誤）</div>`;
    }
  }

  const retryBtn = document.getElementById('res-retry-wrong');
  retryBtn.disabled = wrongs.length === 0;
  retryBtn.style.opacity = wrongs.length === 0 ? '0.4' : '1';

  updateHome();
  showScreen('screen-result');
}

// ═══════════════════════════════════════════════════════════
// WRONG BANK VIEW
// ═══════════════════════════════════════════════════════════
function renderBank() {
  const content = document.getElementById('bank-content');
  const ids = Object.keys(state.wrongBank);

  if (ids.length === 0) {
    content.innerHTML = `
      <div class="empty-state">
        <div class="es-icon">🎯</div>
        <p>目前沒有錯題記錄！<br>開始練習後，錯誤題目會自動記錄在這裡。</p>
      </div>`;
    return;
  }

  // Sort: 未掌握優先（錯誤次數多在前），已掌握排最後
  const sorted = ids.sort((a,b) => {
    const ma = state.wrongBank[a].mastered || false;
    const mb = state.wrongBank[b].mastered || false;
    if (ma !== mb) return ma ? 1 : -1;
    return state.wrongBank[b].count - state.wrongBank[a].count;
  });

  const masteredCount = ids.filter(id => state.wrongBank[id].mastered).length;
  const activeCount = ids.length - masteredCount;

  content.innerHTML = `
    <button class="bank-clear-btn" onclick="clearBank()">🗑 清除所有錯題記錄</button>
    ${masteredCount > 0 ? `<div style="font-size:0.82rem;color:var(--accent);margin-bottom:10px;padding:6px 10px;background:rgba(90,122,58,0.08);border-radius:8px;">🎓 已掌握 ${masteredCount} 題　待加強 ${activeCount} 題</div>` : ''}
    ${sorted.map(id => {
      const item = state.wrongBank[id];
      const qData = QUESTIONS.find(q => q.id === id);
      const keys = ['A','B','C','D','E','F','G','H','I','J'];
      const cc = item.consecutiveCorrect || 0;
      const isMastered = item.mastered || false;
      const progressTag = isMastered
        ? `<span style="color:var(--accent);font-weight:600;">🎓 已掌握</span>`
        : cc > 0 ? `<span style="color:var(--warn);">連續答對 ${cc}/5</span>` : '';
      let optsHtml = '';
      if (qData && qData.opts) {
        optsHtml = `<ul class="bi-opts">${qData.opts.map((opt, i) => {
          const letter = keys[i];
          const isCorrect = letter === item.ans;
          const isWrong = item.lastChosen && letter === item.lastChosen && !isCorrect;
          return `<li class="${isCorrect ? 'bi-correct-opt' : (isWrong ? 'bi-wrong-opt' : '')}">${letter}. ${opt}</li>`;
        }).join('')}</ul>`;
      }
      return `<div class="bank-item${isMastered ? ' mastered' : ''}" id="bi-${id}" onclick="toggleBankItem('bi-${id}')" style="${isMastered ? 'opacity:0.6;border-left-color:var(--accent);' : ''}">
        <span class="bi-toggle"></span>
        <div class="bi-q">${item.q}</div>
        <div class="bi-meta">
          <span class="bi-count">錯 ${item.count} 次</span>
          <span>最近: ${item.lastWrong || '—'}</span>
          <span>正解: ${item.ans}</span>
          ${progressTag}
        </div>
        <div class="bi-expand">
          ${optsHtml}
        </div>
      </div>`;
    }).join('')}
  `;
}

function toggleBankItem(id) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle('open');
}

function clearBank() {
  if (!confirm('確定要清除所有錯題記錄嗎？')) return;
  state.wrongBank = {};
  saveState();
  updateTopbar();
  updateHome();
  renderBank();
}

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
loadState();
updateTopbar();
updateHome();

// Re-render bank when shown
document.getElementById('screen-bank').addEventListener('transitionend', renderBank);

// ═══════════════════════════════════════════════════════════
// EXPORT / IMPORT
// ═══════════════════════════════════════════════════════════
function exportData() {
  const json = JSON.stringify(state);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '微生物考題備份.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const parsed = JSON.parse(ev.target.result);
        state = { ...state, ...parsed };
        saveState();
        updateTopbar();
        updateHome();
        alert('✅ 匯入成功！錯題庫已還原。');
      } catch(err) {
        alert('❌ 檔案格式錯誤，無法匯入。');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

// Debug: tap title 5x to show localStorage keys
let _dbgTap = 0, _dbgTimer;
document.getElementById('topbar-title-debug').addEventListener('click', () => {
  _dbgTap++;
  clearTimeout(_dbgTimer);
  _dbgTimer = setTimeout(() => { _dbgTap = 0; }, 1500);
  if (_dbgTap >= 5) {
    _dbgTap = 0;
    const keys = Object.keys(localStorage);
    alert('localStorage keys:\n' + (keys.length ? keys.join('\n') : '（空）'));
  }
});
