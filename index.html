<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">

<title>微生物考題練習系統 (2014–2025)</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');

  :root {
    --bg: #F5F0E8;
    --surface: #FDFAF5;
    --surface-2: #EDE5D8;
    --primary: #8B6848;
    --primary-light: #A67D5A;
    --accent: #5A7A3A;
    --danger: #9B3A2A;
    --warn: #B07030;
    --text: #2C1F0E;
    --text-2: #7A6050;
    --border: #D4C4A8;
    --radius: 12px;
    --shadow: 0 2px 12px rgba(107,76,42,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── TOP BAR ── */
  .topbar {
    background: var(--primary);
    color: white;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  }
  .topbar-title {
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .topbar-title .badge {
    background: rgba(255,255,255,0.18);
    font-size: 0.72rem;
    padding: 2px 8px;
    border-radius: 20px;
    font-weight: 500;
    letter-spacing: 0.05em;
  }
  .topbar-stats {
    display: flex;
    gap: 18px;
    font-size: 0.82rem;
    opacity: 0.9;
  }
  .stat-item { text-align: center; }
  .stat-val { font-family: 'JetBrains Mono', monospace; font-size: 1.1rem; font-weight: 600; line-height: 1.1; }
  .stat-label { font-size: 0.68rem; opacity: 0.75; }

  /* ── SCREENS ── */
  .screen { display: none; }
  .screen.active { display: block; }

  /* ── HOME ── */
  .home-wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 32px 20px;
  }
  .home-hero {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 32px 28px 24px;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
    border-left: 5px solid var(--primary);
  }
  .home-hero h1 { font-size: 1.5rem; color: var(--primary); margin-bottom: 6px; }
  .home-hero p { color: var(--text-2); font-size: 0.9rem; line-height: 1.6; }

  .cards-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
    text-align: center;
  }
  .stat-card .big { font-family: 'JetBrains Mono', monospace; font-size: 2.4rem; font-weight: 700; color: var(--primary); line-height: 1; }
  .stat-card .lbl { font-size: 0.8rem; color: var(--text-2); margin-top: 4px; }

  .mode-list { display: flex; flex-direction: column; gap: 12px; }
  .mode-btn {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 16px;
    transition: border-color 0.18s, transform 0.12s, box-shadow 0.18s;
    text-align: left;
    width: 100%;
    color: var(--text);
  }
  .mode-btn:hover { border-color: var(--primary); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(26,95,122,0.14); }
  .mode-btn.primary-btn { background: var(--primary); border-color: var(--primary); color: white; }
  .mode-btn.primary-btn:hover { background: var(--primary-light); border-color: var(--primary-light); }
  .mode-btn.warn-btn { border-color: var(--warn); }
  .mode-btn.warn-btn:hover { border-color: var(--warn); background: #EDE5D8; }
  .mode-icon { font-size: 1.8rem; flex-shrink: 0; }
  .mode-text strong { display: block; font-size: 1rem; margin-bottom: 2px; }
  .mode-text span { font-size: 0.8rem; color: var(--text-2); }
  .mode-btn.primary-btn .mode-text span { color: rgba(255,255,255,0.75); }
  .mode-btn.warn-btn { color: var(--text); }
  .mode-btn.warn-btn .mode-text span { color: var(--text-2); }
  .mode-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

  /* ── QUIZ ── */
  .quiz-wrap {
    max-width: 740px;
    margin: 0 auto;
    padding: 24px 16px 40px;
  }

  .quiz-progress-bar {
    background: var(--border);
    border-radius: 99px;
    height: 6px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .quiz-progress-fill {
    background: linear-gradient(90deg, var(--primary), #A67D5A);
    height: 100%;
    border-radius: 99px;
    transition: width 0.4s ease;
  }
  .quiz-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-size: 0.8rem;
    color: var(--text-2);
  }
  .quiz-meta .q-counter { font-family: 'JetBrains Mono', monospace; font-weight: 600; color: var(--primary); }
  .wrong-badge {
    background: #FDECEA;
    color: var(--danger);
    border-radius: 20px;
    padding: 2px 10px;
    font-size: 0.75rem;
    font-weight: 600;
  }

  .question-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 28px 24px 20px;
    box-shadow: var(--shadow);
    margin-bottom: 14px;
  }
  .question-year {
    font-size: 0.72rem;
    font-family: 'JetBrains Mono', monospace;
    color: var(--primary);
    background: var(--surface-2);
    padding: 2px 8px;
    border-radius: 6px;
    display: inline-block;
    margin-bottom: 10px;
    font-weight: 600;
  }
  .question-text {
    font-size: 0.97rem;
    line-height: 1.75;
    color: var(--text);
    margin-bottom: 20px;
    font-weight: 500;
  }

  .options-list { display: flex; flex-direction: column; gap: 10px; }
  .option-btn {
    background: var(--bg);
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 13px 16px;
    cursor: pointer;
    text-align: left;
    font-size: 0.9rem;
    line-height: 1.55;
    font-family: 'Noto Sans TC', sans-serif;
    color: var(--text);
    transition: border-color 0.15s, background 0.15s, transform 0.1s;
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }
  .option-btn:not(:disabled):hover { border-color: var(--primary); background: #EDE5D8; transform: translateX(2px); }
  .option-key {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 0.85rem;
    color: var(--primary);
    flex-shrink: 0;
    width: 22px;
  }
  .option-btn.correct { border-color: var(--accent); background: #EAF0E0; }
  .option-btn.correct .option-key { color: var(--accent); }
  .option-btn.wrong { border-color: var(--danger); background: #F5E8E4; }
  .option-btn.wrong .option-key { color: var(--danger); }
  .option-btn:disabled { cursor: default; }

  .feedback-box {
    background: var(--surface-2);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 0.85rem;
    color: var(--text-2);
    line-height: 1.5;
    display: none;
    margin-top: 14px;
  }
  .feedback-box.show { display: block; }
  .feedback-box.correct-fb { background: #EAF0E0; color: #3D5C20; border-left: 4px solid var(--accent); }
  .feedback-box.wrong-fb { background: #F5E8E4; color: #7A2A1A; border-left: 4px solid var(--danger); }

  .quiz-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 16px;
  }
  .back-home-btn {
    background: none;
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 0.88rem;
    font-family: 'Noto Sans TC', sans-serif;
    color: var(--text-2);
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .back-home-btn:hover { border-color: var(--primary); color: var(--primary); }
  .next-btn {
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 12px 28px;
    font-size: 0.95rem;
    font-family: 'Noto Sans TC', sans-serif;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    display: none;
  }
  .next-btn:hover { background: var(--primary-light); transform: translateY(-1px); }
  .next-btn.show { display: inline-block; }

  /* ── RESULT ── */
  .result-wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 32px 20px;
  }
  .result-hero {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 32px 24px;
    text-align: center;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
  }
  .result-emoji { font-size: 3rem; margin-bottom: 12px; }
  .result-score { font-family: 'JetBrains Mono', monospace; font-size: 3.5rem; font-weight: 700; color: var(--primary); line-height: 1; }
  .result-score-label { font-size: 0.85rem; color: var(--text-2); margin-top: 4px; margin-bottom: 16px; }
  .result-stats-row { display: flex; gap: 14px; justify-content: center; margin-top: 18px; }
  .r-stat { background: var(--bg); border-radius: 10px; padding: 12px 20px; min-width: 90px; }
  .r-stat .rv { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; font-weight: 700; }
  .r-stat .rl { font-size: 0.72rem; color: var(--text-2); margin-top: 2px; }
  .r-stat.green .rv { color: var(--accent); }
  .r-stat.red .rv { color: var(--danger); }

  .wrong-review {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 20px;
    overflow: hidden;
  }
  .wrong-review-header {
    padding: 16px 20px;
    background: #F5E8E4;
    color: var(--danger);
    font-weight: 700;
    font-size: 0.9rem;
    border-bottom: 1px solid #D4B0A4;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .wrong-item {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    font-size: 0.84rem;
    line-height: 1.5;
  }
  .wrong-item:last-child { border-bottom: none; }
  .wrong-item .wi-q { color: var(--text); margin-bottom: 5px; }
  .wrong-item .wi-ans { display: flex; gap: 14px; margin-top: 4px; font-size: 0.8rem; }
  .wi-yours { color: var(--danger); }
  .wi-correct { color: var(--accent); font-weight: 600; }

  .result-actions { display: flex; flex-direction: column; gap: 10px; }
  .btn {
    padding: 14px 20px;
    border-radius: var(--radius);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    border: none;
    transition: transform 0.1s, box-shadow 0.15s;
    text-align: center;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,0.14); }
  .btn-primary { background: var(--primary); color: white; }
  .btn-warn { background: var(--warn); color: white; }
  .btn-ghost { background: var(--surface); color: var(--text); border: 2px solid var(--border); }

  /* ── WRONG BANK ── */
  .bank-wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px; }
  .bank-header { margin-bottom: 16px; }
  .bank-header h2 { font-size: 1.15rem; color: var(--primary); }
  .bank-header p { font-size: 0.82rem; color: var(--text-2); margin-top: 2px; }
  .bank-item {
    background: var(--surface);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.07);
    font-size: 0.84rem;
    line-height: 1.55;
    border-left: 4px solid var(--danger);
  }
  .bank-item .bi-q { color: var(--text); margin-bottom: 4px; font-weight: 500; }
  .bank-item .bi-meta { display: flex; gap: 14px; font-size: 0.78rem; color: var(--text-2); margin-top: 4px; }
  .bi-count { color: var(--danger); font-weight: 600; font-family: 'JetBrains Mono', monospace; }
  .bank-clear-btn {
    background: #F5E8E4;
    color: var(--danger);
    border: 2px solid #D4B0A4;
    border-radius: 10px;
    padding: 10px 18px;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 16px;
  }
  .bank-clear-btn:hover { background: #D4B0A4; }
  .empty-state { text-align: center; padding: 48px 20px; color: var(--text-2); }
  .empty-state .es-icon { font-size: 3rem; margin-bottom: 12px; }
  .empty-state p { font-size: 0.9rem; }

  .transfer-row {
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }
  .transfer-btn {
    flex: 1;
    background: none;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    font-size: 0.82rem;
    font-family: 'Noto Sans TC', sans-serif;
    color: var(--text-2);
    cursor: pointer;
  }
  .transfer-btn:hover { border-color: var(--primary); color: var(--primary); }

  /* responsive */
  @media (max-width: 500px) {
    .topbar-stats { gap: 12px; }
    .cards-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    .question-card { padding: 20px 14px 14px; }
    .r-stat { padding: 10px 14px; min-width: 70px; }
  }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-title" id="topbar-title-debug">
    🧫 微生物考題練習
    <span class="badge">TTQAS 2014–2025</span>
  </div>
  <div class="topbar-stats">
    <div class="stat-item">
      <div class="stat-val" id="tb-total">0</div>
      <div class="stat-label">已作答</div>
    </div>
    <div class="stat-item">
      <div class="stat-val" id="tb-acc">—</div>
      <div class="stat-label">正確率</div>
    </div>
    <div class="stat-item">
      <div class="stat-val" id="tb-wrong-cnt">0</div>
      <div class="stat-label">錯誤庫</div>
    </div>
  </div>
</div>

<!-- HOME SCREEN -->
<div id="screen-home" class="screen active">
  <div class="home-wrap">
    <div class="home-hero">
      <h1>每日微生物練習</h1>
      <p>涵蓋 2014–2025 年題目（含第十三屆2025年100題），從題庫隨機抽取 50 題作答，系統自動記錄錯題，讓你重複練習直到完全掌握。</p>
    </div>
    <div class="cards-grid">
      <div class="stat-card">
        <div class="big" id="home-total">0</div>
        <div class="lbl">累計作答</div>
      </div>
      <div class="stat-card">
        <div class="big" id="home-acc">—</div>
        <div class="lbl">總正確率</div>
      </div>
      <div class="stat-card">
        <div class="big" id="home-sessions">0</div>
        <div class="lbl">練習次數</div>
      </div>
      <div class="stat-card">
        <div class="big" id="home-wrong">0</div>
        <div class="lbl">錯誤庫題數</div>
      </div>
    </div>
    <div class="mode-list">
      <button class="mode-btn primary-btn" onclick="startQuiz('random')">
        <span class="mode-icon">🎲</span>
        <span class="mode-text">
          <strong>隨機 50 題</strong>
          <span>從所有題目隨機抽取，每次不同組合</span>
        </span>
      </button>
      <button class="mode-btn warn-btn" onclick="alert('按到了'); startQuiz('wrong')" id="wrong-mode-btn">
        <span class="mode-icon">🔁</span>
        <span class="mode-text">
          <strong>錯題複習</strong>
          <span id="wrong-mode-desc">從錯誤庫中抽取練習（尚無錯題）</span>
        </span>
      </button>
      <button class="mode-btn" onclick="showScreen('screen-bank')">
        <span class="mode-icon">📋</span>
        <span class="mode-text">
          <strong>查看錯題庫</strong>
          <span>瀏覽所有記錄的錯誤題目</span>
        </span>
      </button>
    </div>
    <div class="transfer-row">
      <button class="transfer-btn" onclick="exportData()">📤 匯出資料</button>
      <button class="transfer-btn" onclick="importData()">📥 匯入資料</button>
    </div>
  </div>
</div>

<!-- QUIZ SCREEN -->
<div id="screen-quiz" class="screen">
  <div class="quiz-wrap">
    <div class="quiz-meta">
      <span class="q-counter" id="q-counter">1 / 50</span>
      <span class="wrong-badge" id="q-wrong-badge">✗ 0 題錯誤</span>
    </div>
    <div class="quiz-progress-bar">
      <div class="quiz-progress-fill" id="q-progress" style="width:0%"></div>
    </div>
    <div class="question-card">
      <div class="question-year" id="q-year">2014</div>
      <div class="question-text" id="q-text">題目載入中…</div>
      <div class="options-list" id="q-options"></div>
      <div class="feedback-box" id="q-feedback"></div>
    </div>
    <div class="quiz-nav">
      <button class="back-home-btn" onclick="confirmBack()">← 返回</button>
      <button class="next-btn" id="next-btn" onclick="nextQuestion()">下一題 →</button>
    </div>
  </div>
</div>

<!-- RESULT SCREEN -->
<div id="screen-result" class="screen">
  <div class="result-wrap">
    <div class="result-hero">
      <div class="result-emoji" id="res-emoji">🎉</div>
      <div class="result-score" id="res-score">0</div>
      <div class="result-score-label">答對 / 50 題</div>
      <div class="result-stats-row">
        <div class="r-stat green">
          <div class="rv" id="res-correct">0</div>
          <div class="rl">答對</div>
        </div>
        <div class="r-stat red">
          <div class="rv" id="res-wrong">0</div>
          <div class="rl">答錯</div>
        </div>

  { id:'2014-052', year:2014, q:'公告的食品中志賀氏桿菌檢驗方法，首先進行檢液調製，以增菌培養液稀釋10倍，混合均勻後置入厭氧瓶中，再放入新鮮的催化劑及氣體包，於42℃培養20小時，請問增菌培養液為何？', opts:['Selenite cystine broth(SC)','含有綠黴素(chloramphenicol solution)的志賀氏桿菌培養液(TT)','Rappaport-Vassiliadis broth (RV)','含有諾伯黴素(novobiocin solution)的志賀氏桿菌培養液','含有四環黴素(tetracycline solution)的志賀氏桿菌培養液'], ans:'D' },

  { id:'2014-057', year:2014, q:'以下有關鑑定套組敘述，何者為「非」？', opts:['鑑定套組的設計是根據生化特性的百分比進行統計的結果','雖然操作鑑定套組最後得到的鑑定密碼不同，但是輸入鑑定軟體後，可能為同一株菌','同樣是大腸桿菌，於每一個生化鑑定套組反應必須是相同的','鑑定套組得到的可信度若低於90%，需依照鑑定套組軟體的建議操作追加試驗或是檢查操作過程中是否有問題','需檢查套組鑑定的最後獲得的菌名是否與菌落特徵相符，才能確定其正確性'], ans:'C' },
  { id:'2014-058', year:2014, q:'公告的食品中阪崎腸桿菌檢驗方法，將10mL的一般滋養增菌的檢液加入選擇性增菌培養液[90mL腸內細菌科增菌培養液(EE broth)]，於35℃培養18~24小時，分離培養時取一接種環量，在哪二種培養基表面劃線，得到生長菌落再進行鑑定？', opts:['Enterobacter sakazakii agar (ESA)及溴甲酚紫培養基(Bromcresol purple agar)','紫紅膽鹽葡萄糖培養基(VRBG)及Enterobacter sakazakii agar (ESA)','溴甲酚紫培養基(Bromcresol purple agar)及紫紅膽鹽葡萄糖培養基(VRBG)','伊紅美藍培養基(EMB)及顯色EEC培養基','Enterobacter sakazakii agar (ESA)及顯色EEC培養基'], ans:'B' },
  { id:'2014-059', year:2014, q:'依據FDA指引，若採用經過AOAC-OMA或是AFNORA認證之快速微生物檢測方法，使用實驗室「不需」執行以下何種措施？', opts:['確認該方法(verification)','驗證偵測極限(<30 CFU)','與其他實驗室比對','考量基質影響'], ans:'C' },

  { id:'2014-061', year:2014, q:'已生長菌落進行氧化酶試驗(Oxidase test)，當菌落接觸到氧化酶試劑後陽性反應結果為？', opts:['將菌落塗在濾紙上，然後加入試劑後變藍色','將加入菌落與試劑混合，然後在紙片上順時針旋轉後由藍色顆粒凝集','試劑接觸到載玻片上的菌體產生大量氣泡','將菌落塗在載玻片上，然後加入試劑後呈現藍綠色','將細菌懸浮在試管中的生理食鹽水，然後加入試劑呈現黃色'], ans:'A' },
  { id:'2014-062', year:2014, q:'菌種保存注意事項包括如下，何者為「非」？', opts:['不能保存於含有發酵性醣類的培養基','不可讓培養菌乾枯','對溫度變化敏感的菌種，不能用冰箱儲存，但可用快速冷凍法儲存','可使用選擇性培養基上的菌落來保存','作抗生素感受性試驗的品管菌，由庫存取出後，不得連續使用一星期以上'], ans:'D' },

  { id:'2014-095', year:2014, q:'公告的食品中沙門氏桿菌檢驗方法，指出檢體需要先進行一般滋養增菌後，再將檢液移種至適當增菌培養基，在適當溫度培養24±2小時，請問如下的敘述何者「錯誤」？', opts:['將檢液先以適當的一般滋養培養基進行10倍稀釋後培養及增菌','將培養後檢液1mL加入RV broth 10mL，以及將檢液0.1mL加入TT broth 10mL','將RV broth培養在42℃水浴','TT broth培養於43℃水浴','培養後再分別接種至XLD、BS及HE agar'], ans:'B' },

  { id:'2014-097', year:2014, q:'下列何者為衛福部公告方法中使用於沙門氏桿菌檢測之分離或初步鑑定培養基，何者「除外」？', opts:['Xylose Lysine Deoxycholate Agar (XLD)','Hektoen Enteric Agar (HE)','Bismuth Sulfite Agar (BS)','TSI及LIA','Motility test medium'], ans:'D' },
  { id:'2014-098', year:2014, q:'檢測食品中黴菌及酵母菌常用到塗抺平板法，公告方法建議接種DRBC平皿，其理由可包括如下，何者「除外」？', opts:['DRBC培養基因含二氯喃、孟加拉玫瑰紅，能有效促進快速生長黴菌之生長','因可減緩快速生長黴菌而有利其他酵母菌及黴菌之檢出','適用於塗佈型(spreader)黴菌(如毛黴及根黴)之檢驗','同時計數酵母菌及黴菌時，應使用DRBC培養基','當食品檢體水活性大於0.95'], ans:'A' },

  { id:'2015-001', year:2015, q:'假設某三合一乳酸菌產品含有乳酸桿菌、雙叉桿菌及腸球菌，當進行乳酸桿菌計數時的計算方法為何？', opts:['所有生長在MRS平板上的菌數','MRS平板上的菌數扣除TOS或TOS-MUP上的菌數','MRS平板上的菌數扣除TOS或TOS-MUP以及Enterococcus Agar上的菌數','MRS平板上的菌數加上TOS或TOS-MUP上的菌數','MRS平板上的菌數加上Enterococcus Agar上的菌數'], ans:'C' },

  { id:'2015-004', year:2015, q:'下列物質中會引起漲氣者為：', opts:['glucose','mannose','stachyose','mannitol','Methionine'], ans:'C' },
  { id:'2015-005', year:2015, q:'大陸藥典有關腸道微生態活菌製品進行成品安全性試驗的非特異性毒性檢查，下述何者錯誤？', opts:['以10隻小鼠進行腹腔注射，每天0.5 mL/次，連續3天','應根據製品的使用途徑和人用劑量確定試驗方法','以5隻小鼠進行經口灌胃，每天0.5 mL/次，連續3天','自第1天測試起，連續觀察7天，小鼠應健康存活、體重增加，判為合格','如小鼠測試不合格，可另選10隻小鼠復試1次，再進行判定'], ans:'A' },
  { id:'2015-006', year:2015, q:'使用化學品之個人安全維護，下列設備中何者最可能不實用？', opts:['緊急沖淋器','洗眼設備','手套及實驗衣','口罩','使用特製的抗濺護板'], ans:'D' },
  { id:'2015-007', year:2015, q:'金黃色葡萄球菌腸毒素特色與R-biopharm ELISA檢驗套組，下列何者描述為正確？', opts:['腸毒素對熱非常不穩定，100℃30分鐘可被破壞','ELISA步驟中最重要的是加入Conjugate的時間','腸毒素最常見為A與B型','R-biopharm SET ABCDE kit判讀需搭配450 nm光度計使用','套組不需冷藏'], ans:'D' },
  { id:'2015-008', year:2015, q:'大陸藥典有關微生態活菌製品活菌數測定法應如何進行？', opts:['無菌稱取3.0g製品或菌粉進行10倍稀釋，從10倍稀釋液取0.5mL放置選擇性瓊脂培養基平皿，雙重覆','無菌稱取25.0g製品或菌粉進行10倍稀釋，接著系列10倍稀釋，分別取0.5mL放置選擇性瓊脂培養基平皿，雙重覆','無菌稱取50.0g製品或菌粉進行10倍稀釋，接著系列10倍稀釋，分別取0.1mL放置選擇性瓊脂培養基平皿，三重覆','無菌稱取3.0g製品或菌粉進行10倍稀釋，接著系列10倍稀釋，分別取0.1mL放置選擇性瓊脂培養基平皿，三重覆','無菌稱取1.0g製品或菌粉進行10倍稀釋，接著系列10倍稀釋，分別取0.2mL放置選擇性瓊脂培養基平皿，四重覆'], ans:'D' },
  { id:'2015-009', year:2015, q:'何者被認為具有anti-nutritional property？', opts:['Raffinose','linoleic acid','saponin','isoflavone','xylose'], ans:'C' },
  { id:'2015-010', year:2015, q:'一般食品微生物病原菌的檢驗必須在哪個等級實驗室分析？', opts:['BSL-1','BSL-2','BSL-3','BSL-4','以上均可'], ans:'B' },
  { id:'2015-011', year:2015, q:'下列何者並非是避免分子生物實驗室汙染的方法：', opts:['使用具有濾膜(filter)的無菌吸管尖(tip)','操作過程適時更換手套','不同區域使用不同的分注器與實驗衣','實驗結束以1%氫氧化鈉擦拭桌面','每日工作結束以UV照射30 mins以上'], ans:'D' },
  { id:'2015-012', year:2015, q:'製藥/食品領域最近引進一些新的微生物技術作為傳統方法的替代，請問如下敍述何者不正確？', opts:['生物發光技術、電化學技術、比濁法是基於微生物生長資訊(如速度)','流式細胞技術法（flow cytometry）是基於直接測定被檢測介質(產品)中的微生物','核酸擴增技術(PCR)、基因指紋分析技術是基於微生物細胞特定組成分的分析技術','與傳統方法比較，新的檢測技術較為簡便快速或具有real-time監控的潛力','新的微生物檢驗技術正確率及靈敏度比傳統方法高'], ans:'E' },
  { id:'2015-013', year:2015, q:'CWA 15793:2011實驗室生物風險管理規範，針對生物保全風險，下列何者敘述是錯誤的？', opts:['生物材料保全包括：保存、異動、銷毀','生物保全與稽核之要求','異常事件之處理','生物材料異動與留存不需強制管理','國內是依據傳染病防治法第34條作要求'], ans:'D' },
  { id:'2015-014', year:2015, q:'食品微生物李斯特菌單核球菌檢驗方法，下列何者敘述為非？', opts:['產色素培養基已列入公告方法','一般食品的檢驗採樣量為25克','可使用市售確認過之套組作為替代方法','乳品與加工食品需監測之病源菌','公告方法已將real-time PCR列入第二部檢驗方法'], ans:'B' },
  { id:'2015-015', year:2015, q:'檢體中微生物定量檢驗方法的確效，有關耐用性(Ruggedness)的如下敍述，何者錯誤？', opts:['耐用性是指相同的樣品在正常的實驗條件發生變化時所得檢驗結果的精密度','耐用性可視為微生物檢驗方法在檢驗結果上抵抗操作和環境變化的能力','方法使用者應優先測定此確效參數，同時確效過程中應注意樣品的一致性','在樣品中接種一定數量試驗菌，分別由相同人員在相同時間使用相同試劑進行檢驗','對檢驗結果進行統計分析，以RSD(X2)評估兩種方法的耐用性差異，可接受變異係數範圍為10~15%'], ans:'D' },
  { id:'2015-016', year:2015, q:'當日操作的Thermo SureTect Real-time PCR套組，其每個反應內皆含內部對照控制組(IAC)，其目的主要為：', opts:['加強PCR反應','吸附樣品DNA','反應偽陰性監控','降低背景值','計算樣品DNA濃度'], ans:'C' },
  { id:'2015-017', year:2015, q:'檢體中微生物定量檢驗方法的確效，有關定量極限(Limit of Quantification)的如下敍述，何者錯誤？', opts:['定量極限是指樣品中能被準確定量測定的微生物最高數量','在定量極限確效時，應選擇在檢驗範圍內至少5個菌液濃度，每個濃度重複取樣測定不少於5次，替代方法的定量極限不得大於公告方法','由於細菌計數和菌落數服從泊松分佈，替代方法的定量極限僅需證實在相近的低限度下其靈敏度至少相當於公告方法','接受的基準：定量極限比須等於或優於公告方法','定量極限確效的方法需採用統計方法比較替代方法的檢驗結果與公告方法結果的差異'], ans:'A' },
  { id:'2015-018', year:2015, q:'在Real-time PCR中，CT(Cq)值與樣品DNA濃度成反比，且為2-n變化，若已知某一標準品DNA實驗之CT值為24，其濃度為100 g，另一代測樣本CT值為26，則其DNA濃度應約為：', opts:['25 g','50 g','200 g','400 g','600 g'], ans:'A' },
  { id:'2015-019', year:2015, q:'有關食品病原性大腸桿菌的檢驗，如果檢體為含油脂量多、不易散及易起泡沫之檢體時，下列處理方法最為正確？', opts:['將檢體以PBS稀釋10倍改成稀釋100倍','加入適量的乳化劑如1% Tween 80，使其於檢液中濃度為0.01%','加入適量的乳化劑如Triten X-100，使其於檢液中濃度為1%','加入適量的乳化劑如Tegritol Anionic 7，使其於檢液中濃度為0.01%','加入適量的NaCl，使檢液呈鹼性而易於乳化'], ans:'C' },
  { id:'2015-020', year:2015, q:'目標菌在產色培養基上可產生專一特有的顏色，此顏色是因為菌體本身與產色質產生何種專一性反應而導致？', opts:['菌體生長利用產色質產酸，改變pH值','菌體生長使產色質產生螢光','菌體中之酵素與產色質反應呈色','產色質為菌體生長之必須營養成分','由菌體還原螢光素而呈色'], ans:'C' },
  { id:'2015-021', year:2015, q:'食品中分離疑似病原性大腸桿菌的菌落，操作Vi試驗(歐普氏試驗)需要加入歐普氏試劑，VP-A及VP-B的加入量為何？', opts:['VP-A加1 mL，而VP-B加0.5 mL','VP-A加12 μL，而VP-B加4 μL','VP-A加12滴(約0.6 mL)，而VP-B加4滴(約0.2 mL)','應先將VP-B加1 mL，然後加VP-A 0.5 mL','VP-A加4滴，而VP-B加12滴'], ans:'C' },
  { id:'2015-022', year:2015, q:'食品的分離菌需要進行革蘭氏染色，革蘭氏染色液中最容易因放久而失效的試劑為何？', opts:['哈克氏結晶紫液(初染劑)','革蘭氏碘液(媒染劑)','哈克氏沙黃複染液(複染劑)','95%乙醇(脫色劑)','只要密封良好，均不會失效'], ans:'B' },
  { id:'2015-023', year:2015, q:'食品中分離疑似病原性大腸桿菌的菌落，應操作的血清學試驗為何？(1)多價本體莢膜(Polyvalent "OK" type)抗血清試驗；(2)單價本體莢膜(Monovalent "OK" type)抗血清試驗；(3)單價本體(Monovalent "O" type)抗血清試驗；(4)多價本體鞭毛(Polyvalent "OH" type)抗血清試驗；(5)單價鞭毛(Monovalent "H" type)抗血清試驗', opts:['(1)+(2)+(3)','(1)+(2)+(4)','(1)+(2)+(5)','(2)+(3)+(4)','(3)+(4)+(5)'], ans:'A' },
  { id:'2015-024', year:2015, q:'有關食品病原性大腸桿菌的檢驗如果需要增菌，則將檢體以BHI培養液進行增菌3小時，接著進行的步驟為何？', opts:['移入等量之雙倍濃度TP培養液，於44±0.2℃培養20小時','移入等量之雙倍濃度PBS稀釋液，於35±0.2℃培養20小時','移入等量之雙倍濃度PBS稀釋液，於35±0.2℃培養36~48小時','移入等量之雙倍濃度TP培養液，於35±0.2℃培養20小時','移入等量之雙倍濃度TP培養液，於44±0.2℃培養48~72小時'], ans:'A' },
  { id:'2015-025', year:2015, q:'食品的分離菌需要進行革蘭氏染色，如下為革蘭氏染色抹片製作容易發生的缺失，但何者正確？', opts:['抹片製作太厚','抹片仍溼即以酒精燈烤乾','一個載玻片可分別作3種菌落的抹片','沒有包括革蘭氏陽性菌及革蘭氏陰性菌的抹片對照','抹片的製作範圍太小'], ans:'C' },
  { id:'2015-026', year:2015, q:'有關食品病原性大腸桿菌的檢驗如果需要增菌，使用BHI培養液取代PBS稀釋液的目的為何？', opts:['養分較佳，病原性大腸桿菌生長更快','選擇性佳，只有病原性大腸桿菌能夠生長','區分性佳，可以區別病原性大腸桿菌與其它細菌','使睡眠中的大腸桿菌細胞復甦(resuscitation)','若混濁，可立即操作血清學試驗鑑別病原性大腸桿菌'], ans:'D' },
  { id:'2015-027', year:2015, q:'有關食品病原性大腸桿菌的檢驗如果需要增菌，增菌移種何種培養基？', opts:['EMB及馬康奇(洋菜)培養基，於44±0.2℃培養36~48小時','EMB及馬康奇(洋菜)培養基，於44±0.2℃培養20~24小時','L-EMB及XLD培養基，於44±0.2℃培養36~48小時','L-EMB及馬康奇(洋菜)培養基，於35±1℃培養20±2小時','L-EMB及血液(洋菜)培養基，於35±1℃培養20±2小時'], ans:'D' },
  { id:'2015-028', year:2015, q:'食品中病原性大腸桿菌若發現疑似大腸桿菌，需移種何種培養基以便操作生化試驗及血清學試驗？', opts:['EMB','馬康奇(洋菜)培養基','L-EMB','XLD培養基','血液(洋菜)培養基(Blood agar base w/sheep blood)'], ans:'E' },
  { id:'2015-029', year:2015, q:'RomerLab RapidChek病原菌系列中，下列何者為非？', opts:['原理屬於免疫層析法','結果判讀中一定要出現control line','具有AOAC認證套組','有沙門氏菌與李斯特菌、大腸桿菌O157系列','李斯特菌插入快檢片前不需加熱'], ans:'E' },
  { id:'2015-030', year:2015, q:'食品中大腸桿菌O157:H7的檢驗，需先將檢體進行增菌，請問使用的增菌液為何？', opts:['修飾後胰化酪蛋白大豆培養液(mTSB)','出血性大腸桿菌增菌培養液(EEB)','雙倍濃度磷酸鹽緩衝生理食鹽水(PBS)','Butterfield磷酸鹽緩衝液(BPBW)','加特殊抗生素的營養肉湯(Nutrient broth)'], ans:'B' },
  { id:'2015-031', year:2015, q:'食品中大腸桿菌O157:H7的檢驗，如果操作IMViC試驗，下列培養條件敍述中，何者錯誤(不符合公告方法)？', opts:['吲哚試驗的胰化蛋白腖培養液(Tryptone Broth)，培養在35℃ 24±2小時才判讀','作為歐普氏試驗(VP test)的MR-VP培養液，培養在35℃ 48±2小時才判讀','作為VP test及甲基紅試驗(MR test)的MR-VP培養液，均需培養在35℃ 72±2小時才判讀','作為MR test的MR-VP培養液，培養在35℃ 48±2小時才判讀','作為檸檬酸鹽利用試驗的Koser Citrate Broth，置於35℃培養96±2小時才判讀'], ans:'C' },
  { id:'2015-032', year:2015, q:'食品中大腸桿菌O157:H7的檢驗，如果操作IMViC試驗，其中Vi代表？', opts:['V代表歐普氏試驗(VP test)而i代表吲哚試驗(Indole test)','V代表歐普氏試驗(VP test)，i為諧音字','V代表Vogel-Johnson medium，i代表吲哚試驗(Indole test)','V代表媒介者(Vector)，i代表感染試驗(Infection test)','V代表歐普氏試驗(VP test)，i代表感染試驗(Infection test)'], ans:'B' },
  { id:'2015-033', year:2015, q:'產色培養基上需有單一菌落較易觀察菌落之顏色，檢體若未經稀釋，則以下何種接種方式較為適合？', opts:['四區劃線法','混合稀釋法','表面塗抹法','穿刺接種法','雙層覆蓋接種法'], ans:'A' },
  { id:'2015-034', year:2015, q:'食品中沙門氏桿菌的檢驗，請問最常用的稀釋液為何？', opts:['乳糖培養液(Lactose broth)及TSB','TSB及硫酸月桂酸鈉(LST)','無菌蒸餾水及生理食鹽水','無菌生理食鹽水及三糖鐵培養基','胰化蛋白腖培養液(Tryptone broth)及三糖鐵培養基'], ans:'A' },
  { id:'2015-035', year:2015, q:'食品中沙門氏桿菌的檢驗，基本上最好選擇如下組合的增菌液？', opts:['亞硒酸胱胺酸培養液(SC)及加抗生素的胰化蛋白腖培養液','單獨在四硫代硫酸鹽培養液(TT)增菌','單獨在Rappaport-Vassiliadis培養液(RV)增菌','單獨在加抗生素的胰化蛋白腖培養液增菌','Rappaport-Vassiliadis培養液(RV)與四硫代硫酸鹽培養液(TT)'], ans:'E' },
  { id:'2015-036', year:2015, q:'經革蘭氏染色確認為革蘭氏陰性桿菌後，需操作以下何種快速試驗，以區分不同菌屬？', opts:['氧化酶試驗 Oxidase test','觸酶試驗 Catalase test','金黃色葡萄球菌乳膠凝集試驗 Staph Latex','沙門氏菌抗血清 Salmonella Antiserum','生化八管試驗'], ans:'A' },
  { id:'2015-037', year:2015, q:'血清學及生化套組鑑別方法中，以下示範菌種與套組鑑別之結果何者錯誤：', opts:['金黃色葡萄球菌於Staph Latex中，會呈現大塊凝集之反應','大腸桿菌於氧化酶試驗(Oxidase test)中，會呈現不變色之陰性反應','表皮葡萄球菌之觸酶試驗(Catalase test)為陽性，可使用API Staph套組','沙門氏菌之氧化酶試驗為陰性，可使用RapID onE套組','金黃色葡萄球菌之氧化酶試驗為陰性，可使用Enteropluri套組'], ans:'E' },
  { id:'2015-038', year:2015, q:'食品中沙門氏桿菌的檢驗，請問如下何者為公告方法建議的分離培養基組合？', opts:['SS培養基及XLD培養基','XLD培養基及MacConkey agar及BG培養基','HE培養基、XLD培養基及BS培養基(Bismuth sulfite agar)','BS培養基、EMB及BG培養基','MacConkey agar、EMB及BS培養基'], ans:'C' },
  { id:'2015-039', year:2015, q:'公告的食品中黴菌酵母菌之檢測方法，下列敘述中何者錯誤？', opts:['培養基為DG18','培養基為DRBC','培養溫度為25±2℃','方法執行3重複檢驗','使用PDA或SDA培養基'], ans:'E' },
  { id:'2015-040', year:2015, q:'食品中沙門氏桿菌的檢驗，將懷疑的生長的菌落接種哪二種生化試驗培養基？', opts:['TSI及SIM斜面培養基','RV及SIM斜面培養基','TSI及LIA斜面培養基','LIA及UREA斜面培養基','TSI及UREA斜面培養基'], ans:'C' },
  { id:'2015-041', year:2015, q:'食品中沙門氏桿菌的檢驗，在分離培養基上的懷疑菌落需接種TSI斜面培養基，培養後其典型反應為何？', opts:['斜面呈黃色反應(酸性)，底部呈黃色反應(酸性)，有培養基顏色變黑或無硫化氫產生','斜面呈紅色反應(鹼性)，底部呈黃色(或黑色)反應(酸性)，若培養基顏色變黑代表硫化氫產生','斜面呈紅色反應(鹼性)，底部呈紅色反應(鹼性)，有培養基顏色變黑代表無硫化氫產生','斜面呈黃色反應(酸性)，整管呈黑色代表底部呈黃色反應(酸性)及有硫化氫產生','斜面及底部均呈不變色反應(酸性)，底部培養基裂開代表產氣'], ans:'B' },
  { id:'2015-042', year:2015, q:'課程中示範API、Enteropluri與RapID鑑定套組，以下有關鑑定套組之敘述，何者正確？', opts:['API鑑定套組所需要之新鮮純化菌落最多，接種菌液濃度需調整為McFarland 2','Enteropluri鑑定套組操作簡單，兩邊螺蓋旋開均可以沾取待測菌落','RapID鑑定套組接種方式簡單，只需要將菌液倒入反應槽即可完成接種，不需要每個反應槽加菌液','此三種鑑定套組均提供電腦版鑑定軟體，所有鑑定紀錄皆可儲存','此三種鑑定套組都有套組選擇流程表，可鑑定常見食品病原菌'], ans:'C' },
  { id:'2015-043', year:2015, q:'食品中沙門氏桿菌的檢驗，菌株經商業生化套組或公告方法鑑定為疑似沙門氏桿菌，檢驗室隨後仍需進行何種試驗？', opts:['沙門氏菌族群(O)抗血清試驗及鞭毛血清試驗，如二者均為正反應，則判定為沙門氏桿菌陽性','TSIA及LIA生化試驗，培養液由橘紅色轉變為黃色或黑色，則判定為沙門氏菌桿菌陽性','接種TSIA等八管的生化試驗，若反應的電腦密碼符合沙門氏菌，則判定為沙門氏菌桿菌陽性','接種沙門氏菌產色培養基，培養後若產生特有的顏色，則判定為沙門氏菌桿菌陽性','沙門氏菌本體族群(O)抗血清試驗及莢膜血清試驗，如前者為正反應後者為負反應，則判定陽性'], ans:'A' },
  { id:'2015-044', year:2015, q:'下列何者"非"real time PCR技術應用於食品檢驗的優點？', opts:['TFDA已經公告多種使用此原理為基礎的微生物檢驗方法','檢驗標的不僅限於微生物','經過一次增殖後即可採用此方法檢測李斯特菌','可應用於培養基上之單純菌落','對於抗生素有良好的靈敏度'], ans:'E' },
  { id:'2015-045', year:2015, q:'食品中與乳品中單核球增多性李斯特菌的檢驗，兩者使用的培養基不同，下列敘述中，何者正確？', opts:['乳品使用UVM培養液，而食品使用增菌培養液(BLEB)進行第一次增菌','兩者使用費氏培養液(Fraser broth)進行第一次增菌，培養4小時後再加入混合液進行第二次增菌','前者使用改良牛津培養基(MOX)及HL平板，而後者建議使用MOX、OXA及PALCAM三種做為分離培養基，二重覆','不同來源(食品或乳品)的分離菌進行CAMP試驗時，使用的培養基不同','二者均建議同時選用一種市售李斯特菌選擇性呈色培養基，進行增菌液接種'], ans:'E' },
  { id:'2015-046', year:2015, q:'食品中單核球增多性李斯特菌的檢驗，操作CAMP時，使用哪二種試驗菌？', opts:['Streptococcus agalactiae及Staphylococcus aureus','Rhodotolula equi及Staphylococcus aureus','Rhodococcus equi及Staphylococcus aureus','Streptococcus pyogenes及Streptococcus agalactiae','Staphylococcus aureus及Enterococcus faecalis'], ans:'C' },
  { id:'2015-047', year:2015, q:'食品中單核球增多性李斯特菌的檢驗，操作運動性試驗，如下敘述中何者錯誤？', opts:['穿刺運動性測試培養基(MTM)約1/2深','將MTM培養在30~35℃培養箱中，培養18~24小時','將MTM培養在20~25℃培養箱中，培養2~3天','培養後，上緣下3~5 mm處呈現傘狀者為正反應','李斯特菌為運動性正反應'], ans:'B' },
  { id:'2015-048', year:2015, q:'食品中單核球增多性李斯特菌的最確數(MPN)檢驗，使用的三階三支培養基為何？', opts:['費氏培養液(Fraser broth)','改良牛津培養液(MOX broth)','PALCAM培養液','UVM培養液','產色液體培養基'], ans:'D' },
  { id:'2015-049', year:2015, q:'冷凍食品之解凍溫度及時間範圍為以下何者？', opts:['2~3℃；24小時','8~10℃；18小時','2~5℃；18小時','10℃；18小時','6~10℃；24小時'], ans:'C' },
  { id:'2015-050', year:2015, q:'食品中沙門氏桿菌的檢驗，若為懷疑為高度污染食品，培養條件何者為正確？', opts:['RV培養液置於42℃水浴培養24±2小時，TT培養液置於43℃水浴培養24±2小時','RV培養液置於42℃水浴培養24±2小時，TT培養液置於35℃水浴培養24±2小時','RV培養液置於35℃水浴培養24±2小時，TT培養液置於43℃培養箱培養48±2小時','RV培養液置於35℃水浴培養24±2小時，TT培養液置於28℃水浴培養24±2小時','RV培養液置於室溫培養24±2小時，TT培養液置於42℃水浴培養24±2小時'], ans:'A' },
  { id:'2015-051', year:2015, q:'食品中黴菌酵母菌之檢測方法，其稀釋液為以下何種？', opts:['0.85%生理食鹽水','無菌水','PH 7.2磷酸緩衝溶液','0.1% peptone water','SDB'], ans:'D' },
  { id:'2015-052', year:2015, q:'食品中單核球增多性李斯特菌檢驗，增菌後移種分離培養基的技術為何？', opts:['以棉棒進行四區劃線法','以棉棒進行整個平板厚塗法','取增菌液0.1 mL進行傾注平板法','塗佈平板培養基的1/2部份，再以接種環進行另外二區劃線','取0.1 mL進行系列稀釋後，塗抹在平板'], ans:'D' },
  { id:'2015-053', year:2015, q:'食品中仙人掌桿菌檢驗，建議分離菌操作蛋白質素晶體試驗，顯微鏡下的觀察，如下敘述何者正確？', opts:['仙人掌桿菌產生的毒素晶體呈六角狀發光體','仙人掌桿菌產生的毒素晶體呈暗黑色的四角型或鑽石狀','仙人掌桿菌毒素晶體比菌體內的芽孢稍大','仙人掌桿菌不會產生游離芽孢','仙人掌桿菌不產生毒素晶體，但可產生游離芽孢'], ans:'E' },
  { id:'2015-054', year:2015, q:'鐵鹽-牛乳推定試驗(Iron-milk presumptive test)適合於何種食品中毒病原菌的檢驗？', opts:['仙人掌桿菌','產氣莢膜桿菌','肉毒桿菌','金黃色葡萄球菌','彎曲桿菌'], ans:'B' },
  { id:'2015-055', year:2015, q:'裝在血清瓶培養基滅菌後之保存期？', opts:['1個月','20天','14天','5天','3個月'], ans:'C' },
  { id:'2015-056', year:2015, q:'高壓滅菌釜之滅菌功能的確效應以何者來執行？', opts:['真菌分生孢子','大腸桿菌','含內生孢子細菌','酵母菌','厭氧梭菌'], ans:'C' },
  { id:'2015-057', year:2015, q:'當懷疑食品中毒病原菌為仙人掌桿菌，但菌數低於100 CFU/g或10 CFU/mL時，需要使用MPN法，請問使用的培養基為何？', opts:['MYP液體培養基','Trypticase-soy-polymyxin broth (TSPB)','Lauryl sulfate tryptose broth (LST)','UVM培養液','Trypticase-peptone-glucose-yeast extract broth (TPGY)'], ans:'B' },
  { id:'2015-058', year:2015, q:'包裝飲用水及盛裝飲用中需要檢驗的病原菌包括哪些？(1)綠膿桿菌、(2)病原性大腸桿菌、(3)志賀氏菌、(4)糞便性鏈球菌、(5)大腸桿菌群', opts:['(1)+(2)+(3)','(1)+(3)+(5)','(1)+(4)+(5)','(2)+(3)+(4)','(2)+(4)+(5)'], ans:'C' },
  { id:'2015-059', year:2015, q:'大陸藥典有關陰道微生態活菌製品進行成品安全性試驗的非特異性毒性檢查，下述何者錯誤？', opts:['以5隻雌鼠進行陰道置入，每天10 mg/次，連續3天','應根據製品的使用途徑和人用劑量確定試驗方法','自第1天測試起，連續觀察7天，小鼠應健康存活、體重增加','自第1天測試起，連續觀察7天，小鼠應陰道局部無紅腫以及無分泌物等症狀，判為合格','如小鼠測試不合格，可另選10隻雌兔復試1次，再進行判定'], ans:'E' },
  { id:'2015-060', year:2015, q:'進行食品中生菌數計算，1:1000稀釋度的兩個平板菌落數為225及255，而1:10000的兩個平板為21及40，請問要如何計算生菌數？', opts:['四片皆計數','僅計數225及40','需重新操作','大於250 CFU則不需計數，其餘需計數','小於25 CFU者不需計數，其餘需計數'], ans:'A' },
  { id:'2015-061', year:2015, q:'以下何項快速微生物檢測方法可以採用人工肉眼判讀，而不需藉由偵測或讀取設備？', opts:['酵素聯結免疫分析法(ELISA)','即時核酸放大法(real time PCR)','溶氧電極檢測法','自動生化反應鑑定法(biochemical reaction)','側流式免疫層析法(lateral flow immunochromatography)'], ans:'E' },
  { id:'2015-062', year:2015, q:'生物安全櫃或無菌操作台落菌試驗之允收標準？', opts:['15 CFU','10 CFU','5 CFU','0 CFU','30 CFU'], ans:'D' },
  { id:'2015-063', year:2015, q:'進行食品中生菌數計算，公告方法建議加入PCA時最好維持在適當溫度，因此水浴溫度應設定為？', opts:['37℃','43~45℃','45~46℃','52℃','60℃'], ans:'C' },
  { id:'2015-064', year:2015, q:'如下為食品/藥品微生物檢驗時微生物鑑定的替代方法，但何者除外？', opts:['根據產色素培養基的接種結果','使用快速鑑定套組，如API-20E','使用自動化鑑定系統，如Vitek II','根據染色抹片鏡檢、菌落形態及生化試驗與血清學試驗等表現型','使用MALDI-TOF-MS鑑定系統'], ans:'D' },
  { id:'2015-065', year:2015, q:'如下為食品微生物定性方法(如控制菌檢查)的確效基準(參數)，但何者除外？', opts:['專一性(Specificity)','偵測極限(Detection limit)','耐用性(Ruggedness)','耐變性(Robustness)','精密性(Precision)'], ans:'E' },
  { id:'2015-066', year:2015, q:'下列何者"非"TFDA在"實驗室品質管理規範－微生物領域測試結果之品質管制"一文中，對於微生物培養基驗證試驗的要求？', opts:['需使用陽性菌株','需使用實驗室環境自行篩選之菌株','確認培養基上菌落大小與數量','需比較前後兩批培養基','對數差異需落於精密度管制範圍中'], ans:'B' },
  { id:'2015-067', year:2015, q:'當方法參數有小的刻意變化時，檢驗結果不受影響的能力，可做為方法正常使用時的可靠性提供依據，上述為食品/藥品微生物定性方法確效參數中何者的定義？', opts:['專一性(Specificity)','偵測極限(Detection limit)','耐用性(Ruggedness)','耐變性(Robustness)','精密性(Precision)'], ans:'D' },
  { id:'2015-068', year:2015, q:'假設某菌從臨床檢體的分離率約10%，當檢驗室操作200個檢體，陽性/陰性結果分佈如下表(DNA探針陽性/培養陽性=18，陰性=2；DNA探針陰性/培養陽性=4，陰性=176)，請問此DNA探針系統的專一性為何？', opts:['90.0%','97.7%','81.1%','98.9%','97.0%'], ans:'B' },
  { id:'2015-069', year:2015, q:'依據FDA指引，若採用經過AOAC-OMA或AFNORA認證之快速微生物檢測方法，該實驗室採用前必須執行以下何種措施？', opts:['排它性與內因性','偵測極限(<30 CFU)','與其他實驗室比對','再現性','穩健性(耐變性)'], ans:'B' },
  { id:'2015-070', year:2015, q:'採用即用成品培養基(ready-to-use prepared media)具有如下優點，哪個除外？', opts:['縮短培養時間','與公告方法判讀方式相同','省去配製時間與人力','具備培養基品質文件','不需改變檢驗流程'], ans:'A' },
  { id:'2015-071', year:2015, q:'沙門氏桿菌可以造成食物中毒，某些檢體中僅需少量菌量即可致病，請問這種情況通常出現在什麼檢體身上？', opts:['雞蛋','雞肉','洋紅染料','巧克力','牛奶'], ans:'D' },
  { id:'2015-072', year:2015, q:'在操作RapID套組時皆需要調整適當的菌液濃度(McFarland)，且濃度不可以與說明書建議的McFarland標準差異太大，這是因為？', opts:['Buffer會因為菌數過多而凝固，導致測試結果不準確','Buffer中含有鹽類會與微生物交互作用，菌數過少會導致測試結果不準確','因為套組是利用細菌的生長與生化基質產生作用，如果菌液濃度不正確，生化基質無法正常的被分解','細菌濃度如果太高，接種菌液會太過混濁，而導致肉眼無法判讀；細菌濃度太低，則套組生化反應會不啟動','因為套組是利用細菌的酵素反應，所以每個套組需要特定數量的微生物才能產生正確的反應'], ans:'E' },
  { id:'2015-073', year:2015, q:'辨別檢驗報告可能為虛偽報告技巧可包括如下的敘述，何者最可能除外？', opts:['由檢驗人力推算檢驗總件數，在某段時間不可能完成','由該單位檢驗儀器的能量推算檢驗總件數在某段時間內不可能完成','不具備該檢驗項目的檢驗能力，但能配合身為委託者的您出具陰性/合格的報告','衛生主管單位抽檢不合格的食品，但送檢者卻宣稱委託某第三方檢驗室認證合格，而且一再發生','委託者對檢驗報告數據有疑異時，不會立即更改符合委託者所希望的報告'], ans:'E' },
  { id:'2015-074', year:2015, q:'將流式細胞技術應用於微生物計數，請問以下何項描述"非"關於流式細胞技術的特點與應用？', opts:['不需培養過程即可計數細胞數目','具有計數死細胞的能力','真核細胞的螢光強度通常較原核細胞高','初步分析胞內蛋白質的組成','微生物細胞尺寸與形狀會呈現不同的訊號反應'], ans:'D' },
  { id:'2015-075', year:2015, q:'辨別成品培養基品質測試的QC或COA報告是偽造的或不實的技巧可包括如下的敘述，何者最可能除外？', opts:['要求提供QC無菌落生長的實作相片，以便了解測試菌的相片是否隨批號、日期而有不同','詢問有無購買品管菌','詢問各個品管菌種的名稱，操作選擇性/區分性的陽性及陰性對照的接種菌量','COA的簽名字跡潦草，無法辨識何者簽名，或故意提供不相關的QC菌稀釋方法','電話詢問負責品保人員是否有實際操作品管'], ans:'C' },
  { id:'2015-076', year:2015, q:'仙人掌桿菌與蘇力菌在實驗室中最可能用什麼方法鑑別？', opts:['顯微鏡染色','Real Time PCR','Multiplex PCR','ELISA','無法區別'], ans:'A' },
  { id:'2015-077', year:2015, q:'食品微生物檢驗的工作環境必須合格，因此當操作落菌試驗時，工作環境的要求為何？', opts:['每1小時的落菌數不得超過15 CFU/培養皿','每4小時的落菌數不得超過5 CFU/培養皿','每15分鐘的落菌數不得超過15 CFU/培養皿','每4小時的落菌數不得超過50 CFU/培養皿','每24小時的落菌數不得超過10 CFU/培養皿'], ans:'C' },
  { id:'2015-078', year:2015, q:'食品中諾羅病毒的分子檢驗流程裡，最為困難的步驟為何？', opts:['檢體採樣前處理','將病毒反轉錄為cDNA','使用cDNA做模板進行PCR放大','進行第二次PCR(nest PCR)','利用電泳膠圖分離PCR片段進行觀察及判斷'], ans:'A' },
  { id:'2015-079', year:2015, q:'某五人吃了午餐後隔日發生上吐下瀉食品中毒，判讀中毒原因的依據可包括如下，但何者除外？', opts:['潛伏期','病徵','可能發生的地點','午餐食品運送的交通工具種類','可能的導致因素，如生物性或化學性'], ans:'D' },
  { id:'2015-080', year:2015, q:'台灣尚未曾發現的食品中毒病原菌可包括如下，但何者除外？', opts:['耶爾辛氏菌','彎曲桿菌','產氣莢膜梭菌','病原性大腸桿菌','氣單胞菌'], ans:'D' },
  { id:'2015-081', year:2015, q:'食品中毒病原菌需要接種厭氧蛋黃培養基(AEYA)以便觀察菌落是否呈現珍珠光澤的細菌為何？', opts:['仙人掌桿菌','產氣莢膜梭菌','肉毒桿菌','李斯特菌','彎曲桿菌'], ans:'B' },
  { id:'2015-082', year:2015, q:'台灣食品藥物管理署公告的食品乳酸菌檢驗(計數)建議的檢體量為何？', opts:['3 g/mL','900 g/mL','450 g/mL','50 g/mL','10 g/mL'], ans:'D' },
  { id:'2015-083', year:2015, q:'食品中曲狀桿菌(Campylobacter spp.)的檢驗，如下敘述中，何者錯誤？', opts:['此菌是微好氧菌，需培養在5%O2、10%CO2及85%N2的環境中','增菌培養基稱為曲狀桿菌增菌培養液，含有cefoperazone、trimethoprim lactate、vancomycin及cycloheximide','分離培養基為Abeyta-Hunt-Bark agar(A-H-B agar)及Modified Campylobacter blood-free agar (mCCDA)','欲分離C. fetus時，將分離培養基培養的環境為42℃微好氧培養24-48小時','欲分離C. jejuni時，將分離培養基培養的環境為42℃微好氧培養24-48小時'], ans:'D' },
  { id:'2015-084', year:2015, q:'微生物定量替代方法的檢驗結果與藥典/食品公告方法檢驗結果相近(closeness)的程度，其確認應該在檢測的範圍內，通常用微生物的回收率(%)來表示，上述為食品微生物定量方法確效參數中何者的定義？', opts:['專一性(Specificity)','偵測極限(Detection limit)','耐用性(Ruggedness)','耐變性(Robustness)','準確性(Accuracy)'], ans:'E' },
  { id:'2015-085', year:2015, q:'選擇市售生化鑑定套組鑑定未知微生物之前，需操作一些簡單的生化試驗，以下敘述何者為非？', opts:['氧化酶(Oxidase)試驗可區分腸內菌和革蘭氏非發酵菌(GNF)','所有未知菌的鑑定，都需要操作革蘭氏染色','當革蘭氏染色結果為革蘭氏陰性球菌(GNC)，需操作觸媒(Catalase)試驗，以區分其為葡萄球菌屬或是鏈球菌屬','操作氧化酶(Oxidase)試驗，細菌若變為藍色，則為陽性反應，此細菌可能為革蘭氏非發酵菌(GNF)菌屬','當革蘭氏染色結果為革蘭氏陽性桿菌(GPB)，可依據顯微鏡下觀察到是否有芽孢產生來選擇桿菌屬鑑定套組'], ans:'C' },
  { id:'2015-086', year:2015, q:'在葡萄球菌的鑑定上，為了縮短鑑定時間，可以使用市售Staph Latex套組，關於此類的套組使用上以下何者為非？', opts:['Staph Latex套組可以縮短鑑定時間，可取代鑑定葡萄球菌需操作的Coagulase試驗','傳統操作Coagulase試驗花費許多時間，使用Staph Latex套組可使操作時間縮短很多','使用Staph Latex套組測試金黃色葡萄球菌、表皮葡萄球菌及腐生葡萄球菌皆為陽性反應','金黃色葡萄球菌使用Staph Latex鑑定若為陽性，會產生藍色顆粒狀凝集','使用此套組的操作方法為滴加一滴Staph Latex試劑於紙卡上，沾菌加入混合均勻，順時針搖動紙卡60秒即可判讀結果'], ans:'C' },
  { id:'2015-087', year:2015, q:'食品中霍亂弧菌(Vibrio cholerae)的檢驗，如下敘述中，何者錯誤？', opts:['此菌非為嗜鹽菌，不需使用含有2~3%氯化鈉的營養培養就能生長','增菌培養基稱為鹼性蛋白腖水(APW)，pH值調至8.5±0.2','分離培養基為TCBS培養基','霍亂弧菌(Vibrio cholerae)在TCBS培養基生長菌落通常較小，呈綠色','細菌本體抗血清集試驗操作包括使用O1型及O139型抗血清'], ans:'D' },
  { id:'2015-088', year:2015, q:'食品中金黃色葡萄球菌(Staphylococcus aureus)的檢驗，預期檢體中只含有低菌量時，進行三階三支接種何種培養基？', opts:['LST broth','Staphylococcus broth','含有10%氯化鈉及1% sodium pyruvate之TSB broth','鹼性蛋白腖水(APW)，pH值調至8.5±0.2','Baird-Parker Broth'], ans:'C' },
  { id:'2015-089', year:2015, q:'食品中腸炎弧菌(Vibrio parahaemolyticus)的檢驗，如下敘述中，何者錯誤？', opts:['此菌是嗜鹽菌，需培養在含有2~3%氯化鈉的培養中，才能生長','增菌培養基稱為鹼性蛋白腖水(APW)，pH值調至8.5±0.2','分離培養基為TCBS培養基','神奈川(Kanagawa)現象陽性反應與細菌所產生的耐熱相關溶血素(TRH)有關','當操作腸炎弧菌對O/129紙錠敏感性試驗時，將對10 μg紙錠呈抵抗性，而對150 μg紙錠呈敏感性'], ans:'D' },
  { id:'2015-090', year:2015, q:'食品中腸炎耶辛尼氏菌(Yersinia enterocolitica)的檢驗，如下敘述中，何者錯誤？', opts:['使用PSBB或ITC broth進行增菌','使用PSBB調製檢液時在10℃增菌10天，而使用ITC broth則在室溫增菌培養2天','分離培養基包括馬康奇及CIN培養基','分離培養基的培養溫度為42℃的微需氧性環境','此菌在22~26℃呈運動性，而在36~37℃無運動性'], ans:'D' },
  { id:'2015-091', year:2015, q:'公告方法食品中氣單胞菌(Aeromonas spp.)的檢驗，建議分離培養基為何？', opts:['馬康奇及CIN培養基','澱粉酚紅安匹西林培養基(Starch phenol red ampicillin agar, SPA)','Abeyta-Hunt-Bark agar(A-H-B agar)','Modified Campylobacter blood-free agar (mCCDA)','TCBS培養基'], ans:'B' },
  { id:'2015-092', year:2015, q:'對於Real-time PCR反應的敘述，何者有誤？', opts:['是將標的序列於短時間內迅速倍增，以提高靈敏度與檢出率的反應','倍增的理論值為每個循環增加2倍','又被簡稱為RT-PCR','當日所操作的Thermo SureTect kit使用TaqMan原理同時偵測二種不同螢光','需要設計引子及探針'], ans:'C' },
  { id:'2015-093', year:2015, q:'公告方法食品中阪崎腸桿菌(Cronobacter)的檢驗，如下敘述中，何者錯誤？', opts:['奶粉檢體加至預熱至45℃已滅菌鹼性蛋白腖水(APW)','選擇性增菌培養使用腸內細菌科增菌培養液(EE broth)','分離培養基包括Enterobacter sakazakii agar (ESA)及Violet red bile glucose agar (VRBG)','接種TSA平板培養基，培養在25℃，48~72小時，Cronobacter sakazakii菌落將產生黃色色素','取不同克數(100, 10及1 g)的奶粉檢體進行10倍稀釋後，將可進一步操作最確數法(MPN)'], ans:'A' },
  { id:'2015-094', year:2015, q:'微生物定量方法在經歷一段時間之間，於相同實驗室之內，以相同的設備，由相同的分析者操作，而得到相同的結果，上述為食品微生物定量方法確效參數中何者的定義？', opts:['重複性(Repeatability)','再現性(Reproducibility)','耐用性(Ruggedness)','耐變性(Robustness)','準確性(Accuracy)'], ans:'A' },
  { id:'2015-095', year:2015, q:'公告方法食品中志賀氏菌(Shigella)的檢驗，如下敘述中，何者錯誤？', opts:['檢體的增菌液含有novobiocin的志賀氏桿菌培養液(Shigella broth)','因為此菌為絕對厭氧菌，所以必須將志賀氏桿菌培養液(Shigella broth)放在無菌環境中','分離培養基包括馬康奇、XLD及HE平板培養基','若分離疑似志賀氏需要操作血清學試驗進行鑑定','此菌屬主要有四個菌種，菌屬的鑑定試驗包括TSIA等生化試驗'], ans:'B' },

  { id:'2018-024', year:2018, q:'一旦從食品檢出某菌，生化反應疑似霍亂弧菌則進行血清學試驗，一般使用何種細菌本體抗原抗血清型進行試驗？', opts:['O3型及O138型','O1型及O9型','O9型及O3型','O2型及O138型','O1型及O139型'], ans:'E' },
  { id:'2018-025', year:2018, q:'曲狀桿菌(彎曲菌)與弧菌的特性相同之處為何？', opts:['兩者剛分離時均為彎曲菌，移種後為桿菌','均為氧化酶陽性','均為嗜氧菌','均對O/129敏感性試驗的10及150μg呈抵抗性','藥敏型式均相同'], ans:'B' },
  { id:'2018-026', year:2018, q:'如下有關曲狀桿菌（彎曲菌）檢驗的敘述何者錯誤？', opts:['使用的增菌培養液常用者為Bolton配方的曲狀桿菌增菌培養液','Bolton配方的曲狀桿菌增菌培養液含有的抗生素包括Sodium cefoperazone(頭孢匹拉腙鈉)','分離的培養基最好含有多粘桿菌素B(polymyxin B)，以便抑制污染菌而促進彎曲菌生長','mCCDA可用於分離曲狀桿菌','分離的培養基可包括Abeyta-Hunt-Bark agar(A-H-B agar)'], ans:'C' },
  { id:'2018-027', year:2018, q:'臺灣從未報導曲狀桿菌（彎曲菌）引起的食品中毒最大的原因，與如下有關，但何者最可能除外？', opts:['食品藥物管理署不常發現此菌所引起的中毒事件而沒有特別要求委託的第三方檢驗室偵測','檢驗室沒有微氧培養環境的設備，因為太貴了','檢驗人員沒有培訓的經驗','食品中毒案件調查時沒有考慮到彎曲菌是病原','公告方法建議的增菌培養基配方錯誤而分離不出此菌'], ans:'E' },
  { id:'2018-028', year:2018, q:'辨認購買的成品培養基的COA(品管報告)是偽造的(沒有測試但卻有報告)最好的方法是要求廠家提供何物或做何動作？', opts:['完善的品管菌稀釋流程報告','提供該批號的品管相片','提供的COA報告有如外商，並且簽名有如外國人姓名的特徵','打電話去詢問客服或品管人員','要求業務人員解釋COA的內容'], ans:'B' },
  { id:'2018-029', year:2018, q:'金黃色葡萄球菌最確數（MPN）法中有關操作技術的敘述，何者錯誤？', opts:['操作時機為預期含有低菌量時','稀釋液移種的三階三支培養基含有6.5% NaCl','若發現三階三支使用的培養基有渾濁，培養液移種的培養基為血平板','三階三支使用的培養基含有丙酮酸鈉的原因為讓損傷菌復甦','此菌為觸酶及凝固酶陽性'], ans:'B' },
  { id:'2018-030', year:2018, q:'Baird-Parker medium, BP含有甘氨酸、丙酮酸鈉、氯化鋰及基本成份以外，必須添加何物才能成為完全培養基（complete medium）？', opts:['去纖維綿羊血','蛋黃亞碲酸鹽培養液(egg yolk tellurite enrichment, EYT)','抗生素Sodium cefoperazone(頭孢匹拉腙鈉)','溶血加強液','Phenol red指示劑'], ans:'B' },
  { id:'2018-031', year:2018, q:'如下有關食品中李斯特菌檢驗的如下敘述，何者錯誤？', opts:['利用Buffered listeria enrichment broth(BLEB)培養液進行第一次增菌培養','利用費氏培養液作為第二次增菌培養','移種的分離培養基為MOX及顯色瓊脂培養基','移種MOX的方式為三區畫線法','利用CAMP試驗鑑定單核球增多性李斯特菌'], ans:'A' },
  { id:'2018-032', year:2018, q:'如下有關食品中李斯特菌檢驗的敘述何者錯誤？', opts:['鑑定時需要操作傘狀運動試驗','運動性試驗的培養基最好使用半固體的TSA試管','純化的TSA培養基必須含有酵母抽出物(yeast extract)','可利用懸滴鏡檢法操作運動性試驗','在分離培養基生長的第一天菌落非常小'], ans:'B' },
  { id:'2018-033', year:2018, q:'鑑定單核球增多性李斯特菌的CAMP試驗，下列敘述何者是正確的？(1)使用的測試品管菌為Rhodococcus equi及S. aureus (2)使用的測試品管菌為馬紅酵母菌(Rhodotolula equi)及S. aureus (3)少數菌株的陽性結果在R. equi以及所有菌株在S. aureus接種處的附近均有加強溶血現象 (4)在R. equi附近無溶血，而在S. aureus附近有加強溶血現象 (5)在R. equi附近有加強溶血，而在S. aureus附近無溶血現象', opts:['1+2+3','2+3+4','1+3+4','3+4+5','1+3+5'], ans:'C' },
  { id:'2018-034', year:2018, q:'仙人掌桿菌(蠟樣芽孢桿菌)為產芽孢菌，進行芽孢染色時，染色步驟為製好抹片並乾燥後', opts:['先加結晶紫染液(crystal violet)加熱並冒煙2-3分鐘，再以番紅(safranin)複染30秒','先加孔雀綠染液(malachite green)加熱並冒煙2-3分鐘，再以番紅(safranin)複染30秒','先加結晶紫染液(crystal violet)加熱並冒煙2-3分鐘，再以酒精脫色15-30秒，然後以番紅(safranin)複染30秒','先加石碳酸複紅染液(carbofuchsin)加熱並冒煙2-3分鐘，再以番紅(safranin)複染30秒','先加瑞氏染液(Wright stain)加熱並冒煙2-3分鐘，再以孔雀綠染液(malachite green)複染30秒'], ans:'B' },
  { id:'2018-035', year:2018, q:'以平板計數法分離仙人掌桿菌使用MYP培養基，其代表何物？', opts:['Mannitol-Yeast extract-Polymyxin B','Mannose-Yeast extract-Peptone','Mannitol-Egg yolk-Peptone','Mannitol-Egg yolk-Polymyxin B','Motility-Egg yolk-Proteose'], ans:'D' },

  { id:'2018-060', year:2018, q:'有關於食品微生物檢驗標準方法(standard method)的敘述何者錯誤？', opts:['對於食品微生物檢驗而言，典型的參考方法是分子生物檢驗法','標準方法包括參考方法(reference method)和公定方法(regulatory methods)','指由國際、區域、國家發佈的經過嚴格確認的、公認的方法','公定方法是指由知名的技術組織或機構(如ISO)發佈的檢測方法','參考方法是指適用於特殊待驗目標的經過國際或國家公認的檢驗方法'], ans:'A' },

  { id:'2018-083', year:2018, q:'在操作RapID套組時皆需要調整菌液濃度(McFarland)，且濃度不可以與McFarland差異太大，這是因為？', opts:['Buffer會因為菌數過多而凝固，導致測試結果不準確','Buffer中含有鹽類會與微生物交互作用，菌數過少會導致測試結果不準確','因為套組是利用細菌的酵素反應，所以每個套組需要特定數量的微生物才能產生正確的反應','因為套組需要培養4小時，如果接種菌量過低或過高，培養後細菌無法達到特定的數量，部份需要特定數量微生物才能反應的生化測試孔會出現錯誤的顏色'], ans:'C' },

  { id:'2021-077', year:2021, q:'如腸桿菌科檢驗陰性，是否不用再進行沙門氏菌或其他腸內菌(如耶氏菌)之檢驗？(請選擇最適當之原因)', opts:['是，因為沙門氏菌為腸桿菌科微生物，為節省檢驗時程，可合併檢驗','是，因腸桿菌科為定量項目，沙門氏菌為定性項目，進行腸桿菌科等定量之檢驗結果若為未檢出，則不可能透過沙門氏菌增菌步驟，使其變為陽性','否，為確認食品是否有符合衛生標準之規定，故標準所訂項目均仍應加以檢驗','否，因為沙門氏菌非腸桿菌科','否，因為沙門氏菌屬於大腸桿菌群成員之一'], ans:'C' },

  { id:'2023-77', year:2023, q:'針對於食品中沙門氏菌的檢驗，以下何種檢測方法的敘述是正確的，才能符合當前國內政府規範或是國際標準(ex.AFNOR, AOAC)？', opts:['可以"不經過"前增殖(pre-enrichment)而直接操作核酸擴增法(NAT)','可以"不經過"前增殖，而直接操作側流式免疫層析法(lateral flow immunochromatography)','可以"不經過"前增殖而直接接種顯色培養基(chromogenic medium)','可以"不經過"前增殖而直接進行MALDI TOF質譜儀鑑定','任何食品微生物檢驗方法經過增菌才能進行進一步的檢驗操作流程'], ans:'E' },
  { id:'2023-78', year:2023, q:'以濾膜法測定樣品時，使用之濾杯刻度合格應在多少誤差範圍內？', opts:['± 1%','±2.5%','±5%','±10%','±50%'], ans:'B' },

  { id:'2023-80', year:2023, q:'低溫儲存樣品、培養基及標準菌株分別在何種溫度的冰箱保存？', opts:['平均放在同一個2-8℃冰箱中','平均放在二個2-8℃冰箱中','各自放在一個2-8℃冰箱中，而標準菌株可保存在一般冰櫃上層的冷凍層','低溫儲存樣品與培養基可放在2-8℃冰箱，而標準菌株可保存在-50℃以下的冰櫃','低溫儲存樣品與培養基可放在2-8℃冰箱，而標準菌株可保存在-20℃至-50℃的冰櫃'], ans:'D' },

  { id:'2023-82', year:2023, q:'健康食品功效評估常使用動物，常操作的一般動物實驗之分組包括如下，但下列何者錯誤？', opts:['陰性控制組','陽性控制組','3種不同劑量組','試驗組','5種或更多不同劑量組'], ans:'E' },
  { id:'2023-83', year:2023, q:'如果遇到亞培公司的安素事件，無法判斷產品酸敗的原因是否為微生物因素，最好的解決方案為何？', opts:['進行生菌數的一般檢驗，培養在室溫與35℃的環境','進行檢體的直接革蘭氏染色','進行指標菌檢驗培養在35℃的環境','進行滋養性增菌後培養在30℃與35℃的環境','進行特別的冷增菌方法後培養在特殊的培養基及厭氧環境培養在35℃的環境'], ans:'B' },
  { id:'2023-84', year:2023, q:'現行可用核酸進行分子生物檢測之項目不包含下列何者？', opts:['志賀氏桿菌','A肝病毒','腸毒素','毒性基因','諾羅病毒'], ans:'C' },
  { id:'2023-85', year:2023, q:'食品衛生標準中的其他即時調製、未經殺菌處理，且架售期少於24小時之飲料應檢測菌微生物限量為何？', opts:['沙門氏菌-陰性、腸桿菌科-100 CFU/mL','沙門氏菌-陰性、腸桿菌科-10 CFU/mL','腸桿菌科-100 CFU/mL','腸桿菌科-陰性','大腸桿菌群-10 CFU/mL'], ans:'B' },
  { id:'2023-86', year:2023, q:'下列哪種元素為非細菌培養基的基礎成份？', opts:['水','氮源或碳源','選擇性添加劑或抗生素','鹽類','微量元素'], ans:'C' },
  { id:'2023-87', year:2023, q:'針對細菌培養基的品管控管，下列何者的敘述是錯誤的？', opts:['品保部門需要定期進行內部稽核，以確認品質系統的維持性','可以在GMP/QMS的文件內容中，找到針對含血培養基的品管標準','倉儲部門需要將儲存區域做好劃分及標示，避免取貨出現異常','品質控管是一系列降低風險及執行確效的手段，目的是為了維持產品品質','以上皆正確'], ans:'B' },

  { id:'2024-01', year:2024, q:'培養基配製後進行高壓蒸氣滅菌常用的生物指示劑(Biological indicator)及含菌量為何？', opts:['5.0x10⁵~5.0x10⁶ CFU/片的 Geobacillus stearothermophilus','5.0x10⁶~5.0x10⁷ CFU/片的 Geobacillus stearothermophilus','5.0x10⁵~5.0x10⁶ CFU/片的 Bacillus subtilis','5.0x10⁶~5.0x10⁷ CFU/片的 Bacillus subtilis','5.0x10⁶~5.0x10⁷ CFU/片的 Bacillus sphaericus'], ans:'A' },
  { id:'2024-02', year:2024, q:'高壓蒸氣滅菌時物品的裝載原則如下，但何種組合中包含有錯誤的操作？①儘量將同類物品放在一起滅菌。②物品裝放時上下左右相互間均應間隔一定距離。③大包放在上層，較易滅菌的小包放在下層。④金屬物品放下層，織物包放上層。⑤物品裝放最好貼靠門和四壁以增加滅菌效能。⑥金屬包應平放，盤、碟、碗等應處於豎立的位置。⑦纖維織物應使折疊的方向與水平面成垂直狀態。⑧玻璃瓶等應開口向下或側放以利蒸氣進入和空氣排出。', opts:['1, 2, 3','4, 5, 6','2, 3, 4','6, 7, 8','3, 7, 8'], ans:'B' },
  { id:'2024-03', year:2024, q:'唐菖蒲伯克氏菌（Burkholderia gladioli）最佳的產毒素溫度為多少°C？', opts:['37°C','37°C','26°C','20°C','18°C'], ans:'C' },
  { id:'2024-04', year:2024, q:'公告的腸桿菌科菌種檢驗所使用的培養基包括哪2種？', opts:['VRBGA 及 O/F glucose','VRBG Agar 及 glucose agar w/BCP','VRBA 及 O/F glucose','VRBLA 及乳糖瓊脂','VRBGA 及 O/F sucrose'], ans:'A' },
  { id:'2024-05', year:2024, q:'如腸桿菌科檢驗陰性，是否不用再進行沙門氏菌或其他腸內菌之檢驗？（請選擇最適當之原因）', opts:['是，因為沙門氏菌為腸桿菌科微生物，為節省檢驗時程，可合併檢驗','是，因腸桿菌科為定量項目，沙門氏菌為定性項目，進行腸桿菌科等定量之檢驗結果若為未檢出，則不可能透過沙門氏菌增菌步驟，使其變為陽性','否，為確認食品是否有符合衛生標準之規定，故標準所訂可能的病原菌項目均仍應加以檢驗','否，因為沙門氏菌非腸桿菌科','否，因為沙門氏菌屬於大腸桿菌群成員之一'], ans:'C' },
  { id:'2024-06', year:2024, q:'如下病原菌的分離率為美國的10倍，雖然常從臨床檢體分離但臺灣食品中毒的案例從來沒有被重視過的是何種病原菌？', opts:['腸炎弧菌','仙人掌桿菌','產氣莢膜梭菌','氣單胞菌','李斯特菌'], ans:'D' },
  { id:'2024-07', year:2024, q:'衛福部公告生菌數檢驗結果之計數所謂四捨六入，當得到225及235需要分別以何種菌落數平均值表示？', opts:['230 及 240','220 及 240','220 及 230','200 及 250','230 及 230'], ans:'B' },
  { id:'2024-08', year:2024, q:'全蛋檢測方案（乾燥及冷凍全蛋，三級法，大腸菌群，n=5, c=2, m=10, M=10³），何種檢驗結果為合格？(1) 5個檢體菌數分別為0、1、2、68及123；(2)其中1個檢體菌數大於2.2x10³；(3) 5檢體菌數為5、7、9、117及249；(4) 5檢體菌數為0、0、10、17、36。', opts:['1 及 3','2 及 3','3 及 4','1 及 4','2 及 4'], ans:'A' },
  { id:'2024-09', year:2024, q:'將25 g乳品檢體接種225 mL李斯特菌的增菌培養基（BLEB），需要加入適當量的何種化學物品以便讓可能存在的李斯特菌復甦？', opts:['glycerol','sodium pyruvate','peptone','calcium','casein'], ans:'B' },
  { id:'2024-10', year:2024, q:'美國FDA建議化妝品微生物檢驗步驟中需要檢驗各種病原菌，除了以MLB進行系列稀釋檢體外，需要接種包括如下的各種培養基，但何者除外？', opts:['MLA 嗜氧培養','MLA 厭氧培養','Baird-Parker agar','PDA w/chlortetracycline','EMB agar/VRBGA agar'], ans:'E' },
  { id:'2024-11', year:2024, q:'有關食品微生物的定量試驗，如下的敘述何者正確？', opts:['需要先進行滋養性增菌才能進行測試','需要先進行選擇性增菌才能進行測試','需要先進行區分性增菌才能進行測試','食品媒介金黃色葡萄球菌的檢測不必進行定量試驗','食品的生菌數與黴菌酵母菌計數需要進行定量試驗'], ans:'E' },
  { id:'2024-12', year:2024, q:'食品安全的維護及促進的共有三波演進，包括？(1)良好農業規劃(GAP)；(2)良好製造規範(GMP)；(3)良好衛生規範(GHP)；(4)風險分析(risk analysis)；(5)良好實驗室規範(GLP)；(6)危害分析及重要管制點(HACCP)；(7)良好溝通規範(GCP)', opts:['1、3、5','2、4、6','3、4、6','1、4、7','3、4、7'], ans:'C' },
  { id:'2024-13', year:2024, q:'豬的萊克多巴胺危害風險評估與豬的沙門氏菌媒介的危害評估主要不同處在於前者的特性包括如下，但何者除外？', opts:['在豬肉內濃度的分布通常較為均勻','濃度會隨著時間發生改變','危害通常由累積效應所造成','其可被控制至人類最少的暴露殘留量','傳播方式包括直接攝取，但通常不包括二次傳播而散佈'], ans:'B' },
  { id:'2024-14', year:2024, q:'彎曲菌檢驗時，將食品檢體以何種配方的彎曲菌增菌肉湯增菌後，再移種平板培養基mCCDA？', opts:['Skirrow','Bolton','Hunt','Boston','Swallow'], ans:'B' },
  { id:'2024-15', year:2024, q:'檢測食品中腸桿菌科或大腸桿菌群的Petrifilm最大的缺點為？', opts:['沒有經過認證','標的菌的菌落顏色不易觀察','較不能檢出低菌量的標的菌','儲存空間太大','能檢出高菌量的衛生指標菌'], ans:'C' },
  { id:'2024-16', year:2024, q:'如下真菌菌屬中的一些菌種除了Aspergillus及Penicillium外，可產生黴菌毒素的菌屬，最可能包括如下：(1)Trichoderma；(2)Cephalosporium；(3)Alternaria；(4)Monascus；(5)Fusarium', opts:['1,3,5','2,4,5','2,3,5','1,2,3,4,5','1,2,5'], ans:'D' },
  { id:'2024-17', year:2024, q:'進行產氣莢膜桿菌之檢驗時若接種tryptose-sulfite-cycloserine agar w/egg Yolk（EY），生長的菌落將呈現何種菌落特徵？', opts:['帶有白色環帶的黑色菌落','帶有彩虹螢光的黃色菌落','帶有黑色環帶的白色菌落','帶有彩虹樣環帶的黑色菌落','帶有黑色環帶的黑色菌落'], ans:'A' },
  { id:'2024-18', year:2024, q:'進行食品生菌數檢驗時，若遇到「擴散落」當形成鏈狀如下敘述何者為非？', opts:['若僅一條則應視為個菌落','若有兩條以上存在時應視其鍊源處之不同，分別計數','擴散菌落所覆蓋面超過整個平板面積1/2時，應不予計數','被擴散菌落造成之抑制生長範圍超過1/4時，應予計數','若鍊狀菌擴散菌落彼此分開而形成大時，應予計數'], ans:'D' },
  { id:'2024-19', year:2024, q:'酸土脂環酸芽孢桿菌（Alicyclobacillus acidoterrestris）污染的飲料會產生異味（藥味、火腿味）或臭味係因為此菌增殖時可產生何種物質？', opts:['甲醛','酚物質','酒精及醋酸','CO₂及蟻酸','胺基酸分解酵素'], ans:'B' },
  { id:'2024-20', year:2024, q:'操作金黃色葡萄球菌乳膠凝集試驗Staph Latex時，以下操作與反應何者正確？', opts:['試劑滴到待測菌落後，立即產生大量氣泡為陽性反應','棉棒沾待測菌落再滴上試劑後，1分鐘內可觀察到藍紫色為陽性反應','將待測菌落加入試劑混勻後，旋轉卡片1分鐘內見到大塊凝集為陽性反應','將待測菌株加入試劑，立刻在顯微鏡下觀察到菌體內的孢子為陽性反應','利用濾紙接種少數菌落，加上試劑後10秒內觀察，若有大塊凝集，則為陽性反應'], ans:'C' },
  { id:'2024-21', year:2024, q:'衛福部公告的食品微生物檢驗之抽樣類型均採檢5個檢體(n=5)，但根據ICMSF對可能含極嚴重危害(severe hazard)病原的食品中如未加熱就進食或至吃前仍存放一段時間，建議的類型(cases) 15所採檢的檢體數高達多少件才具有代表性？', opts:['90件','120件','15件','30件','60件'], ans:'E' },
  { id:'2024-22', year:2024, q:'食品中毒病原菌之檢驗需使用選擇性增菌培養基，但要注意如下，其中何者為非？', opts:['增菌液加入抗生素通常比加入其他抑制劑更容易達到效果','增菌時間不能太短，因為還沒有讓標的菌生長','增菌時間不能太長，因為非標的菌會適應環境而生長過多','需配合其它條件如42℃或厭氧環境更能達到標的菌的增菌效果','需注意增菌液pH值的維持，如增加，則抑制劑的抑菌效果減弱'], ans:'A' },
  { id:'2024-23', year:2024, q:'衛福部TFDA所公告之「實驗室品質管理規範－微生物領域測試結果之品質管制(107.06.03)」中，下列何者「非」該文對於培養基驗證試驗的描述？', opts:['確認培養基上菌落大小與數量','新配製培養基應符合精密度管制範圍為3.27x對數平均差異值','不得使用具感染性的RG 2級病原菌作為對照菌株','需使用陽性菌株','培養基驗證試驗需比較前後兩批培養基的生長效能'], ans:'C' },
  { id:'2024-24', year:2024, q:'衛福部公告的食品沙門氏菌之檢驗為何需要使用兩種選擇性增菌液（RV及TT broth）以及兩種平板培養基的原因，如下何者最可能為非？', opts:['不同增菌液或平板的抑制劑對不同沙門氏菌影響各異','一種增菌或平板的選擇劑不能抑制某種競爭優勢菌，但另一種也許能夠抑制','常用的平板培養基如HE或XLD以及Bismuth sulfite(BS)具有不同的抑制性，前兩者為中等選擇性，而BS為高選擇性','使用單一增菌液或平板會出現漏檢現象','主要原因為兩種肉湯或平板較容易讓受傷細胞復甦'], ans:'E' },
  { id:'2024-25', year:2024, q:'食品沙門氏菌之檢驗進行多價本體（O）血清學試驗，如下之敘述何者最為正確？', opts:['從尿素酶陽性的菌株挑取菌落操作','挑取XLD生長菌落操作','挑取斜面紅色、但基底黃色(或黑色)的TSIA斜面上菌落操作','挑取顯色培養基上疑似菌落操作','需要將疑似菌落移種BHI培養液或TSB培養液，生長後才能操作'], ans:'C' },
  { id:'2024-26', year:2024, q:'去除食品中唐菖蒲伯克氏菌（Burkholderia gladioli）邦克列酸毒素的實用方法中何者正確？', opts:['水洗，煮沸去湯，再水洗，加蒜涼拌','乾銀耳日曬5-7天','將食品煮沸100℃，30分鐘','以5%次氯酸鈉(sodium hypochlorite)處理食品','以紫外線燈照射60分鐘'], ans:'A' },
  { id:'2024-27', year:2024, q:'將食品存放在冰箱(2-8℃)，如下何種食品媒介中毒菌最可能會生長導致食品中毒？(1)阪崎腸桿菌；(2)金黃色葡萄球菌；(3)單核球增多性李斯特菌；(4)氣單胞菌；(5)小腸結腸炎耶氏菌；(6)沙門氏菌', opts:['1+2','3+4','5+6','3+5','2+6'], ans:'D' },
  { id:'2024-28', year:2024, q:'在10⁻¹~10⁻⁵五個連續稀釋度中確定最適的三個連續稀釋度：假設接種樣品量0.1 g的陽性管數為2，0.01 g為2，0.001 g為1，0.0001 g為1，0.00001 g為0，則MPN計算陽性結果，應該選擇何種接種樣品量查閱MPN表？', opts:['2-2-1','2-2-2','2-1-1','1-1-0','2-3-1'], ans:'B' },
  { id:'2024-29', year:2024, q:'鑑定單核球增多性李斯特菌的CAMP試驗，下列敘述何者是正確的？(1)使用的測試品管菌為Rhodococcus equi及S. aureus；(2)使用的測試品管菌為馬紅酵母菌及S. aureus；(3)少數菌株的陽性結果在R. equi以及所有菌株在S. aureus接種處的附近均有加強溶血現象；(4)通常在R. equi附近無溶血，而在S. aureus附近有加強溶血現象；(5)在R. equi附近有加強溶血，而在S. aureus附近無溶血現象', opts:['1+2+3','2+3+4','1+3+4','3+4+5','1+3+5'], ans:'C' },
  { id:'2024-30', year:2024, q:'化妝品中不可檢出白色念珠菌，當鑑定時，需要將疑似酵母菌接種至含1%聚山梨醇酯80之玉米粉瓊脂培養基培養試驗，其目的為觀察酵母菌的那些構造？(a)發芽管的產生；(b)大分生孢子的產生；(c)菌絲及假菌絲的產生；(d)厚膜孢子的產生；(e)孢子囊的孢子的產生', opts:['a、b','b、c','c、d','c、e','d、e'], ans:'C' },
  { id:'2024-31', year:2024, q:'仙人掌桿菌及金黃色葡萄球菌檢驗之平板計數法，公告方法建議分別選取生長菌落數的範圍多少進行計數最為理想？(1)25-250；(2)30-300；(3)8-80；(4)15-150；(5)20-200；(6)10-150', opts:['1，5','2，3','3，4','4，5','5，6'], ans:'D' },
  { id:'2024-32', year:2024, q:'一旦從食品檢出某菌，生化反應疑似霍亂弧菌則進行血清學試驗，一般使用何種細菌本體抗原抗血清型進行試驗？', opts:['O3型及O138型','O1型及O9型','O9型及O3型','O2型及O138型','O1型及O139型'], ans:'E' },
  { id:'2024-33', year:2024, q:'臺灣從未報導曲狀桿菌（彎曲菌）引起的食品中毒最大的原因，與如下有關，但何者最可能除外？', opts:['食品藥物管理署不常發現此菌所引起的中毒事件而沒有特別要求衛生局檢驗室偵測','檢驗室常沒有微氧培養環境的設備','檢驗人員沒有培訓的經驗','食品中毒案件調查時沒有考慮到彎曲菌是病原','公告方法建議的增菌培養基配方錯誤而分離不出此菌'], ans:'E' },
  { id:'2024-34', year:2024, q:'計算大腸桿菌衛生指標菌總和時需操作分離的類似菌鑑定試驗，其與病原性大腸桿菌檢驗之確定試驗不同之處，如下以何者最正確？', opts:['前者需要操作I, M, Vi, C生化試驗，而後者需要操作初步生化試驗和第二步生化試驗及血清學試驗','前者要操作PCR分生試驗，後者需要操作體抗原血清學試驗','前者僅需操作氧化酶試驗，而後者要操作動物試驗','前者要操作RPLA反被動乳膠凝集試驗，後者要操作O157:H7血清學試驗','前者不需操作病原性試驗，後者要操作病原性試驗'], ans:'A' },
  { id:'2024-35', year:2024, q:'如下有關氣單胞菌的敘述何者錯誤？', opts:['氧化酶陰性菌','革蘭氏陰性桿菌','TSI顯現葡萄糖發酵性及/或蔗糖發酵性','分離的培養基稱為澱粉酚紅安匹西林培養基(SPA)','可利用O/129敏感性試驗的10及150 μg與弧菌區分'], ans:'A' },
  { id:'2024-36', year:2024, q:'假設某稀釋倍數的MRS培養基長出248個CFU菌落，TOS-MUP長出48個菌落，Enterococcus agar長出138個菌落，請問乳桿菌(lactobacilli)的總數為多少乘以倍數？', opts:['434','296','386','248','62'], ans:'E' },
  { id:'2024-37', year:2024, q:'ICMSF指出風險程度中對一般人群具有極嚴重危害的病原菌包括哪些菌的檢驗：(1)金黃色葡萄球菌；(2)大腸桿菌O157:H7；(3)仙人掌桿菌；(4)肉毒桿菌神經毒素；(5)腸炎弧菌', opts:['1+2','2+3','2+4','1+5','2+5'], ans:'C' },
  { id:'2024-38', year:2024, q:'衛福部公告食品檢驗方法中提到可使用顯色培養基協助分離食品媒介中毒病原菌的類別，何者除外？(1)大腸桿菌O157；(2)金黃色葡萄球菌；(3)阪崎腸桿菌；(4)志賀氏菌；(5)單核球增生李斯特氏', opts:['(1)+(2)','(2)+(3)','(3)+(4)','(1)+(3)','(2)+(4)'], ans:'E' },
  { id:'2024-39', year:2024, q:'黴菌會產生黴菌毒素(Mycotoxin)的種類包括如下，何者除外？', opts:['Aspergillus flavus for Aflatoxins','Penicillium claviforme for Patulin','Aspergillus ochraceus for Ochratoxins','Fusarium spp. for Fumonisins','Actinomyces for Actinomycin'], ans:'D' },
  { id:'2024-40', year:2024, q:'常引起罐頭製品腐敗的平酸菌主要有哪兩種？(1)B. acidocaldarius；(2)B. brevis；(3)B. coagulans；(4)B. megaterium；(5)B. stearothermophilus；(6)B. thuringiensis', opts:['(1)、(2)','(2)、(3)','(3)、(4)','(4)、(6)','(3)、(5)'], ans:'E' },
  { id:'2024-41', year:2024, q:'生菌數(Aerobic plate count)的計數範圍為25-250 CFU，因為黴菌及酵母菌菌落大，因此，進行總數檢驗時，請問其計數範圍應該選擇多少？', opts:['25-250','20-80','15-150','15-300','10-150'], ans:'E' },
  { id:'2024-42', year:2024, q:'請問如下食品微生物標準檢驗體系所提出的方法何者為非標準方法？', opts:['國際食品法典委員會(CAC)','科學書籍和期刊公佈的方法','歐盟的國際標準委員會(ISO)所公告的方法','日本國家標準(JIS)','食品藥物管理署(TFDA)公告的食品微生物檢驗方法'], ans:'B' },
  { id:'2024-43', year:2024, q:'蒸汽滅菌時，如下物品裝載原則的敘述，何者錯誤？', opts:['儘量將同類物品放在一起滅菌','物品裝放時上下左右相互間均應間隔一定距離','將大包放在下層，而將較易滅菌的小包放在上層','金屬物品放下層，織物包放上層','纖維織物應使折疊的方向與水平面成垂直狀態'], ans:'C' },
  { id:'2024-44', year:2024, q:'區分A. acidocaldarius(酸熱脂環酸芽孢桿菌)與A. acidoterrestris(酸土脂環酸芽孢桿菌)的實驗室方法可包括如下，但何者除外？', opts:['接種於含有erythritol及bromphenol blue的BAM (pH 4.0), 然後在60℃培養3天，前者呈黃綠色，後者呈藍色','以氣相色層質譜儀分析脂肪酸ω-Cyclohexyl fatty acids C17及C19','核醣分型(ribotyping)','製作革蘭氏抹片觀察菌體特徵','培養在PCA(Plate Count Agar, pH 7.0)後觀察菌落特徵'], ans:'E' },
  { id:'2024-45', year:2024, q:'如果某學校的學童發生食品中毒是在午餐後2~4小時，症狀為：噁心、劇烈的反復嘔吐、腹痛、腹瀉，多為水樣糞便，伴有輕微發燒、頭痛、虛弱無力等。請問最可能的病原菌為何？', opts:['產生志賀毒素的大腸桿菌','金黃色葡萄球菌','李斯特氏菌','產氣莢膜梭菌','空腸彎曲菌'], ans:'B' },
  { id:'2024-46', year:2024, q:'如下病原菌在台灣衛福部公告的網站從未見到食品中毒或水媒介感染的案例？(1)仙人掌桿菌；(2)氣單胞菌；(3)金黃色葡萄球菌；(4)曲狀桿菌；(5)志賀氏菌；(6)致病性大腸桿菌', opts:['1及2','2及3','2及4','4及5','5及6'], ans:'C' },
  { id:'2024-47', year:2024, q:'如下病原菌所產生的食品中毒何兩者最常會導致患者死亡，因此廠房的環境監控必須將其列為目標菌？(1)諾羅病毒；(2)李斯特菌；(3)志賀氏菌；(4)沙門氏菌；(5)溶血性鏈球菌；(6)腸炎弧菌', opts:['1及2','2及3','2及4','4及5','5及6'], ans:'C' },
  { id:'2024-48', year:2024, q:'直接分離培養食品中產氣莢膜桿菌的檢測需要將稀釋檢體接種在何種培養基？', opts:['egg yolk agar(EYA)','Lactose-gelatin medium(LGM)','Iron milk medium','Cooked meat medium','含或不含egg yolk emulsion的Tryptose-sulfite-cycloserine agar (TSC)'], ans:'E' },
  { id:'2024-49', year:2024, q:'何種情況下需要操作金黃色葡萄球菌的最確數(MPN)計數方法？', opts:['預期含有少量金黃色葡萄球菌','預期含有大量金黃色葡萄球菌','預期大量產生腸毒素','預期含有少量腸毒素','預期含有嘔吐毒素'], ans:'A' },
  { id:'2024-50', year:2024, q:'3M Petrifilm Aerobic Count Plate (AC)方法用於食品生菌計數時的最大缺點為造成偽陰性的判讀結果，原因如下，但何者除外？', opts:['草綠色鏈球菌及藤黃微球菌當測試菌量低於10³ CFU/mL時均無法還原TTC','當兩菌的菌量提高到10⁸ CFU後，草綠色鏈球菌仍然無法還原TTC，而藤黃微球菌則呈現TNTC','白色念珠菌相較於其它念珠菌，顯示對TTC的能力還原不佳','對菌量大於100 CFU的大腸桿菌的計數效果不佳','Enterococcus faecalis會液化Petrifilm AC而淡化TTC的呈色反應，而不易判讀'], ans:'D' },
  { id:'2024-51', year:2024, q:'包裝飲用水檢測綠膿桿菌的公告方法建議過濾檢體量及培養基為何？', opts:['100 mL/m-Endo agar','25 mL/Pseumonas F agar','200 mL/milk agar','100 mL/M-PA-C agar','50 mL/KF agar'], ans:'D' },
  { id:'2024-52', year:2024, q:'大腸桿菌的檢驗公告方法建議操作IMViC四種試驗，其中何種試驗需要在35℃培養96小時才能提出最後報告？', opts:['胰化蛋白腖培養液(Tryptone or Tryptophane Broth)','運動性試驗培養基(Motility test medium)','歐普氏培養液(VP Broth)','科塞爾氏檸檬酸鹽培養液(Koser\'s Citrate Broth)','甲基紅培養液(MR Broth)'], ans:'D' },
  { id:'2024-53', year:2024, q:'衛福部新公告的阪崎腸桿菌(Cronobacter sakazakii)檢驗方法主要特點的敘述，何者是正確的？(a)包括定性及MPN定量方法；(b)與其他菌的重要區分試驗包括TSA產黃色素試驗和sorbitol發酵試驗；(c)檢體量為100 g(mL)；(d)需要取2管各50 mL的增菌液進行離心；(e)增菌液接種的培養基為MacConkey與ESA顯色培養基二種平板', opts:['a、b、c','b、c、d','c、d、e','a、b、d','b、c、e'], ans:'B' },
  { id:'2024-54', year:2024, q:'如下有關於食品沙門氏菌或其他病原菌的塗抹物(Swab)檢體的敘述，何者錯誤？', opts:['以棉棒採檢時，需先將棉棒稍微以採檢液如蛋白腖緩衝液等浸溼，再塗抹採檢對象食品的表面','以無菌操作折斷塗抹物木柄或以無菌剪刀將塗抹棒之頭部置於無菌含蓋試管內，加蛋白腖緩衝液5 mL','將試管蓋旋緊，於10秒內來回叩擊手心使其劇烈振盪至少50次，或以旋渦混合器充分振盪至塗抹物頭部之棉絮鬆開','取溶出液1 mL，置於含無菌蛋白腖緩衝液9 mL之試管內，於35℃培養24±2小時後，供作檢液','直接以乾燥的無菌棉棒塗抹食品檢體的表面，然後折斷塗抹物木柄將塗抹物之頭部置於含有無菌蛋白腖緩衝液10 mL之涵蓋試管內，於35℃培養24±2小時後，供作檢液'], ans:'E' },
  { id:'2024-55', year:2024, q:'檢驗食品中大腸桿菌O157：H7與單核球增多性李斯特菌時，需先將檢體分別接種mBPWp增菌培養液以及BLEB增菌培養液，然後再加入三種抑菌劑/抗微生物劑，其可能原因包括如下，何者除外？', opts:['保存之食品原料中的病原菌常為受傷菌，在含有抑菌劑的環境不易復甦','分別經過5和4小時才加入抑菌劑的原因為抑制雜菌的生長','兩種菌的選擇性增菌培養基抑菌劑均含有吖啶黃素溶液','如果在接種檢體後培養隔夜後才加入抑菌劑，則檢體中的雜菌會過度生長，不易分離出標的菌','加入三種抑菌劑前的增菌培養基屬於區分性培養基，有利於區分病原菌與雜菌，而加入後則屬於滋養選擇性培養基，有利於滋養及選擇出病原菌'], ans:'E' },
  { id:'2024-56', year:2024, q:'罐頭食品的商業殺菌(無菌)方法之定義包括如下，何者除外？', opts:['殺菌程度足以使食品中有害人體健康之活性微生物或孢子存在','可抑制腐敗性微生物的活性','可使該產品在有效保存期限內之常溫儲運過程中，該等微生物不得生長','有效保存期限內之常溫儲運過程中，該等微生物不會產生毒素','相當於高溫高壓殺菌方法，完全去除芽孢菌，保存期限較為長久'], ans:'E' },
  { id:'2024-57', year:2024, q:'如下有關食品的微生物檢驗侷限性敘述中，何者錯誤？', opts:['當正確使用並與經過確效的加工程序控制相結合，檢驗可提供有效的產品安全和穩定性資訊','檢驗並不能保證產品的安全性','當食品中可導致危害的致病菌以低濃度存在，並且盛行率(prevalence)較低、且易變時，檢驗仍然可提供正確的安全資訊','食品中致病性微生物的分佈是不均勻的，因此，當樣品採檢自一批產品的可接受部分時，則檢驗可能無法檢測出該批次產品中的微生物','食品安全通常是多種因素作用的結果，它主要透過食品供應鏈中適當的預防性、預先反應的措施來確證，而不是僅透過微生物檢驗來達到'], ans:'C' },
  { id:'2024-58', year:2024, q:'美國藥典對營養及膳食補充品的微生物檢驗建議檢驗如下四種病原菌，但何者除外？', opts:['梭菌(Clostridium species)','大腸桿菌(Escherichia coli)','Staphylococcus aureus','Salmonella spp.','Listeria monocytogenes'], ans:'E' },
  { id:'2024-59', year:2024, q:'美國藥典對營養及膳食補充品的梭菌(Clostridium species)檢驗的如下相關敘述，何者錯誤？', opts:['檢體以TSB稀釋10倍後，需要用80°C水浴處理10分鐘','水浴處理後取10 mL加至90 mL Reinforced clostridial medium','增菌液厭氧培養後接種的平板培養基為Columbia agar w/gentamicin','接種的平板培養基需培養在35°C的厭氧環境，36~48 h，再觀察平板','鑑定疑似菌之Catalase試驗的試劑濃度為15% H₂O₂'], ans:'A' },
  { id:'2024-60', year:2024, q:'單核球增多性李斯特菌的分離培養基OXA，PALCAM及MOX平板培養基均含有何種化學物，因此培養後典型的生長菌落周邊呈黑色？', opts:['CAMP因子','鼠李糖(Rhamnose)','硫化鐵','傘狀運動因子(Umbrella motility factor)','七葉苷(Esculin)'], ans:'E' },
  { id:'2024-61', year:2024, q:'仙人掌桿菌檢驗使用的增菌培養基為TSPB，其係由TSB加上何種化學品？', opts:['phenolic compound','phosphate','purine','pyrimidine','polymyxin'], ans:'E' },
  { id:'2024-62', year:2024, q:'如下有關公告之空腸彎曲菌偵測與鑑定的生理及生化試驗敘述，何者最可能錯誤？', opts:['可將增菌培養基放在42°C的溫度培養','馬尿酸鹽(Hippurate)水解試驗有助於空腸彎曲菌的鑑定','分離的培養基為mCCDA平板培養基','常用於鑑定此菌的抗生素抑制試驗包括萘啶酮酸(Nalidixic acid)頭孢噻吩(Cephalothin)','將分離平板倒置培養於37°C的微氧環境培養箱'], ans:'E' },
  { id:'2024-63', year:2024, q:'適合彎曲菌與產氣莢膜梭菌生長之微氧與厭氧環境的氧氣濃度分別為多少？', opts:['2%,0%','10%,0%','5%,0%','3%,0.5%','8%,0.3%'], ans:'C' },
  { id:'2024-64', year:2024, q:'如下有關腸炎弧菌檢驗的介紹中，何者正確？', opts:['分離及增菌培養基需要加入4%以上的鹽','可利用蔗糖，因此在TCBS平板的生長菌落呈綠色','增菌培養基需要將pH值調至9.3','可先利用生化八管進行初步鑑定後，若為疑似菌，再操作公告方法的傳統試驗確認','需要操作黏絲試驗(String Test)及El Tor(艾托)溶血試驗'], ans:'D' },
  { id:'2024-65', year:2024, q:'下列何者非避免分子生物實驗室汙染的方法？', opts:['使用具有濾膜(filter)的無菌吸管尖(tip)','操作過程適時更換手套','為求實驗方便可將DNA萃取液反覆冷凍解凍使用','實驗結束以1%漂白水擦拭桌面','每日工作結束以UV照射檯面30 mins以上'], ans:'C' },
  { id:'2024-66', year:2024, q:'如下有關衛福部公告包裝飲用水綠膿桿菌的檢驗的敘述，何者正確？(a)過濾的檢體量為250 mL；(b)建議分離的培養基為牛乳培養基；(c)分離的培養基為m-PA-C洋菜培養基；(d)建議分離的培養基為cetrimide agar；(e)將分離平板倒置培養於42°C', opts:['a、b','c、d','a、c','b、e','c、e'], ans:'E' },
  { id:'2024-67', year:2024, q:'操作API生化鑑定套組時，常常會將何菌鑑定為霍亂弧菌？', opts:['Burkholderia cepacia','Plesiomonas shigellosis','Aeromonas hydrophila','Enterobacter cloacae','Vibrio alginolyticus'], ans:'C' },
  { id:'2024-68', year:2024, q:'如下有關衛福部公告的致病性腸炎弧菌(V. parahemolyticus)檢驗方法的敘述何者錯誤？', opts:['是一種嗜鹽性細菌','含有耐熱直接溶血毒素(TDH)以及耐熱相關溶血素(TRH)','在夏秋季節，於日本及台灣此菌食品中毒占首位','當每克食品污染菌量達到10²~10⁴ CFU時就可發生中毒','腸炎弧菌在TCBS agar的菌落形態呈圓形之綠色或藍色菌落'], ans:'D' },
  { id:'2024-69', year:2024, q:'仙人掌桿菌(Bacillus cereus)與其它相近的芽孢桿菌菌種的最主要區分特性為何？', opts:['在MYP平板上生長菌落呈白色，菌落周圍有濃厚的半透明沉澱環帶','在BAP培養基菌落具有β溶血性','根狀生長試驗(Rhizoid growth test)呈陽性','蛋白質毒素晶體試驗(Protein toxin crystal test)呈陰性','運動性試驗呈陽性'], ans:'D' },
  { id:'2024-70', year:2024, q:'衛福部新公告的大腸桿菌O157之檢驗方法使用的增菌培養基為mBPWp，其中小寫的"p"代表此培養基含有何種化學品？', opts:['peptone','polypeptone','poxymyxin','penicillin','pyruvate'], ans:'E' },
  { id:'2024-71', year:2024, q:'衛福部新公告的大腸桿菌O157之檢驗方法建議須將檢體加至增菌培養基mBPWp，培養5小時候分別加入過濾除菌的3種適當濃度的哪些抗微生物劑？(a)acriflavin solution；(b)cefsulodin solution；(c)nalidixic acid solution；(d)cycloheximide solution；(e)vancomycin solution', opts:['a、b、c','a、c、d','b、c、e','a、b、e','c、d、e'], ans:'D' },
  { id:'2024-72', year:2024, q:'衛福部公告志賀氏菌檢驗增菌時要在何種環境培養？', opts:['因為是嗜氧菌，需在37℃的嗜氧環境','因為是嗜高溫菌，需在44℃的嗜氧環境','因為厭氧環境比嗜氧環境生長佳，需在42℃以上的厭氧環境','因為是厭氧菌，需在42℃以上的厭氧環境','因為是嗜高溫厭菌，需在44℃以上的厭氧環境'], ans:'C' },
  { id:'2024-73', year:2024, q:'下列有關小腸結腸炎耶氏菌的敘述中，何者不正確？', opts:['主要來源為動物，人類感染以口糞傳染為主，而非叮咬','此菌的致病機轉包括侵入以及產生腸毒素','可在冷凍食品存活非常長的時間','此菌與產毒性大腸桿菌同樣地可產生熱不穩定腸毒素(heat-labile enterotoxin)','此屬的另一腹瀉病原菌為Y. pseudotuberculosis'], ans:'D' },
  { id:'2024-74', year:2024, q:'食品或化妝品檢驗時使用的標準菌株不可超過多少代？', opts:['15代','10代','8代','7代','5代'], ans:'E' },
  { id:'2024-75', year:2024, q:'進行細菌培養時，每日應記錄溫度兩次，紀錄的間隔為多少小時以上？', opts:['2小時','3小時','4小時','5小時','8小時'], ans:'C' },
  { id:'2024-76', year:2024, q:'下列何者為real time PCR技術應用於食品檢驗的優點？', opts:['適合於分析活菌與死菌比例','檢驗標的僅限於微生物','可設計內部控制組(IPC/IAC)避免偽陰性','可分析毒素蛋白的結構與種類','對於食品中抗生素殘留有良好的靈敏度'], ans:'C' },
  { id:'2024-77', year:2024, q:'以濾膜法測定樣品時，使用之濾杯刻度合格在何種誤差範圍內？', opts:['±1%','±2.5%','±5%','±3%','±3.5%'], ans:'B' },
  { id:'2024-78', year:2024, q:'衛福部TFDA所公告之「實驗室品質管理規範－微生物領域測試結果之品質管制(107.06.03)」中，下列何者「非」該文對於培養基驗證試驗的描述？', opts:['確認培養基上菌落大小與數量','新配製培養基應符合精密度管制範圍：3.27x對數平均差異值','不得使用具感染性的RG 2級病原菌作為對照菌株','需使用陽性菌株','培養基驗證試驗需比較前後兩批培養基'], ans:'C' },
  { id:'2024-79', year:2024, q:'關於前增殖步驟用於檢驗食品病原菌的描述，何者為非？', opts:['無法針對特定目標微生物增殖','藉由前增殖可以稀釋抑制微生物生長的物質','可以協助恢復受損細胞的活性','只能增殖活細胞','可增加檢驗方法的靈敏度'], ans:'A' },
  { id:'2024-80', year:2024, q:'下列何者非為國際上快速微生物檢驗方法的第三方方法驗證單位？', opts:['AFNOR','MicroVal','FAPAS','AOAC RI (PTM)','AOAC RI (OMA)'], ans:'C' },
  { id:'2024-81', year:2024, q:'下列描述何者為非？', opts:['美國FDA設有食品計畫微生物方法驗證指南之備忘錄以作為轄下實驗室採用快速方法時的參考','TAF不接受實驗室採用快速微生物方法作為認證項目','國內食藥署網頁所登載之公開食品篩檢資訊包含快速微生物檢驗方法','即使實驗室已經採用經認證之的快速方法，發生爭議時，仍應以政府公告方法為準','國內食藥署已將分子生物學檢驗方法納入其公告方法之一'], ans:'B' },
  { id:'2024-82', year:2024, q:'以下何種中毒微生物的分子生物檢測技術方法，在國內TFDA公告檢驗方法中已有最廣泛之應用？', opts:['Real-time PCR','數位PCR','高通量微流陣列PCR','Multiplex PCR','LAMP'], ans:'A' },
  { id:'2024-83', year:2024, q:'以下微生物分生檢驗技術何者並非使用核酸為鑑定標的？', opts:['短片段重複序列多型性分析(STR，Chimerism Test)','MALDI-TOF','Real-time PCR','16S rRNA定序','LAMP'], ans:'B' },
  { id:'2024-84', year:2024, q:'下列何者革蘭氏陽性桿菌自2017年5月衛福部公告修正檢驗方法後，可以使用分子生物學方法與仙人掌桿菌(Bacillus cereus)進行區分？', opts:['B. anthracis','B. subtilis','B. weihenstephanensis','B. thuringiensis','Geobacillus sterothermophilus'], ans:'D' },
  { id:'2024-85', year:2024, q:'下列何者並非金黃色葡萄球菌食物中毒判明標準成立條件之一？', opts:['自可疑食物中檢出腸毒素之存在','自兩名以上病患之臨床檢體中分離出相同之菌株','自可疑食物中檢出之菌數大於10⁵ CFU','自可疑菌株中檢出毒素基因之存在','需要同時操作傳統的定性與定量方法'], ans:'E' },
  { id:'2024-86', year:2024, q:'台灣的二軌健康食品審查時，衛生主管單位只審查何項內容？', opts:['功效性','安全性','安定性','有效成分含量','衛生安全'], ans:'D' },
  { id:'2024-87', year:2024, q:'現行可用核酸進行分子生物檢測之項目，不包含下列何者？', opts:['志賀氏菌','A肝病毒','腸毒素','毒性基因','動物來源素食'], ans:'C' },
  { id:'2024-88', year:2024, q:'於腸道菌相相關領域滅菌過乳酸菌培養液屬於如下何者？', opts:['Probiotics','Prebiotics','Synbiotics','Postbiotics','Probiogenics'], ans:'D' },
  { id:'2024-89', year:2024, q:'下列何者使用為台灣保健食品素材百分比最大？', opts:['動物','植物','微生物','礦物質','深層海水'], ans:'C' },
  { id:'2024-90', year:2024, q:'關於粧品特定微生物檢驗流程中，何者為非？', opts:['臺灣夏天常發生化妝品媒介致病菌的臨床案例發生','汙染粧品之微生物會導致容器膨脹而容易發現','MLB為粧品培養液，其中含有中和劑可中和部分防腐劑功效，讓檢驗過程中更有機會篩選出不合宜菌','白色念珠菌為橢圓形酵母菌，常棲息於人類之口腔、喉部、大腸、皮膚及陰道等，為婦科感染之致病菌之一','化妝品廠對產品的最終品管除了操作衛福部公告的衛生標準外，各廠家仍有需要監測可能影響自身產品的重要汙染菌'], ans:'B' },
  { id:'2024-91', year:2024, q:'消化器官中何者之細菌數目最少？', opts:['胃','小腸','大腸','口腔','直腸'], ans:'A' },
  { id:'2024-92', year:2024, q:'台灣衛福部公告的化粧品微生物容許基準中，以下何者為非？', opts:['不得檢出大腸桿菌、綠膿桿菌、金黃色葡萄球菌','一般粧品生菌數需在1,000 CFU/g(mL)以下','接觸黏膜處部位之化粧品生菌數需在100 CFU/g(mL)以下','不得檢出酵母菌-白色念珠菌','不得檢出洋蔥伯克氏菌複合群(Burkholderia cepacia complex)'], ans:'E' },
  { id:'2024-93', year:2024, q:'有關良好的微生物品質控管的敘述，下列何者非？', opts:['人員只要嚴格遵守SOP執行試驗即可，實驗偏差主要是人員操作問題','人、機、料、法、環及測試，5M1E缺一不可','操作動線應注意由單一動線乾淨區到髒污區','環境汙染菌監控非常重要，尤其是針對空氣、水與包材','平整的工作檯面之微生物監控可利用接觸平板操作'], ans:'A' },
  { id:'2024-94', year:2024, q:'化妝品中不可檢出綠膿桿菌，當鑑定產色素的疑似菌時，最好接種如下兩種試驗項目，才能獲得與其他產色素菌最大的區分能力？(a)Arginine decarboxylase broth，培養在37℃；(b)YE瓊脂斜面培養在42℃，24小時；(c)Malonate broth，培養在37℃；(d)Gelatin liquefaction培養在25℃；(e)鞭毛染色', opts:['a、b','b、c','c、d','b、d','d、e'], ans:'D' },
  { id:'2024-95', year:2024, q:'檢驗化妝品中的白色念珠菌時，通常需對疑似菌接種0.5~1.0 mL胎牛或馬血清，培養1.5~2小時候，以顯微鏡觀察，其主要的目的是觀察何種構造？', opts:['梳子狀的菌絲構造','發芽管的產生','菌絲及假菌絲(pseudohyphae)的產生','厚膜孢子的產生','孢子囊的孢子的產生'], ans:'B' },
  { id:'2024-96', year:2024, q:'唐菖蒲伯克氏菌（Burkholderia gladioli）產毒素菌株的主要特性敘述，何者是正確的？(a)大多菌株為氧化酶陰性；(b)可在一般細菌生長的TSA、BAP、EMB上生長良好；(c)在EYA agar可產生卵磷脂酶；(d)可還原利用麥芽糖及乳糖；(e)可氧化利用O/Inositol、O/Sorbitol、O/Adonitol', opts:['a、b、c','b、c、d','c、d、e','a、c、e','a、d、e'], ans:'D' },
  { id:'2024-97', year:2024, q:'在台灣志賀氏菌常引起食品媒介桿菌性痢疾，最常見的兩種病原菌(血清群)為？', opts:['Shigella flexneri與S. boydii','S. flexneri與S. dysenteriae','Shigella sonnei與S. boydii','S. flexneri與S. sonnei','Shigella enterocolitis與S. sonnei'], ans:'D' },
  { id:'2024-98', year:2024, q:'唐菖蒲伯克氏菌（Burkholderia gladioli）產邦克烈酸的各種影響因素，依影響大小的排列為何？', opts:['溫度＞菌株＞培養基＞pH值＞時間','菌株＞培養基＞溫度＞pH值＞時間','溫度＞培養基＞菌株＞pH值＞時間','時間＞菌株＞溫度＞培養基＞pH值','菌株＞溫度＞培養基＞pH值＞時間'], ans:'E' },
  { id:'2024-99', year:2024, q:'與阪崎腸桿菌(Cronobacter sakazakii)最相近的腸桿菌科菌種為何菌？', opts:['Burkholderia cepacia','Enterobacter aerogenes','Klebsiella pneumoniae','Enterobacter cloacae','Serratia marcescens'], ans:'D' },
  { id:'2024-100', year:2024, q:'以CNS方法與Petrifilm偵測食品中大腸桿菌群(Coliform)及大腸桿菌時，使用Petrifilm的最大缺點為造成偽陰性結果，也就是？', opts:['獲得大腸桿菌群的菌數較高','僅能部份偵測出大於1,000 cfu Coliform','僅能部份偵測100~1,000 cfu Coliform','完全不能偵測少於100 cfu的大腸桿菌群生長','無法提供小於100 cfu的大腸桿菌生長'], ans:'E' },
  // 2025 第十三屆
  { id:'2025-001', year:2025, q:'高壓蒸氣滅菌時物品的裝載原則如下，但何種組合中包含有錯誤的操作？①儘量將同類物品放在一起滅菌。②物品裝放時上下左右相互間均應間隔一定距離。③大包放在上層，較易滅菌的小包放在下層。④金屬物品放下層，織物包放上層。⑤物品裝放最好貼靠門和四壁以增加滅菌效能。⑥金屬包應平放，盤、碟、碗等應處於豎立的位置。⑦纖維織物應使折疊的方向與水平面成垂直狀態。⑧玻璃瓶等應開口向下或側放以利蒸氣進入和空氣排出。', opts:['1，2，3','4，5，6','2，3，4','6，7，8','3，7，8'], ans:'B' },
  { id:'2025-002', year:2025, q:'全蛋檢測方案，何種檢驗結果為合格？（乾燥及冷凍全蛋，三級法，大腸菌群，n=5，c=2，m=10，M=10³）①5個檢體得到的菌數分別為0、1、2、68及123；②其中1個檢體的菌數大於2.2×10³；③5檢體的菌數為5、7、9、117及249；④5檢體的菌數為0、0、10、17、36。', opts:['1及3','2及3','3及4','1及4','2及4'], ans:'A' },
  { id:'2025-003', year:2025, q:'進行產氣莢膜桿菌之檢驗時若接種tryptose-sulfite-cycloserine agar w/egg Yolk（EY），生長的菌落將呈現何種菌落特徵？', opts:['帶有白色環帶的黑色菌落','帶有彩虹螢光的黃色菌落','帶有黑色環帶的白色菌落','帶有彩虹樣環帶的黑色菌落','帶有黑色環帶的黑色菌落'], ans:'A' },
  { id:'2025-004', year:2025, q:'化妝品中不可檢出白色念珠菌，當鑑定時，需要將疑似酵母菌接種至含1%聚山梨醇酯80之玉米粉瓊脂培養基，其目的為觀察酵母菌的那些構造？(a)發芽管的產生；(b)大分生孢子的產生；(c)菌絲及假菌絲(pseudohyphae)的產生；(d)厚膜孢子的產生；(e)孢子囊的孢子的產生。', opts:['a、b','b、c','c、d','c、e','d、e'], ans:'C' },
  { id:'2025-005', year:2025, q:'如下的特性與霍亂弧菌(V. cholerae)有關，但何者「除外」？', opts:['氧化酶陽性','對O/129敏感性試驗10及150μg紙錠均呈敏感性（不生長）','不能在含0%及3%氯化鈉的培養基生長','不能在含6%及8%氯化鈉的培養基生長','在TCBS的生長菌落呈黃色'], ans:'C' },
  { id:'2025-006', year:2025, q:'曲狀桿菌具有如下特性，但何者「除外」？', opts:['氧化酶陽性','在42°C可生長','分離的培養基為未含血液之曲狀桿菌改良培養基(mCCDA)','鑑定試驗包括在1% glycine、3.5% NaCl的生長試驗','在無菌環境可以生長良好'], ans:'E' },
  { id:'2025-007', year:2025, q:'直接分離培養食品中產氣莢膜桿菌的檢測需要將稀釋檢體接種在何種培養基？', opts:['egg yolk agar(EYA)','Lactose-gelatin medium(LGM)','Iron milk medium','Cooked meat medium','含或不含egg yolk emulsion的Tryptose-sulfite-cycloserine agar(TSC)'], ans:'E' },
  { id:'2025-008', year:2025, q:'衛福部新公告的阪崎腸桿菌(Cronobacter sakazakii)檢驗方法主要特點的敘述，哪一選項正確？(a)包括定性及MPN定量方法；(b)與其他菌的重要區分試驗包括TSA產黃色素試驗和sorbitol發酵試驗；(c)檢體量為100g(mL)；(d)需要取2管各50mL的增菌液進行離心；(e)增菌液接種的培養基為MacConkey與ESA顯色培養基二種平板。', opts:['a、b、c','b、c、d','c、d、e','a、b、d','b、c、e'], ans:'B' },
  { id:'2025-009', year:2025, q:'與阪崎腸桿菌(Cronobacter sakazakii)最相近的腸桿菌科菌種為何菌？', opts:['Burkholderia cepacia','Enterobacter aerogenes','Klebsiella pneumoniae','Enterobacter cloacae','Serratia marcescens'], ans:'D' },
  { id:'2025-010', year:2025, q:'乳酸菌所分泌之外泌體(exosomes)主要被視為下列何者？', opts:['新世代微生物','益生質','益源質(Biogenics)','傳遞保健食品功效成分之信使(messenger)','合生元(Synbiotics)'], ans:'D' },
  { id:'2025-011', year:2025, q:'豬的萊克多巴胺危害風險評估與豬的沙門氏菌媒介的危害評估主要不同處在於前者的特性包括如下，但何者除外？', opts:['在豬肉內濃度的分布通常較為均勻','濃度會隨著時間發生改變','危害通常由累積效應（cumulative effects）所造成','其可被控制至人類最少的暴露殘留量','傳播方式包括直接攝取，但通常不包括二次傳播而散佈'], ans:'B' },
  { id:'2025-012', year:2025, q:'下列乳酸菌相關成分何者之耐熱性最佳？', opts:['Probiotics','Prebiotics','Synbiotics','Postbiotics','Probiogenics'], ans:'D' },
  { id:'2025-013', year:2025, q:'健康食品功效評估規定依定要使用人體試驗之項目有幾項？', opts:['4項','5項','6項','8項','10項'], ans:'C' },
  { id:'2025-014', year:2025, q:'一軌與二軌健康食品審查時，何項內容是二軌審查項目？', opts:['功效性','安全性','安定性','有效成分含量','基因毒理學'], ans:'D' },
  { id:'2025-015', year:2025, q:'下列關於快速試驗（如革蘭氏染色、觸酶或氧化酶試驗）搭配生化鑑定套組流程之敘述，何者錯誤？', opts:['氧化酶試驗可快速判斷細菌是否為葡萄糖非發酵菌','觸酶試驗常用於初步區分葡萄球菌屬與鏈球菌屬','快速試驗結果可輔助判斷使用何種生化鑑定套組','API套組的優點為在操作前，並不須進行任何快速試驗','快速試驗通常於幾分鐘內操作完成，供後續選擇適用套組'], ans:'D' },
  { id:'2025-016', year:2025, q:'下列有關於API或RapID鑑定套組使用後之「結果判讀」與「軟體輸入」的敘述，何者正確？', opts:['API套組需將所有反應結果轉換成條碼後再上傳系統','RapID套組反應結果僅供參考，無法產出可信度分數','所有鑑定軟體皆不需使用網路連線，可以離線操作','判讀顏色以一般標準光源觀察，避免誤判呈色','若套組反應結果呈多項陽性，代表鑑定可信度一定高'], ans:'D' },
  { id:'2025-017', year:2025, q:'下列有關API與RapID兩種生化鑑定套組的差異，敘述何者正確？', opts:['API反應時間較短，一般可於4小時內判讀','RapID需滴加礦物油防止菌液揮發，API則不需要','API需根據各反應槽特性決定是否將菌液加滿反應槽，而RapID則不需要','RapID無需任何軟體輸入，只須人工比對顏色反應','RapID套組無須調整菌液濃度，可直接接種使用'], ans:'C' },
  { id:'2025-018', year:2025, q:'在操作血清試驗或生化鑑定套組前，若發現原始選擇性平板培養基上出現2種不同形態菌落，應如何處理以確保鑑定結果正確？', opts:['任選其中一種菌落進行操作即可，不影響結果','將兩種菌落混合後調整菌液濃度，以提高檢出率','應先以滋養平板培養基分離及純化菌落，再挑選單一菌落進行血清試驗或生化鑑定套組','立即進行氧化酶與觸酶試驗，以節省操作時間','視菌落顏色選擇是否為目標菌，再直接進行血清試驗或生化鑑定套組'], ans:'C' },
  { id:'2025-019', year:2025, q:'以生長菌落進行氧化酶試驗(Oxidase test)，當菌落接觸到氧化酶試劑後陽性反應結果為？', opts:['將菌落塗在濾紙上，然後加入試劑後變藍色','將加入菌落與試劑混合，然後在紙片上順時針旋轉後由藍色顆粒凝集','試劑接觸到載玻片上的菌體產生大量氣泡','將菌落塗在載玻片上，然後加入試劑後呈現藍綠色','將細菌懸浮在試管中的生理食鹽水，然後加入試劑呈現黃色'], ans:'A' },
  { id:'2025-020', year:2025, q:'公告的食品中氣單胞菌檢驗方法，建議分離此菌所用的分離培養基為？', opts:['澱粉酚紅安匹西林培養基(starch phenol red ampicillin agar)','膽粟糖苷培養基(bile esculin agar)','苯丙胺酸脫胺基酶培養基(phenylalanine deaminase agar)','CIN培養基(cefsulodin-ingasan novobiocin agar)','厭氧蛋黃培養基(anaerobic egg yolk agar)'], ans:'A' },
  { id:'2025-021', year:2025, q:'在進行微生物檢測時，使用之吸管及量筒等，其體積誤差不得超過多少？', opts:['1%','2.5%','5%','10%','0.5%'], ans:'B' },
  { id:'2025-022', year:2025, q:'當顧客有抱怨檢測結果的正確性時，應如何進行重新檢測確認？', opts:['原檢測人員','換另一位同仁進行檢測','原審查人員','換另一位審查人員','由外部具資格之第三方檢測單位執行'], ans:'B' },
  { id:'2025-023', year:2025, q:'Real-time PCR的優點不包括下列哪一項？', opts:['專一性佳','可為核酸分析','偵測靈敏度高','檢測時間短','不容易遭到汙染'], ans:'E' },
  { id:'2025-024', year:2025, q:'關於蛋白質體鑑定中MALDI-TOF MS的描述，何者正確？', opts:['偵測的是細胞RNA','分析的是DNA片段長度','利用質譜分析產生ribosomal protein譜圖','適用於植物品種鑑定','可用於細菌種別鑑定'], ans:'C' },
  { id:'2025-025', year:2025, q:'化粧品中不得檢出的白色念珠菌（Candida albicans）常用何種方法輔助鑑定？', opts:['TSIA三糖鐵斜面試驗','發芽管試驗','咖啡酸產生試驗','觸酶及凝固酶試驗','禾本科植物提取物試驗'], ans:'B' },
  { id:'2025-026', year:2025, q:'以下哪一種微生物菌株並非所有國際標準皆共同使用於化妝品防腐效能試驗中？', opts:['Staphylococcus aureus','Pseudomonas aeruginosa','Zygosaccharomyces rouxii','Candida albicans','Bacillus cereus'], ans:'B' },
  { id:'2025-027', year:2025, q:'食品中曲狀桿菌(Campylobacter spp.)的檢驗，如下敘述中，何者錯誤？', opts:['此菌是微好氧菌，需培養在5% O₂、10% CO₂及85% N₂的環境中','增菌培養基稱為曲狀桿菌增菌培養液，含有cefoperazone、trimethoprim lactate、vancomycin及cycloheximide','分離培養基為Abeyta-Hunt-Bark agar及Modified Campylobacter blood-free agar(mCCDA)','欲分離C.fetus時，將分離培養基培養的環境為42°C微好氧培養24-48小時','欲分離C.jejuni時，將分離培養基培養的環境為42°C微好氧培養24-48小時'], ans:'D' },
  { id:'2025-028', year:2025, q:'食品中霍亂弧菌(Vibrio cholerae)的檢驗，如下敘述中，何者錯誤？', opts:['此菌非為嗜鹽菌，不需使用含有2~3%氯化鈉的營養培養就能生長','增菌培養基稱為鹼性蛋白腖水(APW)，pH值調至8.5±0.2','分離培養基為TCBS培養基','霍亂弧菌(Vibrio cholerae)在TCBS培養基生長菌落通常較小，呈綠色','細菌本體抗血清凝集試驗操作包括使用O1型及O139型抗血清'], ans:'D' },
  { id:'2025-029', year:2025, q:'根據TFDA化粧品規定，下列哪類產品微生物限量應低於100 CFU/g(mL)，且不得檢出特定致病菌？', opts:['嬰兒用防曬乳','指甲油','普通洗髮精','定型液','眼部卸妝液'], ans:'A' },
  { id:'2025-030', year:2025, q:'危害等級分群(risk-based Grouping group)時，將食品中毒細菌歸類為第二類RG-2，通常這類菌為何？', opts:['不太可能引起人類疾病','可引起疾病但很少引致嚴重疾病，對工作者可能具有危險性，不可能散播到社區，通常有預防方法和治療方法','可引起致人類嚴重或致死疾病，可能散播到社區，通常無預防及治療方法','可引起嚴重或致死疾病，對工作者非常危險，可能散播到社區，通常有預防及治療方法'], ans:'B' },
  { id:'2025-031', year:2025, q:'檢體中微生物定量檢驗方法的確效，有關耐用性(Ruggedness)的如下敍述，何者錯誤？', opts:['耐用性是指相同的樣品在正常的實驗條件發生變化時，所得檢驗結果的精密度','耐用性可視為微生物檢驗方法在檢驗結果上抵抗操作和環境變化的能力','方法使用者應優先測定此確效參數，同時確效過程中，應注意樣品的一致性','在樣品中接種一定數量的試驗菌，採用藥典/食品公告方法和替代方法，分別由相同人員，在相同時間，使用相同的試劑進行檢驗','對檢驗結果進行統計分析，以相對標準差(RSD)來評估兩種方法的耐用性差異，可接受的變異係數範圍為10~15%'], ans:'D' },
  { id:'2025-032', year:2025, q:'使用MALDI-TOF MS進行微生物鑑定的主要優勢是？', opts:['可同時進行抗生素敏感性試驗','可觀察菌落的色素產生','可快速比對微生物質譜特徵','可直接觀察菌體結構','可進行遺傳變異分析'], ans:'C' },
